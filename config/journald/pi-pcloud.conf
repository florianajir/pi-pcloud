# Raspberry Pi OS ships Storage=volatile: the journal lives in RAM under a cap of
# 10% of /run, which this stack fills in about a day and a half, and a reboot
# erases it. Every container logs here, so that horizon is also docker logs'.
#
# Capped by size rather than by age: the size is what has to fit on the disk,
# and an age cap would discard history there is still room for.
[Journal]
Storage=persistent
SystemMaxUse=1G
