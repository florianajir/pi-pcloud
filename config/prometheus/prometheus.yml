# Scrape targets for the pi-pcloud stack. See docs/MONITORING.md.
#
# Static, not service-discovered: docker_sd_configs would need the Docker socket
# mounted into a container whose job is to read counters. The cost is that a
# disabled service shows as DOWN on the targets page - expected, and nothing
# alerts on it.

global:
  # 30s rather than the 15s default: halves both the head-block series volume
  # and the scrape cost on three shared cores.
  scrape_interval: 30s
  scrape_timeout: 10s
  # Unused - no rules here - but a future recording rule inherits it.
  evaluation_interval: 30s
  external_labels:
    monitor: pi-pcloud

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    # Unauthenticated on the routed port; the forward-auth covers the router,
    # not a container dialling :3000.
    static_configs:
      - targets: ["grafana:3000"]

  # The implicit `traefik` entrypoint, not websecure, where /metrics is a 404.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  # A second listener, not the port the portal answers on.
  - job_name: authelia
    static_configs:
      - targets: ["authelia:9959"]

  # metrics_listen_addr in config/headscale/config.yaml, set long before this.
  - job_name: headscale
    static_configs:
      - targets: ["headscale:9090"]

  # NTFY_METRICS_LISTEN_HTTP, not NTFY_ENABLE_METRICS - see compose.yaml.
  - job_name: ntfy
    static_configs:
      - targets: ["ntfy:9090"]

  # No separate telemetry listener, so this is the port Traefik routes.
  - job_name: n8n
    static_configs:
      - targets: ["n8n:5678"]

  # Two jobs, one container: each worker exports on its own port. Queue depths
  # and job outcomes are on microservices, HTTP and user counters on api.
  - job_name: immich-api
    static_configs:
      - targets: ["immich-server:8081"]

  - job_name: immich-microservices
    static_configs:
      - targets: ["immich-server:8082"]

  # Its gen_ai_* series carry the `user` label added by
  # config/agentgateway/config.yaml.
  - job_name: agentgateway
    static_configs:
      - targets: ["agentgateway:15020"]

  # LLAMA_ARG_ENDPOINT_METRICS in compose.yaml, on the same 8080 as the API.
  - job_name: llama-cpp
    static_configs:
      - targets: ["llama-cpp:8080"]
