; Loaded from conf.d after opcache-recommended.ini - hence the zz prefix, since
; PHP parses that directory alphabetically and the upstream file sets jit=1255.
;
; The image ships the tracing JIT with an 8M shared buffer. Installing an app
; from the Nextcloud UI has taken the whole site down with it: every Apache
; worker started dying on SIGSEGV, so Traefik had no live backend and answered
; 502 until the container was restarted. A restart alone fixes it, which puts
; the bad state in shared memory rather than in the app's files.
;
; The JIT is the suspected culprit, not a proven one - the crash has never been
; reproduced on demand - but it is the known-fragile piece of this stack on
; aarch64, and Nextcloud is I/O and database bound, so dropping it costs little.
; Opcode caching itself stays on; only the JIT goes away.
opcache.jit=disable
opcache.jit_buffer_size=0
