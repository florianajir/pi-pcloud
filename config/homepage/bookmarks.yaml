---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/bookmarks
#
# A single group, because `layout:` in settings.yaml gives this tab one entry.
# Adding a second top-level group here without a matching layout key would
# render it untabbed.
- Bookmarks:
          - Google:
                    - abbr: GO
                      href: https://www.google.com
                      icon: google
          - Protonmail:
                    - abbr: PM
                      href: https://mail.proton.me
                      icon: proton
          - Youtube:
                    - abbr: YT
                      href: https://www.youtube.com
                      icon: youtube
          - Github:
                    - abbr: GH
                      href: https://github.com/florianajir/pi-pcloud
                      icon: github
          - Reddit:
                    - abbr: RD
                      href: https://www.reddit.com
                      icon: si-reddit
          - Wikipedia:
                    - abbr: WP
                      href: https://www.wikipedia.org
                      icon: si-wikipedia
          - LinkedIn:
                    - abbr: IN
                      href: https://www.linkedin.com
                      icon: si-linkedin
          - X:
                    - abbr: X
                      href: https://x.com
                      icon: si-x
          - AliExpress:
                    - abbr: AE
                      href: https://www.aliexpress.com
                      icon: si-aliexpress
          - Raspberry Pi:
                    - abbr: RPI
                      href: https://www.raspberrypi.com
                      icon: si-raspberrypi
          - Framework:
                    - abbr: FW
                      href: https://frame.work
                      icon: si-framework
          # The upstream tmux wiki page that lists the default key bindings.
          - tmux wiki:
                    - abbr: TM
                      href: https://github.com/tmux/tmux/wiki/Getting-Started
                      icon: si-tmux
