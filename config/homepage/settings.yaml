---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

# providers:
#   openweathermap: openweathermapapikey
#   weatherapi: weatherapiapikey

title: pi-pcloud
description: Personal self-hosted services dashboard

# No `favicon:` here on purpose. It is a valid setting (a path under /app/public),
# but homepage only applies it after hydration, from SettingsProvider - the browser
# has already taken its icon from the server-rendered <link>s by then. Setting it
# made the tab flicker: the mark, then the browser's generic fallback once the
# swapped icon failed to render. compose.yaml instead overrides the stock
# /favicon-*.png, /homepage.ico and /apple-touch-icon.png with the pi-pcloud mark,
# so it is correct in the very first HTML and never replaced.

# https://gethomepage.dev/configs/settings/#quick-launch
# Opens by just typing on the dashboard (when the search widget is not focused).
# provider/target mirror the search widget in widgets.yaml so both behave alike.
quicklaunch:
  provider: duckduckgo
  target: _blank
  searchDescriptions: true
  showSearchSuggestions: true
  hideInternetSearch: false
  hideVisitURL: false
  mobileButtonPosition: bottom-right

layout:
  Favorites:
    header: false
    tab: Favorites
    style: row
    icon: mdi-star

  Services:
    header: false
    tab: Services
    style: row
    columns: 1
    icon: mdi-movie-open
    Storage:
      style: row
      columns: 2
      icon: mdi-database
    Download:
      style: row
      columns: 4
      icon: mdi-download
    Books:
      style: row
      columns: 2
      icon: mdi-book-open-page-variant
    News:
      style: row
      columns: 2
      icon: mdi-rss
    Notes:
      style: row
      columns: 2
      icon: mdi-notebook-outline
    Video:
      style: row
      columns: 2
      icon: mdi-video
    Security:
      style: row
      columns: 1
      icon: mdi-shield-key
    AI & Automation:
      style: row
      columns: 1
      icon: mdi-robot
      AI:
        header: false
        style: row
        columns: 6
      Automation:
        header: false
        style: row
        columns: 3
  Administration:
    header: false
    tab: Administration
    Notifications:
      header: false
      style: row
      columns: 1
    Backup & Recovery:
      header: false
      style: row
      columns: 1
    Monitoring:
      style: row
      columns: 3
      icon: mdi-monitor-dashboard
    Network:
      style: row
      columns: 4
      icon: mdi-network
    Authentication:
      style: row
      columns: 2
      icon: mdi-account-key
    Privacy:
      style: row
