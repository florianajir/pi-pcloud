# Valkey/Redis configuration for pi-pcloud stack
# Optimized for low-memory Raspberry Pi usage

# Snapshotting (RDB persistence)
save 900 1
save 300 10
save 60 10000

# Append-only file (disabled — RDB is sufficient for cache workloads)
appendonly no

# Memory management
# Must stay comfortably below the container's mem_limit (512m in compose/compose-core.yaml):
# Valkey only counts its own dataset, while the cgroup also charges the BGSAVE
# fork's copy-on-write pages. A 200mb maxmemory under a 64m mem_limit is what
# got this container OOM-killed mid-BGSAVE - so the two move together, at the
# same ~75% ratio.
#
# Doubled from 192mb when aiometadata joined: it is the one tenant whose working
# set has no natural ceiling, and RSS went from 75 to 118 MiB in a day. This buys
# capacity, not isolation - maxmemory is a single budget with no per-client cap,
# so a tenant that outgrows it still evicts the others' keys. What decides
# whether that is survivable is *whose* keys: Authelia sessions cost a re-login,
# Nextcloud's memcache.locking does not. If evicted_keys ever starts climbing,
# the fix is a valkey of aiometadata's own, not a third doubling.
maxmemory 384mb
maxmemory-policy volatile-lru

# Logging
loglevel notice

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# Performance: keep TCP backlog reasonable
tcp-backlog 128

# Timeout idle connections after 5 minutes
timeout 300

# Reduce latency from background saves
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# requirepass carries a secret, so it cannot live in this versioned file:
# scripts/redis-pre-start.sh renders the included half. Valkey refuses to start
# when an included file is missing, which is why that hook blocks the boot.
include /run/secrets/redis-auth.conf
