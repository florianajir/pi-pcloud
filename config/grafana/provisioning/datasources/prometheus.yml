apiVersion: 1

# Provisioned by file so Grafana's SQLite stays disposable. deleteDatasources
# first, so one left behind by an earlier uid is not orphaned beside this.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Pinned: pi-pcloud.json references it by uid, and a generated one would
    # leave every panel pointing at nothing.
    uid: pi-prometheus
    url: http://prometheus:9090
    isDefault: true
    # Kept in sync by hand with prometheus.yml's scrape_interval: it floors
    # $__interval and $__rate_interval, and a value below the real interval is
    # what produces sawtooth rate() graphs.
    jsonData:
      timeInterval: 30s
      httpMethod: POST
    editable: false
