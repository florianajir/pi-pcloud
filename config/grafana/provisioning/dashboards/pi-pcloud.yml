apiVersion: 1

providers:
  - name: pi-pcloud
    orgId: 1
    folder: ""
    type: file
    # Removing pi-pcloud.json is how the dashboard is retired, so the next
    # restart should take it away with it.
    disableDeletion: false
    # What keeps the repository authoritative: Grafana refuses the save
    # outright rather than letting an edit sit until a reload drops it. Change
    # config/grafana/dashboards/pi-pcloud.json.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      # One flat file, so there is no directory structure to mirror into
      # folder names.
      foldersFromFilesStructure: false
