# SearXNG's own configuration. Mounted read-only at /etc/searxng/settings.yml,
# *inside* a named volume covering /etc/searxng - see compose/compose-knowledge.yaml for why the
# directory cannot simply be a bind mount.
#
# Static, not rendered: everything host-specific is an environment override the
# image already supports (SEARXNG_SECRET, SEARXNG_BASE_URL), so there is no
# template and no sed pass to get wrong.
#
# `use_default_settings` merges this over the ~270-engine default rather than
# replacing it, so only the differences belong here. The `engines.remove` form
# is the only one that actually drops an engine: `disabled: true` still lets
# SearXNG try to import it, and ahmia and torch need a Tor proxy, so every start
# logged "can't register engine (loading engine failed)" for both. Measured.
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "pi-pcloud"
  # Already the upstream default, spelled out because it is the only way a
  # failing engine ever surfaces: a suspended engine leaves the container
  # healthy, so neither Beszel nor Uptime Kuma sees it, while /stats/errors
  # names the engine and the exception and one WARNING per failure reaches
  # journald. No Prometheus endpoint comes with it - /metrics stays 404 unless
  # `open_metrics` also carries a password (webapp.py:1155). No query text is
  # kept: error_recorder.py keeps the failing URL's netloc and drops the rest.
  enable_metrics: true

server:
  # No bind_address and no port here on purpose. SearXNG's own values are read
  # by searx.webapp.run() alone - the Flask development server, which this image
  # never starts. What listens is granian, and it takes its socket from
  # GRANIAN_HOST=:: / GRANIAN_PORT=8080 baked into the image, so a bind_address
  # in this file would read as load-bearing and change nothing.
  #
  # Already the upstream default; spelled out because it is the one decision
  # docs/AI.md points back at. The limiter is the only thing in SearXNG that
  # would need Valkey, and it exists to stop a *public* instance being scraped.
  # Everything here is behind lan@docker, so all it could rate-limit is Open
  # WebUI's own searches.
  #
  # Leaving it off costs one WARNING line per start ("missing config file:
  # /etc/searxng/limiter.toml") - webapp.py loads that config unconditionally,
  # whatever this says. Shipping an inert limiter.toml purely to silence it
  # would be configuration for a feature deliberately turned off.
  limiter: false
  # Image thumbnails are fetched by SearXNG and re-served from here, so the
  # image hosts see the Pi rather than each browser. That is most of the point
  # of self-hosting the search; the cost is only paid on the Images tab.
  image_proxy: true

search:
  # json is what Open WebUI's search client asks for. Without it SearXNG answers
  # 403 with an HTML error page and web search in the chat silently returns
  # nothing - measured. html alone is the upstream default.
  formats:
    - html
    - json
  # Already the upstream default, pinned because Homepage's `suggestionUrl`
  # calls /autocompleter and an upstream change to "" would empty it silently.
  autocomplete: "duckduckgo"
  # No `suspended_times` override, and this is the measured reason. The obvious
  # one - lowering SearxEngineCaptcha from upstream's 3600 so a DuckDuckGo
  # challenge does not cost an hour - would be dead config: duckduckgo.py raises
  # SearxEngineCaptchaException(suspended_time=0) on both of its CAPTCHA paths,
  # and SearxEngineAccessDeniedException reads the setting only when
  # suspended_time is None. Four consecutive searches all report duckduckgo as
  # "CAPTCHA", never "Suspended: CAPTCHA", while google cse - whose 429 carries
  # no suspended_time - does show "Suspended". The setting reaches only engines
  # that raise the exception bare (google, startpage, yandex, baidu, sogou, gmx,
  # quark, google scholar), none of which is enabled here, so overriding it
  # would only shorten the back-off for whichever one is enabled next.

# Upstream's 3.0 is too tight from this host: wikipedia and wikidata timed out on
# 4 of 5 consecutive queries, and every timeout also costs a `ban_time_on_fail`
# suspension for the searches after it. Not the link - wikidata answers in ~1 s
# from inside the container, but the engine pays that twice (a search request
# then a SPARQL query) and parses both on an ARM core. Partial on purpose:
# pool_connections and enable_http2 keep their upstream values through the same
# recursive merge. Not only the searches: autocomplete.py falls back to this
# same value, so a stalled /autocompleter - Homepage's search box - now holds
# for 6 s rather than 3 s.
outgoing:
  request_timeout: 6.0

# Per-engine overrides. Each entry merges into the default engine of the same
# name instead of replacing it, so only the changed key belongs here, and
# declaring this list does not undo the `engines.remove` above.
engines:
  # Carries its own `timeout: 3.0`, which the `outgoing` default above cannot
  # reach - raising that alone left this one still timing out. 6.0 and no more:
  # search/__init__.py takes the max timeout over the selected engines as the
  # whole-search ceiling, and lingva already sits at 6.0, so matching it leaves
  # that ceiling exactly where it was. Enough in practice - 6 entity queries,
  # 6 infoboxes.
  - name: wikidata
    timeout: 6.0

  # The general category ships three engines that return web results - brave,
  # google cse and duckduckgo - and two of them drop out under a burst of
  # searches: duckduckgo on a CAPTCHA, google cse on a 429 (it queries Google
  # through a hardcoded third-party CX id). google cse is then suspended for
  # `suspended_times.SearxEngineTooManyRequests`; duckduckgo is not suspended at
  # all, it simply fails again on the next query, so brave carries the whole
  # result set alone. bing covers duckduckgo's index, which comes from Bing;
  # yep is the one independent crawler among the candidates that answered every
  # query here.
  - name: bing
    disabled: false
  - name: yep
    disabled: false

# Measured and left off, so the next audit does not retry them: mojeek "access
# denied", yahoo "parsing error", seznam timeout, qwant CAPTCHA after a single
# query, mwmbl crawler noise then timeouts. google works but returns google
# cse's index a second time, which would only score those URLs twice.

# No `ui.default_locale` and no `search.default_lang`. Unset, default_lang is
# upstream's "auto", which is not the same as no filter: webadapter.py resolves
# `auto` to the language the client prefers and falls back to `all` only when the
# client states none - and a browser always sends Accept-Language. So each
# browser gets results filtered to its own language, which is what a household
# with mixed browsers wants. Open WebUI is unaffected either way; it pins
# SEARXNG_LANGUAGE=all. Pinning a value here to DEFAULT_LANGUAGE would need a
# BCP-47 -> SearXNG locale map that this file has no way to validate.
