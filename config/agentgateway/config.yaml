# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Agentgateway expands the references below itself, not Compose. It does that
# over the raw text, comments included - so a reference written in a comment as
# an example is looked up like any other and fails the start.
config:
  # hybrid: this file is the read-only baseline, UI edits to *resources* (MCP
  # targets, models, providers, routes, policies) go to the database. The
  # top-level sections below stay file-only - the UI refuses to write them at
  # all in this mode. In the default `file` mode even a resource save would
  # fail against a read-only mount.
  storage:
    mode: hybrid
  # SQLite, not the shared Postgres: this also takes a row per proxied request,
  # and everything in the stack waits on that Postgres.
  database:
    url: sqlite:///data/agentgateway.db
gateways:
  default:
    port: 4000
# The UI reads "LLM enabled" and "MCP enabled" off the mere presence of these
# two sections, and cannot add them itself: its welcome wizard writes the whole
# file, which hybrid mode blocks client-side, with no override on that screen.
# So both are declared here. Naming the gateway above attaches them to port 4000
# instead of opening one of their own, which is why the UI, the LLM API and MCP
# all sit behind the single llm.<HOST_NAME> router.
#
# What is in this file is the read-only baseline; providers, models and MCP
# targets added through the UI afterwards live in the database next to it.
llm:
  gateways: default
  policies:
    # strict: every /v1 call needs one of these keys. The OIDC policy below
    # covers the UI and only the UI, so without this the LLM API would be open
    # to anything that can reach the router - and lan@docker is a network, not
    # an identity. The split is deliberate: an admin configures through the
    # browser, a client consumes with a key.
    apiKey:
      mode: strict
      keys:
        # Written by scripts/agentgateway-pre-start.sh; the same file
        # open-webui's entrypoint reads, so the two cannot drift apart.
        - key: ${LLM_API_KEY}
          metadata:
            user: open-webui
  models:
    # The one model that has to exist before anyone can log in - everything
    # else is added through the UI. `name` is what clients ask for and what
    # /v1/models lists; `params.model` is LLAMA_ARG_ALIAS in compose.yaml.
    - name: gemma-4-e2b-it
      provider:
        # Not `openAI`: that provider talks to api.openai.com. `custom` is the
        # OpenAI-compatible transport, and `completions` with no `path` resolves
        # to <baseUrl>/chat/completions - which is why baseUrl carries the /v1.
        custom:
          formats:
            - type: completions
      params:
        model: gemma-4-e2b-it
        baseUrl: http://llama-cpp:8080/v1
        # No apiKey: llama-server does not check one, and the docs call it
        # optional for exactly this case.
  providers: []
  virtualModels: []
# Groq and OpenRouter on their own paths, because the llm: section matches on
# model *name*: a `groq/*` wildcard is all its /v1/models can list, so a client
# that builds its picker from that endpoint sees nothing usable. A top-level
# route can serve the real catalogue, because policies.ai.routes maps a URL
# suffix to a handler - /chat/completions stays `completions` (parsed, so
# tokenisation and budgets still apply) while /models is `passthrough`. The
# `models` handler would synthesise the list locally; v1.5.0 answers it
# `501 Route 'Models' not implemented`.
#
# The cost: these routes are invisible to the UI, which lists only providers and
# models. A third one is a file edit, not a form. See docs/AI.md.
routes:
  - name: groq
    gateways: default
    # /groq/v1, not /groq: urlRewrite strips the whole matched prefix, so the
    # suffix ai.routes sees is /models and /chat/completions, and pathPrefix
    # below puts the /v1 back upstream. Split it the other way and the
    # `completions` handler builds /openai/chat/completions, which Groq 404s.
    matches:
      - path:
          pathPrefix: /groq/v1
    policies:
      urlRewrite:
        path:
          prefix: /
      # Repeated, not inherited: the llm: section's apiKey policy does not cover
      # a top-level route, and without this Groq is reachable with no credential
      # by anything past lan@docker.
      apiKey:
        mode: strict
        keys:
          - key: ${LLM_API_KEY}
            metadata:
              user: open-webui
          # For tools running on other machines, so revoking one does not lock
          # out the other. Generated by agentgateway-pre-start.sh: a key created
          # in the UI cannot be used here, and neither default Compose can
          # substitute is safe - empty fails to parse and exits at startup,
          # a placeholder would be a password readable off a tracked file.
          # `--validate-only` accepts empty anyway, so only a real start proves
          # this route.
          - key: ${AGENT_API_KEY}
            metadata:
              user: agent
      # Without this the request leaves in plain text and Cloudflare answers
      # `400 The plain HTTP request was sent to HTTPS port`.
      backendTLS:
        hostname: api.groq.com
      # Replaces whatever the client sent, so a caller never needs the Groq key.
      backendAuth:
        key: ${GROQ_API_KEY}
      ai:
        routes:
          /chat/completions: completions
          /models: passthrough
          "*": passthrough
    backends:
      - ai:
          name: groq
          # host:port, not a bare host - a bare one fails validation.
          hostOverride: api.groq.com:443
          pathPrefix: /openai/v1
          provider:
            custom:
              formats:
                - type: completions
  # Same shape; only the host, the upstream prefix and the provider key differ.
  # OpenRouter serves /models without a credential, so that half answers even
  # where OPENROUTER_API_KEY was never set - there it is /chat/completions
  # that 401s.
  - name: openrouter
    gateways: default
    matches:
      - path:
          pathPrefix: /openrouter/v1
    policies:
      urlRewrite:
        path:
          prefix: /
      apiKey:
        mode: strict
        keys:
          - key: ${LLM_API_KEY}
            metadata:
              user: open-webui
          - key: ${AGENT_API_KEY}
            metadata:
              user: agent
      backendTLS:
        hostname: openrouter.ai
      backendAuth:
        key: ${OPENROUTER_API_KEY}
      ai:
        # OpenRouter checks affordability against max_tokens *reserved*, and
        # falls back to the model's whole context window when the client sends
        # none - 131072 tokens for a three-word prompt, which a credit-limited
        # account refuses with a 402. Agent clients rarely send it.
        # `defaults`, not `overrides`: a caller that does ask still wins. Groq
        # needs no equivalent, it bills what is consumed.
        defaults:
          max_tokens: 8192
        routes:
          /chat/completions: completions
          /models: passthrough
          "*": passthrough
    backends:
      - ai:
          name: openrouter
          hostOverride: openrouter.ai:443
          pathPrefix: /api/v1
          provider:
            custom:
              formats:
                - type: completions
mcp:
  gateways: default
  targets: []
# Written by the UI alongside the LLM section above; the LLM path buffers whole
# request bodies, and this is the default it would have set (32 MiB).
frontendPolicies:
  http:
    maxBufferSize: 33554432
ui:
  gateways: default
  policies:
    # Traefik carries no forward-auth for llm.<HOST_NAME>, so this is what
    # puts Authelia in front of the UI - and only the UI. The LLM API on the
    # same port is gated by the apiKey policy above instead; an MCP target added
    # later is served with no policy at all until one is attached to it.
    # See docs/SECURITY.md.
    oidc:
      issuer: https://auth.${HOST_NAME}
      clientId: agentgateway
      clientSecret: ${UI_CLIENT_SECRET}
      redirectURI: https://llm.${HOST_NAME}/oauth/callback
      # openid is always requested on top of these.
      scopes:
        - profile
        - email
