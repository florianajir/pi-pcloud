  immich-server:
    <<: *service-defaults
    container_name: pi-immich
    profiles: ["immich-server", "all"]
    image: ghcr.io/immich-app/immich-server:v3.1.0
    volumes:
      - ${DATA_LOCATION:-./data}/immich:/data
      - ${DATA_LOCATION:-./data}/authelia-config/immich-oauth-config.yaml:/immich-oauth-config.yaml:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/redis_password:/run/secrets/redis_password:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: postgres
      DB_DATABASE_NAME: immich
      DB_USERNAME: immich
      DB_PASSWORD: ${PASSWORD}
      REDIS_HOSTNAME: redis
      # The file variant, so the password is not in docker inspect.
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      IMMICH_CONFIG_FILE: /immich-oauth-config.yaml
      IMMICH_TRUSTED_PROXIES: 172.30.11.250/32
      CPU_CORES: 3
      TZ: ${TIMEZONE:-Europe/Paris}
    networks:
      - frontend
      - immich
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - 2283
    labels:
      - "homepage.group=Storage"
      - "homepage.name=Immich"
      - "homepage.icon=immich.png"
      - "homepage.href=https://immich.${HOST_NAME:-pi.lan}"
      - "homepage.description=Photos and videos"
      - "homepage.widget.type=immich"
      - "homepage.widget.url=http://pi-immich:2283"
      - "homepage.widget.key={{HOMEPAGE_FILE_IMMICH_API_KEY}}"
      - "homepage.widget.version=2"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.immich.rule=Host(`immich.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.routers.immich.priority=10"
      # This router carries no lan@docker, so its rule *is* the public surface.
      # A blanket PathPrefix(`/api`) put the whole authenticated API on the
      # internet - /api/users/me, /api/albums, /api/faces, /api/sync/stream -
      # none of which a share link touches. Worse, `immich@` then only ever saw
      # the HTML shell: every API call from the logged-in app was routed here.
      # Measured against a real share by splitting the access log per TCP
      # connection, every anonymous request carries `key` or `slug`, without
      # exception. So /api/assets - which a share and the app request at the
      # same paths - is gated on that parameter rather than on the path.
      # Fails closed: a missing path 403s from outside while still working from
      # the LAN, so any change here must be validated off-tailnet.
      # The three loose files are not decoration: /service-worker.js was 403ing
      # in a retry loop on every share view (32 times over one off-tailnet test),
      # and none of them ever matched the old rule either - they sit at the root,
      # outside /share, /s/, /_app and /api.
      - "traefik.http.routers.immich-public.rule=Host(`immich.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/share`) || PathPrefix(`/s/`) || PathPrefix(`/_app`) || Path(`/service-worker.js`) || Path(`/custom.css`) || Path(`/dark_skeleton.png`) || Path(`/api/shared-links/me`) || Path(`/api/shared-links/login`) || Path(`/api/server/config`) || Path(`/api/server/features`) || Path(`/api/server/media-types`) || ((PathPrefix(`/api/assets`) || PathPrefix(`/api/download`) || PathPrefix(`/api/timeline`) || PathPrefix(`/api/albums`)) && (QueryRegexp(`key`, `.+`) || QueryRegexp(`slug`, `.+`))))"
      - "traefik.http.routers.immich-public.entrypoints=websecure"
      - "traefik.http.routers.immich-public.middlewares=frame-deny@docker"
      - "traefik.http.routers.immich-public.tls=true"
      - "traefik.http.routers.immich-public.priority=20"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    cpuset: "1-3"
    cpu_shares: *cpu-prio-normal
    mem_limit: 3072m
    memswap_limit: 3584m
    oom_score_adj: *oom-score-deprioritize

  nextcloud:
    <<: *service-defaults
    image: nextcloud:34.0.3-apache
    container_name: pi-nextcloud
    profiles: ["nextcloud", "all"]
    environment:
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${PASSWORD}
      - NEXTCLOUD_ADMIN_EMAIL=${EMAIL}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${HOST_NAME:-pi.lan} localhost 127.0.0.1
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - OVERWRITEHOST=nextcloud.${HOST_NAME:-pi.lan}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://nextcloud.${HOST_NAME:-pi.lan}
      - TRUSTED_PROXIES=172.30.11.250/32
      - ALLOW_IP_RANGES=${ALLOW_IP_RANGES:-127.0.0.1/32,192.168.1.0/24,100.64.0.0/10,172.30.0.0/16,::1/128,fd7a:115c:a1e0::/48}
      - FORWARDED_FOR_HEADERS=HTTP_X_FORWARDED_FOR
      - NEXTCLOUD_MAINTENANCE_WINDOW_START=${NEXTCLOUD_MAINTENANCE_WINDOW_START:-2}
      - NEXTCLOUD_DEFAULT_PHONE_REGION=${NEXTCLOUD_DEFAULT_PHONE_REGION:-FR}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${PASSWORD}
      - REDIS_HOST=redis
      # The file variant, so the password is not in docker inspect - and it has
      # to stay a path every UID in the container can read, because
      # `docker exec -u www-data` re-resolves it. See the mount below.
      - REDIS_HOST_PASSWORD_FILE=/run/secrets/redis_password
      - TZ=${TIMEZONE:-Europe/Paris}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_SECURE=${SMTP_SECURE:-tls}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_AUTHTYPE=${SMTP_AUTHTYPE:-LOGIN}
      - SMTP_NAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-nextcloud}
      - MAIL_DOMAIN=${HOST_NAME:-pi.lan}
    volumes:
      - nextcloud_html:/var/www/html
      - ${DATA_LOCATION:-./data}/nextcloud:/var/www/html/data
      - ${DATA_LOCATION:-./data}/nextcloud-config:/var/www/html/config
      - ${DATA_LOCATION:-./data}/nextcloud-themes:/var/www/html/themes
      # The download tree and the reading libraries, read-write, so Nextcloud is
      # also where they get organised - renamed, moved, deleted - and not only
      # where a file gets a public share link.
      #
      # Read-write here is necessary but not sufficient: Nextcloud's PHP runs as
      # uid 33 and everything below belongs to uid/gid 1000 in mode 0755, so it
      # would still only get r-x. scripts/nextcloud-pre-start.sh grants uid 33
      # write access with an ACL. Note `group_add: 1000` does NOT work here,
      # tempting as it looks: Apache calls initgroups() when it drops to
      # www-data, which rebuilds the group list from the container's /etc/group
      # and discards the supplementary gid compose added.
      #
      # config/nextcloud/hooks/post-installation/20-external-storage.sh turns
      # these into files_external mounts; keep the two lists in step.
      - ${DATA_LOCATION:-./data}/download:/mnt/qbittorrent-downloads
      - ${DATA_LOCATION:-./data}/comics:/mnt/library-comics
      - ${DATA_LOCATION:-./data}/manga:/mnt/library-manga
      - ${DATA_LOCATION:-./data}/download/books:/mnt/library-books
      - ${DATA_LOCATION:-./data}/download/audiobooks:/mnt/library-audiobooks
      - ./config/nextcloud/custom.config.php:/var/www/html/config/custom.config.php:ro
      - ./config/nextcloud/security-headers.conf:/etc/apache2/conf-enabled/security-headers.conf:ro
      - ./config/nextcloud/zz-opcache-jit.ini:/usr/local/etc/php/conf.d/zz-opcache-jit.ini:ro
      - ./config/nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      # The 0644 copy, not the 0600 original: redis.config.php keeps the
      # `_FILE` branch and re-reads it per request, so www-data needs it too.
      - ${DATA_LOCATION:-./data}/redis/redis-password:/run/secrets/redis_password:ro
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    networks:
      - frontend
      - nextcloud
    labels:
      - "homepage.group=Storage"
      - "homepage.name=Nextcloud"
      - "homepage.icon=nextcloud.png"
      - "homepage.href=https://nextcloud.${HOST_NAME:-pi.lan}"
      - "homepage.description=File sync and collaboration"
      - "homepage.widget.type=nextcloud"
      - "homepage.widget.url=https://nextcloud.${HOST_NAME:-pi.lan}"
      - "homepage.widget.username={{HOMEPAGE_VAR_NEXTCLOUD_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.nextcloud.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.priority=10"
      # Same caveat as immich-public: no lan@docker, so this rule is the public
      # surface. Two prefixes were wider than any share needs.
      # `/avatar/` was an account-enumeration oracle - /avatar/<known-mail>/64/dark
      # answers 200 where an unknown one answers 201, unauthenticated. Shares only
      # ever request /avatar/guest/, so the prefix is narrowed to that.
      # `/apps/` also exposed /apps/files/api/v1/*; the negation keeps the app
      # assets (js, css, l10n, img, theming) that a share page genuinely loads
      # while dropping every app's REST surface. /ocs/ and /remote.php/ were
      # already absent from here, so the OCS API stays behind lan@docker.
      # `/custom_apps/` is where store-installed apps serve their assets, and it
      # was never in this rule - which quietly broke public calendar sharing:
      # /apps/calendar/p/<token> is reachable, but the page it returns pulls
      # /custom_apps/calendar/js/calendar-main.js, so the calendar never rendered
      # for anyone outside the LAN. Mirrors the /apps/ negation above so the
      # store apps' REST surfaces stay private.
      # Assets only under /apps, /custom_apps and /core, never the whole tree:
      # anything broader publishes /apps/user_oidc/login and with it a way to
      # reach /apps/files/ and /core/preview from off-LAN. The subdirectory list
      # is what a real public share page requests, plus l10n/fonts/vendor. LAN
      # and tailnet clients match the `lan` router instead and are unaffected.
      - "traefik.http.routers.nextcloud-public.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/s/`) || PathPrefix(`/public.php`) || PathPrefix(`/avatar/guest/`) || PathPrefix(`/dist/`) || PathPrefix(`/js/`) || PathPrefix(`/themes/`) || PathPrefix(`/apps/files_sharing/publicpreview`) || PathRegexp(`^/core/(css|js|img|fonts|l10n|vendor)/`) || PathRegexp(`^/(apps|custom_apps)/[^/]+/(css|js|img|fonts|l10n|vendor|theme|favicon|icon|manifest)/`) || PathPrefix(`/remote.php/dav/calendars/`) || PathPrefix(`/remote.php/dav/public-calendars/`))"
      - "traefik.http.routers.nextcloud-public.entrypoints=websecure"
      - "traefik.http.routers.nextcloud-public.middlewares=frame-deny@docker"
      - "traefik.http.routers.nextcloud-public.tls=true"
      - "traefik.http.routers.nextcloud-public.priority=20"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      start_period: 60s
      start_interval: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpuset: "1-3"
    cpu_shares: *cpu-prio-normal
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  homepage:
    <<: *service-defaults
    image: ghcr.io/gethomepage/homepage:v2.2.0@sha256:753eeb0cc22ab7baad39ed47cbd1aae14e193dd1b264e965f193a9ea1d1e1bdd
    container_name: pi-homepage
    networks:
      frontend:
        # Static so internalapi-allow can name it. High in the range: Docker
        # hands out dynamic addresses from .2 upwards.
        ipv4_address: 172.30.11.240
      # For the Backrest widget only: pi-backrest:9898 is no longer on frontend.
      backup: {}
    expose:
      - 3000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - HOMEPAGE_ALLOWED_HOSTS=homepage.${HOST_NAME:-pi.lan}
      # Read by widget labels as {{HOMEPAGE_VAR_x}}.
      - HOMEPAGE_VAR_ADMIN_USER=${ADMIN_USER:-admin}
      - HOMEPAGE_VAR_ADMIN_PASSWORD=${PASSWORD}
      # NEXTCLOUD_ADMIN_USER only applies at first install, where it resolved to
      # $EMAIL - so that, not the current $ADMIN_USER, is the account that exists.
      - HOMEPAGE_VAR_NEXTCLOUD_USER=${EMAIL}
      # Read by widget labels as {{HOMEPAGE_FILE_x}}; written by
      # scripts/homepage-widgets-bootstrap.sh into the mounted config dir.
      - HOMEPAGE_FILE_PROWLARR_API_KEY=/app/config/secrets/prowlarr_api_key
      - HOMEPAGE_FILE_KAVITA_API_KEY=/app/config/secrets/kavita_api_key
      - HOMEPAGE_FILE_AUDIOBOOKSHELF_API_KEY=/app/config/secrets/audiobookshelf_api_key
      - HOMEPAGE_FILE_HEADSCALE_API_KEY=/app/config/secrets/headscale_api_key
      - HOMEPAGE_FILE_HEADSCALE_NODE_ID=/app/config/secrets/headscale_node_id
      # Immich is the one key nothing can mint: its admin password is set at signup
      # and is not derivable from .env, and api_key.key is stored hashed, so neither
      # the API nor the database can produce one. Paste it into the secret file --
      # scripts/homepage-widgets-bootstrap.sh creates it empty on first run.
      - HOMEPAGE_FILE_IMMICH_API_KEY=/app/config/secrets/immich_api_key
      # Copied out of config/backrest/backrest.env by the widgets bootstrap: the
      # Backrest API credential is no longer ${PASSWORD}, and this widget is the
      # only other thing that holds it.
      - HOMEPAGE_FILE_BACKREST_PASSWORD=/app/config/secrets/backrest_password
    extra_hosts:
      # So the widget's https:// call passes Nextcloud's trusted-domains check.
      - "nextcloud.${HOST_NAME:-pi.lan}:172.30.11.250"
    volumes:
      - ./config/homepage:/app/config
      # /app/public is the only path homepage serves over HTTP (/api/config is
      # hardcoded to custom.css and custom.js), so local icons have to live here.
      - ./config/homepage/icons:/app/public/icons:ro
      # Overriding the files the server-rendered HTML points at, rather than
      # `favicon:` in settings.yaml, which only applies after hydration and left
      # the tab flickering. Regenerate from docs/assets/logo.png with
      # scripts/homepage-favicon.sh.
      - ./config/homepage/icons/favicon.ico:/app/public/favicon.ico:ro
      - ./config/homepage/icons/favicon-16x16.png:/app/public/favicon-16x16.png:ro
      - ./config/homepage/icons/favicon-32x32.png:/app/public/favicon-32x32.png:ro
      - ./config/homepage/icons/homepage.ico:/app/public/homepage.ico:ro
      - ./config/homepage/icons/apple-touch-icon.png:/app/public/apple-touch-icon.png:ro
      - ./config/homepage/icons/safari-pinned-tab.svg:/app/public/safari-pinned-tab.svg:ro
      - ./config/homepage/icons/android-chrome-192x192.png:/app/public/android-chrome-192x192.png:ro
      - ./config/homepage/icons/android-chrome-512x512.png:/app/public/android-chrome-512x512.png:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    tmpfs:
      - /app/config/logs
    labels:
      - "homepage.group=Dashboard"
      - "homepage.name=Homepage"
      # The one tile that stands for this stack rather than a third-party app, so
      # it uses the pi-pcloud mark from the icons mount instead of dashboard-icons.
      - "homepage.icon=/icons/logo.png"
      - "homepage.href=https://homepage.${HOST_NAME:-pi.lan}"
      - "homepage.description=Service dashboard"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    depends_on:
      - traefik
    cpu_shares: *cpu-prio-normal
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  gluetun:
    <<: *service-defaults
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: pi-gluetun
    profiles: ["gluetun", "qbittorrent", "stremio", "kapowarr", "all"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      frontend:
        # Shelfmark's bypasser hands this to SeleniumBase, whose proxy validation
        # rejects a host with no dot and then fails to start the browser at all.
        aliases:
          - gluetun.docker
    expose:
      - 8080
      - 11470
      - 12470
      - 5656
      - 8000
      - 8888
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Grants the Homepage widget unauthenticated read access to a couple of
      # harmless routes (public IP, port-forward status) - see the file for details.
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/gluetun/custom/auth-config.toml
      # Shelfmark's direct book downloads are plain HTTPS, not torrents, so they
      # have no other way through the tunnel. It reaches this at gluetun:8888;
      # gluetun's firewall already accepts input from the Docker network, and
      # forwards only over the VPN interface.
      - HTTPPROXY=on
    env_file:
      - path: ./config/gluetun/gluetun.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/gluetun:/gluetun
      - ./config/gluetun:/gluetun/custom:ro
    labels:
      - "homepage.group=Privacy"
      - "homepage.name=Gluetun"
      - "homepage.icon=gluetun.png"
      - "homepage.href=https://gluetun.${HOST_NAME:-pi.lan}"
      - "homepage.description=VPN client"
      - "homepage.widget.type=gluetun"
      - "homepage.widget.url=http://pi-gluetun:8000"
      - "homepage.widget.version=2"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.http.routers.kapowarr.rule=Host(`kapowarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kapowarr.entrypoints=websecure"
      - "traefik.http.routers.kapowarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.kapowarr.tls=true"
      - "traefik.http.routers.kapowarr.service=kapowarr"
      - "traefik.http.services.kapowarr.loadbalancer.server.port=5656"
      - "traefik.http.routers.stremio-root.rule=Host(`stremio.${HOST_NAME:-pi.lan}`) && Path(`/`)"
      - "traefik.http.routers.stremio-root.entrypoints=websecure"
      - "traefik.http.routers.stremio-root.middlewares=frame-deny@docker,lan@docker,stremio-webui-redirect@docker"
      - "traefik.http.routers.stremio-root.priority=30"
      - "traefik.http.routers.stremio-root.tls=true"
      - "traefik.http.routers.stremio-root.service=noop@internal"
      # No authelia, same reason as comet below: a cast receiver fetches the stream
      # itself and cannot pass an interactive SSO login. It was also denying every client
      # including the LAN, since stremio.<HOST_NAME> has no access_control rule and
      # Authelia's default_policy is deny.
      - "traefik.http.routers.stremio.rule=Host(`stremio.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.stremio.entrypoints=websecure"
      - "traefik.http.routers.stremio.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.stremio.priority=10"
      - "traefik.http.routers.stremio.tls=true"
      - "traefik.http.routers.stremio.service=stremio"
      - "traefik.http.services.stremio.loadbalancer.server.port=11470"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.regex=^https?://([^/]+)/?$"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.replacement=https://app.strem.io/shell-v4.4/?streamingServer=https%3A%2F%2F$${1}"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.permanent=false"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      start_period: 30s
      start_interval: 5s
    cpu_shares: *cpu-prio-critical
    mem_limit: 256m
    mem_reservation: 64m
    oom_score_adj: *oom-score-deprioritize

  qbittorrent:
    <<: *service-defaults
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls474@sha256:a00b6a597a3832a1814cde0ef60abc55c94644f3f80902c3432f6af6de8d4a96
    container_name: pi-qbittorrent
    profiles: ["qbittorrent", "all"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "homepage.group=Download"
      - "homepage.name=qBittorrent"
      - "homepage.icon=qbittorrent.png"
      - "homepage.href=https://qbittorrent.${HOST_NAME:-pi.lan}"
      - "homepage.description=Torrent client (VPN protected)"
      - "homepage.widget.type=qbittorrent"
      - "homepage.widget.url=http://pi-gluetun:8080"
      - "homepage.widget.username={{HOMEPAGE_VAR_ADMIN_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${DATA_LOCATION:-./data}/qbittorrent:/config
      - ${DATA_LOCATION:-./data}/download:/downloads
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      start_period: 30s
    cpu_shares: *cpu-prio-batch
    # 512m, not 256m: at 256m the cgroup hit memory.max 98842 times, which is
    # the write cache of an active torrent being reclaimed over and over, not a
    # process wanting more heap (24 MB anonymous, 135 MB page cache, 0 OOM kills).
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  stremio:
    <<: *stremio-common
    container_name: pi-stremio
    profiles: ["stremio", "all"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      # Routed by gluetun's labels: sharing its namespace leaves this container
      # with no address of its own for Traefik's docker provider to target.
      - "traefik.enable=false"
      - "homepage.group=Video"
      - "homepage.name=Stremio"
      - "homepage.icon=stremio.png"
      - "homepage.href=https://stremio.${HOST_NAME:-pi.lan}"
      - "homepage.description=Streaming server (VPN protected)"

  # Casting alternative to `stremio` above, never both: the conflicts-with label
  # below is what services.sh, the picker and stack-up.sh all read to refuse it.
  # Discovery is SSDP/mDNS multicast, which reaches no renderer from a Docker
  # bridge and which gluetun's firewall rejects outright (EPERM on 239.255.255.250),
  # so a cast-capable server needs its own address on the physical LAN. That
  # address is off the VPN: torrent pieces Stremio fetches itself then leave on
  # the residential IP, which is a real trade-off when not using a debrid addon.
  stremio-lan:
    <<: *stremio-common
    container_name: pi-stremio-lan
    profiles: ["stremio-lan"]
    networks:
      frontend: {}
      lan:
        ipv4_address: ${STREMIO_IP:-192.168.1.251}
    # A macvlan child cannot reach its own parent host, so the public records
    # pointing these names at HOST_LAN_IP are unusable here: reach Traefik on
    # the frontend network instead, or upstream fetches fail with EHOSTUNREACH.
    extra_hosts:
      - "stremio.${HOST_NAME:-pi.lan}:172.30.11.250"
      - "comet.${HOST_NAME:-pi.lan}:172.30.11.250"
    labels:
      - "homepage.group=Video"
      - "homepage.name=Stremio"
      - "homepage.icon=stremio.png"
      - "homepage.href=https://stremio.${HOST_NAME:-pi.lan}"
      - "homepage.description=Streaming server (LAN, casting)"
      - "pi-pcloud.conflicts-with=stremio"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Same host rules as gluetun's routers but higher priority, so that if
      # gluetun is up for qbittorrent its now-dead stremio routers lose.
      - "traefik.http.routers.stremio-lan-root.rule=Host(`stremio.${HOST_NAME:-pi.lan}`) && Path(`/`)"
      - "traefik.http.routers.stremio-lan-root.entrypoints=websecure"
      - "traefik.http.routers.stremio-lan-root.middlewares=frame-deny@docker,lan@docker,stremio-lan-webui-redirect@docker"
      - "traefik.http.routers.stremio-lan-root.priority=80"
      - "traefik.http.routers.stremio-lan-root.tls=true"
      - "traefik.http.routers.stremio-lan-root.service=noop@internal"
      # No authelia, same reason as the gluetun-hosted router and as comet.
      - "traefik.http.routers.stremio-lan.rule=Host(`stremio.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.stremio-lan.entrypoints=websecure"
      - "traefik.http.routers.stremio-lan.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.stremio-lan.priority=60"
      - "traefik.http.routers.stremio-lan.tls=true"
      - "traefik.http.routers.stremio-lan.service=stremio-lan"
      - "traefik.http.services.stremio-lan.loadbalancer.server.port=11470"
      # Its own copy: the gluetun-hosted middleware is gone when gluetun is not selected.
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.regex=^https?://([^/]+)/?$"
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.replacement=https://app.strem.io/shell-v4.4/?streamingServer=https%3A%2F%2F$${1}"
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.permanent=false"

  comet:
    <<: *service-defaults
    # No semver image tags are published; pin latest (currently v2.54.1) by digest.
    image: ghcr.io/g0ldyy/comet:latest@sha256:dca62133336e02784d02aaad861381820674d1c8e3e98a03797610b81ee4defe
    container_name: pi-comet
    profiles: ["comet", "all"]
    networks:
      - frontend
    expose:
      - 8000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - FASTAPI_WORKERS=1
      # Single uvicorn process keeps the footprint small on the Pi (gunicorn preloads extra workers).
      - USE_GUNICORN=False
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/data/comet.db
      # CONFIGURE_PAGE_PASSWORD prefixes addon URLs with /s/<PUBLIC_API_TOKEN>/, so the
      # token must outlive recreates - the default /app/data is ephemeral and every
      # recreate would mint a new one, breaking already-installed addons.
      - PUBLIC_API_TOKEN_FILE=/data/public_api_token.txt
      # TorBox is only the debrid — it checks and streams hashes, it does not find
      # torrents. With no scraper enabled Comet returns zero results.
      - SCRAPE_TORRENTIO=True
      - SCRAPE_MEDIAFUSION=True
      - SCRAPE_ZILEAN=True
    # TorBox itself is configured per-user in the /configure web UI (paste the TorBox
    # API key there); ADMIN_DASHBOARD_PASSWORD and CONFIGURE_PAGE_PASSWORD gate Comet's
    # own admin dashboard and configuration page, and are generated once by
    # scripts/comet-pre-start.sh. Deliberately not in `environment:` above: Compose lets
    # `environment:` win over `env_file:`, so a ${PASSWORD} fallback there would silently
    # shadow the generated secrets. env_file values are frozen at container creation -
    # after a rotation use `up -d`, never `restart`.
    env_file:
      - path: ./config/comet/comet.env
        required: false
    volumes:
      - comet_data:/data
    labels:
      - "homepage.group=Video"
      - "pi-pcloud.companion-of=stremio"
      - "homepage.name=Comet"
      - "homepage.href=https://comet.${HOST_NAME:-pi.lan}"
      - "homepage.description=Stremio debrid addon"
      - "homepage.icon=stremio.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Two routers on one host. This one is the catch-all: LAN/tailnet only (lan@docker
      # covers the tailscale ranges), no authelia, because Stremio clients fetch the
      # manifest/stream endpoints programmatically and cannot pass an interactive login.
      - "traefik.http.routers.comet.rule=Host(`comet.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.comet.entrypoints=websecure"
      - "traefik.http.routers.comet.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.comet.tls=true"
      - "traefik.http.routers.comet.priority=10"
      # The public half, so an addon installed on a Stremio account keeps resolving
      # off-tailnet - a TV or a phone on mobile data cannot join it. CONFIGURE_PAGE_PASSWORD
      # mounts every Stremio endpoint under /s/<PUBLIC_API_TOKEN>/, so that unguessable
      # prefix - and nothing else - is what goes out: /, /health, /admin and /admin/api/*
      # (logs, connections, scraper control) stay behind lan@docker on the router above.
      # /configure is carved back out because config.router is mounted under the token
      # prefix too, and it is the only password form Comet serves; excluding it leaves no
      # login at all on the public surface. The cost is that Stremio's Configure button
      # 403s off-tailnet - streaming does not, and the addon URL is unchanged.
      # Fails closed: a typo in the rule 403s from outside while still working from the
      # LAN, so any change here has to be validated off-tailnet.
      - "traefik.http.routers.comet-public.rule=Host(`comet.${HOST_NAME:-pi.lan}`) && PathPrefix(`/s/`) && !PathRegexp(`/configure(/login)?$$`)"
      - "traefik.http.routers.comet-public.entrypoints=websecure"
      # rate-limit-auth is not about auth here: every Comet request fans out to
      # Torrentio/MediaFusion/Zilean from the Pi's own WAN IP (comet is on frontend, not
      # behind gluetun), so an unmetered public endpoint is an outbound amplifier.
      - "traefik.http.routers.comet-public.middlewares=frame-deny@docker,rate-limit-auth@docker"
      - "traefik.http.routers.comet-public.tls=true"
      - "traefik.http.routers.comet-public.priority=20"
      - "traefik.http.routers.comet-public.service=comet"
      - "traefik.http.services.comet.loadbalancer.server.port=8000"
    healthcheck:
      <<: *healthcheck-default
      # The image left its Alpine base and ships neither wget nor curl.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      # First boot blocks ~2-3 min downloading anime mappings before the API serves.
      start_period: 180s
    cpu_shares: *cpu-prio-normal
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  prowlarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: pi-prowlarr
    profiles: ["prowlarr", "all"]
    networks:
      - frontend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    expose:
      - 9696
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "homepage.group=Download"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr.png"
      - "homepage.href=https://prowlarr.${HOST_NAME:-pi.lan}"
      - "homepage.description=Indexer manager"
      - "homepage.widget.type=prowlarr"
      - "homepage.widget.url=http://pi-prowlarr:9696"
      - "homepage.widget.key={{HOMEPAGE_FILE_PROWLARR_API_KEY}}"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/prowlarr:/config
    healthcheck:
      <<: *healthcheck-default
      # linuxserver base ships curl; Prowlarr's /ping needs no auth.
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      start_period: 45s
    cpu_shares: *cpu-prio-batch
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  kapowarr:
    <<: *service-defaults
    image: mrcas/kapowarr:v1.3.1
    container_name: pi-kapowarr
    profiles: ["kapowarr", "all"]
    # Same gluetun namespace as qBittorrent (localhost:8080) so torrent path mapping
    # is an identity mapping; GetComics direct downloads also go through the VPN.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.kapowarr.rule=Host(`kapowarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kapowarr.entrypoints=websecure"
      - "traefik.http.routers.kapowarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.kapowarr.tls=true"
      - "traefik.http.routers.kapowarr.service=kapowarr"
      - "traefik.http.services.kapowarr.loadbalancer.server.port=5656"
      - "homepage.group=Books"
      - "homepage.name=Kapowarr"
      - "homepage.icon=kapowarr.png"
      - "homepage.href=https://kapowarr.${HOST_NAME:-pi.lan}"
      - "homepage.description=Comics manager"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/kapowarr/db:/app/db
      # Own temp dir for GetComics direct downloads (entrypoint chowns it to PUID).
      - ${DATA_LOCATION:-./data}/kapowarr/downloads:/app/temp_downloads
      # Shared download folder mounted at the SAME path qBittorrent uses, so torrents
      # grabbed via the qBittorrent client import with an identity path mapping.
      - ${DATA_LOCATION:-./data}/download:/downloads
      - ${DATA_LOCATION:-./data}/comics:/comics
      # Second root folder: manga volumes live here so Kavita can serve them from a
      # Manga-type library instead of the comic parser.
      - ${DATA_LOCATION:-./data}/manga:/manga
    healthcheck:
      <<: *healthcheck-default
      # python-slim base — no curl/wget; probe the UI with the bundled interpreter.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5656/').status==200 else 1)"]
      start_period: 45s
    cpu_shares: *cpu-prio-batch
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  flaresolverr:
    <<: *service-defaults
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: pi-flaresolverr
    profiles: ["flaresolverr", "prowlarr", "all"]
    labels:
      - "homepage.description=Cloudflare challenge solver for Prowlarr"
      - "pi-pcloud.companion-of=prowlarr"
    networks:
      - frontend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    expose:
      - 8191
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE:-Europe/Paris}
    # Chrome crashes with the default 64MB /dev/shm; give it room to render pages.
    shm_size: "256m"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      start_period: 45s
    cpu_shares: *cpu-prio-batch
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  kavita:
    <<: *service-defaults
    image: lscr.io/linuxserver/kavita:0.9.1
    container_name: pi-kavita
    profiles: ["kavita", "all"]
    networks:
      - frontend
    extra_hosts:
      # Let Kavita reach Authelia's OIDC discovery endpoint via Traefik internally.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 5000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - kavita_config:/config
      # One read-only mount per Kavita library, so each gets its own library type
      # (ComicVine for comics, Manga for right-to-left, Book for epub/pdf).
      # Kapowarr owns comics/ and manga/; the download/* folders are the save paths
      # of the matching qBittorrent categories. Never the download root: Kavita walks
      # every subfolder, so a software torrent's installer tree turns into series
      # named after its internals.
      - ${DATA_LOCATION:-./data}/comics:/comics:ro
      - ${DATA_LOCATION:-./data}/manga:/manga:ro
      - ${DATA_LOCATION:-./data}/download/manga:/manga-downloads:ro
      # Second folder of the Comics library, for issues grabbed by hand when
      # Kapowarr cannot find them. Kept out of comics/ deliberately: Kapowarr owns
      # that tree and moves files inside it with copy-then-delete, which races a
      # torrent seeding from there. Same split as manga/ + download/manga/.
      - ${DATA_LOCATION:-./data}/download/comics:/comics-downloads:ro
      - ${DATA_LOCATION:-./data}/download/books:/books:ro
      # Read as a Comic library despite holding PDFs; see kavita-library-bootstrap.sh
      # for why, and for the naming an issue has to follow to join its series.
      - ${DATA_LOCATION:-./data}/download/magazines:/magazines:ro
    labels:
      - "homepage.group=Books"
      - "homepage.name=Kavita"
      - "homepage.icon=kavita.png"
      - "homepage.href=https://kavita.${HOST_NAME:-pi.lan}"
      - "homepage.description=Comics, manga and ebooks reader"
      - "homepage.widget.type=kavita"
      - "homepage.widget.url=http://pi-kavita:5000"
      # An API key, not username/password: Kavita's OIDC config sets
      # DisablePasswordAuthentication, so /api/Account/login rejects every password
      # ("password authentication disabled"). It exempts apiKey logins from that
      # check, and Homepage only sends the key when no username/password is set.
      - "homepage.widget.key={{HOMEPAGE_FILE_KAVITA_API_KEY}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Kavita has its own account system (and OPDS clients cannot pass interactive SSO),
      # so lan@docker only — no authelia in front (same rationale as Immich).
      - "traefik.http.routers.kavita.rule=Host(`kavita.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kavita.entrypoints=websecure"
      - "traefik.http.routers.kavita.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.kavita.tls=true"
      - "traefik.http.services.kavita.loadbalancer.server.port=5000"
    healthcheck:
      <<: *healthcheck-default
      # linuxserver base ships curl; Kavita exposes /api/health.
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      start_period: 45s
    cpu_shares: *cpu-prio-normal
    # Idle RSS is ~210 MB; the headroom is for cover generation, where libvips
    # decodes a whole page and 512m was OOM-killed on files over 100 MB.
    mem_limit: 1g
    oom_score_adj: *oom-score-deprioritize

  shelfmark:
    <<: *service-defaults
    # The full image, for its bundled bypasser (SeleniumBase undetected CDP).
    # "lite" reuses Prowlarr's FlareSolverr instead, which is cheaper but only
    # handles Cloudflare: Anna's Archive is behind DDoS-Guard, which FlareSolverr
    # reports as solved while returning the interstitial. Costs a second Chromium,
    # hence the mem_limit and shm_size below.
    image: ghcr.io/calibrain/shelfmark:v1.3.15@sha256:9602290324993c801b319d3166b202b96bd9039af2416f0916dae03a5bdca815
    container_name: pi-shelfmark
    profiles: ["shelfmark", "all"]
    networks:
      - frontend
    # Pi-hole's blocklists cover several of the metadata and release sources
    # Shelfmark queries; same reason prowlarr and flaresolverr resolve directly.
    # Container names still resolve: Docker keeps 127.0.0.11 and forwards here.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    extra_hosts:
      # Authelia's OIDC discovery endpoint, reached through Traefik internally.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 8084
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
      # Everything the onboarding wizard asks for is set here or in
      # config/shelfmark/shelfmark.env, so there is nothing left to answer.
      - ONBOARDING=false
      - SEARCH_MODE=universal
      # universal mode needs a metadata provider; all three default to off and
      # the skipped wizard is what would enable one. Open Library is the only one
      # needing no API key, and is already METADATA_PROVIDER's default.
      - OPENLIBRARY_ENABLED=true
      - SESSION_COOKIE_SECURE=true
      # Read before the settings system exists, so it cannot live in
      # security.json with the rest of the OIDC configuration. It drops the
      # local-admin account Shelfmark otherwise demands before OIDC may be
      # enabled — an account no unattended install can create — and hides the
      # password form that would then have no valid login behind it.
      - DISABLE_LOCAL_AUTH=true
      # Already the default, but set here to override the true that the lite
      # deployment persisted in /config/plugins/cloudflare_bypass.json.
      - USING_EXTERNAL_BYPASSER=false
      - DIRECT_DOWNLOAD_ENABLED=true
      # Anna's Archive often has no language metadata, and libgen records carry
      # none at all. Without this those results are filtered out before anything
      # can look at the file path, which with BOOK_LANGUAGE=fr drops most of the
      # French catalogue; on, the '[BD FR]'-style tag in the path is read instead.
      - DIRECT_DOWNLOAD_LANGUAGE_FROM_PATH=true
      # Shelfmark asks Prowlarr for one category per content type - [3030] for an
      # audiobook, [7000] for everything else - and skips any indexer whose capabilities
      # do not declare it. 7000 is a parent, so it expands over the whole Books range and
      # ebook searches are broad; 3030 is a leaf, and 5 of the 12 enabled indexers here
      # (YggReborn and Torrent9 among them) never declare it, so they are not queried for
      # an audiobook at all. This reruns a query variant with no category filter when
      # that variant returned nothing and no indexer errored, which is the only way those
      # indexers are reached from inside Shelfmark. Costs a second round of queries, and
      # only on a variant that already came back empty.
      #
      # It does NOT rescue a release that a queried indexer tagged 7000 rather than 3030
      # - category follows the tracker section the uploader picked, so this happens even
      # on indexers that mostly use 3030 - because the search then has results and never
      # expands. Those need Prowlarr's UI and the `audiobooks` qBittorrent category; see
      # docs/TROUBLESHOOTING.md.
      - PROWLARR_AUTO_EXPAND=true
      # Kavita's Book library, not its comic ones: cbz/cbr are Kapowarr's job and
      # land in a library with a different parser, so they are dropped here and
      # pdf (which the default list omits) is added.
      - SUPPORTED_FORMATS=epub,pdf,mobi,azw3,fb2,djvu
      - INGEST_DIR=/downloads/books
      - DESTINATION_AUDIOBOOK=/downloads/audiobooks
      # Audiobookshelf calls a book either a subfolder of the library or a single
      # loose file at its root - it never groups root-level files, not even ones
      # sharing an `album` tag. The default here is "rename", which renames
      # single-file grabs and leaves multi-file ones with their original names, so
      # a 59-track Odyssee landed as 59 flat mp3s and Audiobookshelf made 59
      # one-track books out of them. "organize" applies
      # TEMPLATE_AUDIOBOOK_ORGANIZE ({Author}/{Title}/{Title}), which is the
      # layout Audiobookshelf expects; upstream labels it "Recommended for
      # Audiobookshelf". Safe here because DESTINATION_AUDIOBOOK is a library
      # Audiobookshelf reads, not an ingest folder that consumes what it finds.
      - FILE_ORGANIZATION_AUDIOBOOK=organize
      # qBittorrent saves Shelfmark's grabs outside /downloads/books so a raw
      # torrent tree never reaches Kavita; only the processed file is filed there.
      # The same reasoning keeps audiobooks out of /downloads/audiobooks while they
      # download: Audiobookshelf reads that folder, so a raw release tree there
      # would be indexed alongside the organised copy Shelfmark then writes.
      - QBITTORRENT_DOWNLOAD_DIR=/downloads/shelfmark
      - QBITTORRENT_CATEGORY=shelfmark
      # Same staging folder as QBITTORRENT_CATEGORY (both categories pin savePath
      # to /downloads/shelfmark in scripts/qbittorrent-bootstrap.sh) - the split is
      # for legibility only. Shelfmark routes by the task's content type, not by
      # category, so mixing them was harmless but left no way to tell an ebook
      # grab from an audiobook one in qBittorrent's list.
      - QBITTORRENT_CATEGORY_AUDIOBOOK=shelfmark-audiobooks
      - CALIBRE_WEB_URL=https://kavita.${HOST_NAME:-pi.lan}
    env_file:
      - path: ./config/shelfmark/shelfmark.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/shelfmark:/config
      # One mount at the path qBittorrent uses, so a completed torrent is at the
      # same path in both containers and needs no remote path mapping. It also
      # carries the two destinations: books/ is the folder Kavita indexes as its
      # Book library, audiobooks/ is served through Nextcloud.
      - ${DATA_LOCATION:-./data}/download:/downloads
    labels:
      - "homepage.group=Books"
      - "homepage.name=Shelfmark"
      - "homepage.icon=shelfmark.png"
      - "homepage.href=https://shelfmark.${HOST_NAME:-pi.lan}"
      - "homepage.description=Book and audiobook search"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Shelfmark has its own account system, fed by Authelia over OIDC, so
      # lan@docker only — no forward-auth on top (same rationale as Kavita).
      - "traefik.http.routers.shelfmark.rule=Host(`shelfmark.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.shelfmark.entrypoints=websecure"
      - "traefik.http.routers.shelfmark.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.shelfmark.tls=true"
      - "traefik.http.services.shelfmark.loadbalancer.server.port=8084"
    healthcheck:
      <<: *healthcheck-default
      # python-slim base with curl installed; /api/health needs no auth.
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/api/health"]
      start_period: 90s
    cpu_shares: *cpu-prio-normal
    # Chromium crashes rendering a page with the default 64MB /dev/shm, and needs
    # the headroom - the same two settings flaresolverr carries.
    shm_size: "256m"
    mem_limit: 2g
    memswap_limit: 2560m
    oom_score_adj: *oom-score-deprioritize

  audiobookshelf:
    <<: *service-defaults
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    container_name: pi-audiobookshelf
    profiles: ["audiobookshelf", "all"]
    networks:
      - frontend
    extra_hosts:
      # Authelia's OIDC discovery endpoint, reached through Traefik internally.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 80
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # ROUTER_BASE_PATH is deliberately NOT set. Unset does not mean "no
      # subfolder": both the server and the client read it as
      # `?? '/audiobookshelf'`, and the published image builds its Nuxt client
      # with that default baked into every asset URL. Setting it to the empty
      # string makes the server stop serving that prefix while the client keeps
      # asking for it, so every /audiobookshelf/_nuxt/*.js 404s and the page
      # hangs on its spinner. The app is meant to live under that path; the
      # server's rewrite of prefix-less URLs is a convenience on top.
    volumes:
      # Root-owned, like every other container here: the image has no PUID/PGID
      # and pinning `user:` would only move the problem, since a bind source the
      # daemon creates is root-owned anyway. It costs nothing because these two
      # directories are the only things Audiobookshelf writes - the library
      # below is read-only, so the shared download tree is never touched.
      - ${DATA_LOCATION:-./data}/audiobookshelf/config:/config
      # Covers, cached cover art and the app's own backups. Split from /config on
      # purpose: /config is the small unrecoverable half (the SQLite database)
      # that Backrest mounts, and this one is regenerable from the audio files.
      - ${DATA_LOCATION:-./data}/audiobookshelf/metadata:/metadata
      # Shelfmark's DESTINATION_AUDIOBOOK, which until now only reached Nextcloud
      # as storage. Read-only for the same reason Kavita's libraries are: with the
      # default settings Audiobookshelf keeps every scan artefact under /metadata,
      # so a library it only reads is never written back to.
      - ${DATA_LOCATION:-./data}/download/audiobooks:/audiobooks:ro
    labels:
      - "homepage.group=Books"
      - "homepage.name=Audiobookshelf"
      - "homepage.icon=audiobookshelf.png"
      - "homepage.href=https://audiobooks.${HOST_NAME:-pi.lan}"
      # Not "and podcast player": Audiobookshelf downloads podcast episodes into
      # the library folder, and the only media mount here is :ro, so a podcast
      # library would fail with EROFS. Adding one means adding a writable mount.
      - "homepage.description=Audiobook player with progress sync"
      - "homepage.widget.type=audiobookshelf"
      - "homepage.widget.url=http://pi-audiobookshelf"
      # An API key minted by scripts/homepage-widgets-bootstrap.sh. Audiobookshelf
      # returns the key once, at creation, so the secret file is the only copy.
      - "homepage.widget.key={{HOMEPAGE_FILE_AUDIOBOOKSHELF_API_KEY}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Audiobookshelf has its own account system, fed by Authelia over OIDC, and
      # its mobile apps cannot complete an interactive portal - so lan@docker
      # only, no forward-auth on top (same rationale as Kavita and Shelfmark).
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.routers.audiobookshelf.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.audiobookshelf.tls=true"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-default
      # node:20-alpine ships no curl; busybox provides wget. /healthcheck is
      # unauthenticated and answers 200 as soon as the server is listening.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthcheck"]
      start_period: 45s
    cpu_shares: *cpu-prio-normal
    # Idle RSS is ~150 MB; the headroom is for the scanner, which probes every
    # file with ffprobe, and for the ffmpeg transcode a non-m4b stream triggers.
    mem_limit: 1g
    oom_score_adj: *oom-score-deprioritize

  ntfy:
    <<: *service-defaults
    image: binwiederhier/ntfy:v2.28.0
    container_name: pi-ntfy
    command: serve
    networks:
      - frontend
      - ntfy
    expose:
      - 80
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - NTFY_BASE_URL=https://ntfy.${HOST_NAME:-pi.lan}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_ENABLE_LOGIN=true
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_SMTP_SENDER_ADDR=${SMTP_HOST:-localhost}:${SMTP_PORT:-587}
      - NTFY_SMTP_SENDER_USER=${SMTP_USERNAME:-}
      - NTFY_SMTP_SENDER_PASS=${SMTP_PASSWORD:-}
      - NTFY_SMTP_SENDER_FROM=${EMAIL:-noreply@localhost}
    env_file:
      - path: ./config/ntfy/ntfy.env
        required: false
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    labels:
      - "homepage.group=Notifications"
      - "homepage.name=ntfy"
      - "homepage.icon=ntfy.png"
      - "homepage.href=https://ntfy.${HOST_NAME:-pi.lan}"
      - "homepage.description=Self-hosted notifications"
      - "homepage.widget.type=ntfy"
      - "homepage.widget.url=http://pi-ntfy"
      # The widget reads a single topic; monitoring is the one worth a glance on
      # the dashboard. downloads and security are phone-only topics.
      - "homepage.widget.topic=monitoring"
      - "homepage.widget.username={{HOMEPAGE_VAR_ADMIN_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.ntfy.tls=true"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/v1/health"]
    cpu_shares: *cpu-prio-critical
    mem_limit: 128m
    mem_reservation: 32m
    oom_score_adj: *oom-score-important

  vaultwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.2
    container_name: pi-vaultwarden
    profiles: ["vaultwarden", "all"]
    # Not frontend: no east-west consumer at all. See `vaultwarden_web` below.
    networks:
      - vaultwarden_web
      - vault
    expose:
      - 80
    # So the SSO_AUTHORITY discovery call resolves to Traefik, reached on
    # vaultwarden_web since this container moved off frontend.
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.14.250"
    # Neither SSO_CLIENT_SECRET nor ADMIN_TOKEN has a *_FILE variant, so the mounted
    # secrets are exported before handing over to the image's own /start.sh. Same
    # trick as open-webui. Both values are hex/PHC, so they need no quoting.
    entrypoint: ["sh", "-c", "export SSO_CLIENT_SECRET=$(cat /run/secrets/oidc_vaultwarden_secret) ADMIN_TOKEN=$(cat /run/secrets/admin_token_hash) && exec /start.sh"]
    environment:
      - DOMAIN=https://vault.${HOST_NAME:-pi.lan}
      - DATABASE_URL=postgresql://vaultwarden:${PASSWORD}@postgres/vaultwarden
      # This router is only behind the LAN allowlist, so open registration would
      # let anyone on the tailnet create a vault. Invite from /admin instead.
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      # ADMIN_TOKEN is exported by the entrypoint from an Argon2id digest generated
      # by scripts/vaultwarden-pre-start.sh - deliberately not derived from PASSWORD.
      # This does NOT remove the master password: that key encrypts the vault
      # itself and never reaches the identity provider.
      - SSO_ENABLED=true
      - SSO_AUTHORITY=https://auth.${HOST_NAME:-pi.lan}
      - SSO_CLIENT_ID=vaultwarden
      - SSO_SCOPES=profile email offline_access
      # Native email+password login is off, so everyone who signs in - including
      # an emergency-access contact - must exist in LLDAP. An invitation only
      # creates a stub account, claimed by signing in through Authelia.
      - SSO_ONLY=true
      # Authelia rotates refresh tokens single-use with no grace period, and the
      # Bitwarden clients refresh even while their access token is still valid.
      # Any refresh response that fails to reach the client (a restart mid-flight,
      # a transient 500) therefore burns the only token it holds and locks it out
      # for good. Authelia stays the sole way *in*; the session it opens is ours.
      - SSO_AUTH_ONLY_NOT_SESSION=true
      # Deliberate, not just the default: needs the SMTP below to deliver its
      # invite, grant and takeover-notification mails.
      - EMERGENCY_ACCESS_ALLOWED=true
      # starttls suits the default port 587; use force_tls on 465.
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${EMAIL:-noreply@localhost}
      - SMTP_FROM_NAME=Vaultwarden
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/vaultwarden:/data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_vaultwarden_secret.txt:/run/secrets/oidc_vaultwarden_secret:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/vaultwarden_admin_token_hash:/run/secrets/admin_token_hash:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The bundled /healthcheck.sh already handles ROCKET_PORT and base paths.
      <<: *healthcheck-light
      test: ["CMD", "/healthcheck.sh"]
    labels:
      - "homepage.group=Security"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden.png"
      - "homepage.href=https://vault.${HOST_NAME:-pi.lan}"
      - "homepage.description=Bitwarden-compatible password manager"
      - "traefik.enable=true"
      - "traefik.docker.network=vaultwarden_web"
      # Deliberately no authelia@docker: forward-auth breaks the browser extension
      # and mobile clients, which cannot complete the interactive portal. They are
      # authenticated through OIDC instead (see SSO_* above).
      # The websecure entrypoint's security-headers sets X-Frame-Options: DENY on
      # every response, which Vaultwarden's own diagnostics flag: it replaces the
      # SAMEORIGIN the API needs, and adds the header to the *-connector.html pages
      # that must have none - those are framed by the browser extension from a
      # chrome-extension:// origin, which any X-Frame-Options value would block.
      # Restoring per-router requires re-emitting the header after the entrypoint.
      - "traefik.http.middlewares.vaultwarden-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.middlewares=vaultwarden-frame@docker,lan@docker"
      - "traefik.http.routers.vaultwarden.tls=true"
      # Longer rule than the catch-all above, so Traefik's rule-length priority
      # picks it for the connector pages without an explicit priority.
      - "traefik.http.routers.vaultwarden-connector.rule=Host(`vault.${HOST_NAME:-pi.lan}`) && (Path(`/webauthn-connector.html`) || Path(`/sso-connector.html`))"
      - "traefik.http.routers.vaultwarden-connector.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-connector.middlewares=lan@docker"
      - "traefik.http.routers.vaultwarden-connector.tls=true"
      - "traefik.http.routers.vaultwarden-connector.service=vaultwarden"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    cpu_shares: *cpu-prio-normal
    mem_limit: 256m
    mem_reservation: 32m
    oom_score_adj: *oom-score-important

  # Authentication & SSO
  lldap:
    <<: *service-defaults
    image: lldap/lldap:v0.6.3-alpine@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
    container_name: pi-lldap
    networks:
      - frontend
      - auth
    expose:
      - 3890
      - 17170
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - LLDAP_LDAP_BASE_DN=dc=home,dc=ldap
      - LLDAP_LDAP_USER_EMAIL=${EMAIL}
      - LLDAP_LDAP_USER_PASS=${PASSWORD}
      - LLDAP_HTTP_URL=https://lldap.${HOST_NAME:-pi.lan}
      - LLDAP_DATABASE_URL=postgres://lldap:${PASSWORD}@postgres/lldap
      - LLDAP_VERBOSE=false
      - LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET=true
      - LLDAP_SMTP_OPTIONS__SERVER=${SMTP_HOST:-localhost}
      - LLDAP_SMTP_OPTIONS__PORT=${SMTP_PORT:-587}
      - LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-STARTTLS}
      - LLDAP_SMTP_OPTIONS__USER=${SMTP_USERNAME:-}
      - LLDAP_SMTP_OPTIONS__PASSWORD=${SMTP_PASSWORD:-}
      - LLDAP_SMTP_OPTIONS__FROM=${EMAIL:-noreply@localhost}
    env_file:
      - path: ./config/lldap/lldap.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/lldap:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-default
      # A responding HTTP API confirms the LDAP port is up too, which is what
      # authelia dials at startup.
      test: ["CMD", "curl", "-sf", "http://localhost:17170/"]
      start_period: 30s
    labels:
      - "homepage.group=Authentication"
      - "homepage.name=LLDAP"
      - "homepage.href=https://lldap.${HOST_NAME:-pi.lan}"
      - "homepage.description=User directory management"
      - "homepage.icon=lldap.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.lldap.rule=Host(`lldap.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.lldap.entrypoints=websecure"
      - "traefik.http.routers.lldap.middlewares=frame-deny@docker,lan@docker,rate-limit-auth@docker,authelia@docker"
      - "traefik.http.routers.lldap.tls=true"
      - "traefik.http.services.lldap.loadbalancer.server.port=17170"
    cpu_shares: *cpu-prio-critical
    mem_limit: 128m
    mem_reservation: 16m
    oom_score_adj: *oom-score-critical

  authelia:
    <<: *service-defaults
    image: authelia/authelia:4.39.23
    container_name: pi-authelia
    networks:
      - frontend
      - auth
    expose:
      - 9091
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - X_AUTHELIA_CONFIG_FILTERS=template
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-STARTTLS}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL=${EMAIL:-authelia@localhost}
    volumes:
      - ${DATA_LOCATION:-./data}/authelia-config/configuration.yml:/config/configuration.yml:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets:/config/secrets:ro
      - ${DATA_LOCATION:-./data}/authelia-config:/config/data
    depends_on:
      lldap:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/api/health"]
      start_period: 10s
      start_interval: 5s
    labels:
      - "homepage.group=Authentication"
      - "homepage.name=Authelia"
      - "homepage.icon=authelia.png"
      - "homepage.href=https://auth.${HOST_NAME:-pi.lan}"
      - "homepage.description=SSO authentication portal"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.authelia.rule=Host(`auth.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.middlewares=frame-deny@docker,security-headers@docker"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth"
      # false so Traefik derives Method/Proto/Host/Uri from the request it actually
      # received; true forwards the client's own, i.e. what the caller chose.
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=false"
      - "traefik.http.middlewares.authelia.forwardauth.authRequestHeaders=Accept,Cookie,Authorization"
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      - "traefik.http.middlewares.authelia.forwardauth.maxResponseBodySize=4096"
    cpu_shares: *cpu-prio-critical
    # Measured at 74m serving the current client list; 128m left almost no room
    # for a request spike, and an OOM here takes every gated router down with it.
    mem_limit: 192m
    mem_reservation: 48m
    oom_score_adj: *oom-score-critical

  # AI
  # Inference backend for open-webui, serving Gemma 4 E2B on the Pi's CPU.
  #
  # llama.cpp's own server rather than Ollama, which wraps this exact engine and
  # adds a model registry and per-request runners - dead weight on a box with
  # room for one resident model. Going direct runs one process instead of two and
  # already speaks the OpenAI API open-webui calls.
  llama-cpp:
    <<: *service-defaults
    image: ghcr.io/ggml-org/llama.cpp:server-b10481
    container_name: pi-llama-cpp
    profiles: ["llama-cpp", "all"]
    networks:
      - ai
    expose:
      - 8080
    environment:
      # The ai network is internal: scripts/llama-cpp-pre-start.sh seeds the
      # volume beforehand and OFFLINE stops the server from trying to fetch.
      - LLAMA_ARG_MODEL=/models/gemma-4-E2B-it-qat-Q4_0.gguf
      - LLAMA_ARG_MMPROJ=/models/mmproj-gemma-4-E2B-it.gguf
      - LLAMA_ARG_OFFLINE=1
      # Speculative decoding off Gemma 4's multi-token-prediction head. CPU
      # generation is bandwidth bound, so verifying several drafted tokens in one
      # pass is nearly free: 5.3 -> 10.6 tok/s here, with identical output.
      - LLAMA_ARG_SPEC_DRAFT_MODEL=/models/mtp-gemma-4-E2B-it-Q4_0.gguf
      - LLAMA_ARG_SPEC_TYPE=draft-mtp
      - LLAMA_ARG_ALIAS=gemma-4-e2b-it
      - LLAMA_ARG_PORT=8080
      # A fourth thread measured no faster (bandwidth bound), and leaving core 0
      # alone keeps traefik, pihole and unbound responsive during a chat.
      - LLAMA_ARG_THREADS=3
      - LLAMA_ARG_FLASH_ATTN=on
      # The model goes to 128k, which no Pi has the RAM or the patience for. Left
      # at f16: sliding-window attention keeps the cache small anyway, and
      # quantising it cost ~10% generation speed for no memory worth having.
      - LLAMA_ARG_CTX_SIZE=16384
      # Thinking off: at 10 tok/s, reasoning meant ~500 tokens - a minute of empty
      # chat window - before the first word of an answer. Drop this line to
      # restore it. --reasoning-budget 0 is NOT equivalent: it closes the channel
      # without telling the model, which then reasons in the visible answer.
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"enable_thinking":false}'
      # Concurrent requests queue instead of splitting the three threads: the
      # default runs several slots at once, and two parallel requests each
      # generated at ~5 tok/s here rather than one at ~10.
      - LLAMA_ARG_N_PARALLEL=1
      # open-webui is the routed frontend; keep the surface down to the API.
      - LLAMA_ARG_UI=false
    volumes:
      - llama_models:/models
    healthcheck:
      <<: *healthcheck-relaxed
      # /health is 503 while the weights load, 200 once a slot is free.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      start_period: 120s
      start_interval: 5s
    labels:
      # No homepage.href: an API behind open-webui, not a page to open. mdi- icons
      # throughout the group because dashboard-icons has nothing for these.
      - "homepage.group=AI"
      - "homepage.name=llama.cpp"
      - "homepage.description=Gemma 4 E2B inference"
      - "homepage.icon=mdi-brain"
    cpu_shares: *cpu-prio-idle
    cpuset: "1-3"
    # Weights are mmap'd, and the cgroup counts those pages: 3.4G of model plus
    # ~1G of vision projector, KV cache and compute buffers.
    mem_limit: 6g
    memswap_limit: 8g
    oom_score_adj: *oom-score-deprioritize

  # Text-to-speech for open-webui's read-aloud button, with real French voices.
  #
  # Built here because upstream (OHF-Voice/piper1-gpl) publishes no image, and its
  # own server speaks its own protocol rather than the OpenAI shape open-webui
  # calls - see config/piper/openai_api.py for that translation.
  piper:
    <<: *service-defaults
    build:
      context: ./config/piper
      dockerfile: Dockerfile
    image: pi-piper:local
    container_name: pi-piper
    profiles: ["piper", "all"]
    networks:
      - ai
    expose:
      - 8000
    environment:
      # open-webui defaults to OpenAI voice names (alloy, echo), none of which
      # exist here, so in practice this picks the voice. A language rather than a
      # voice id, so moving the stack to another language needs no Piper
      # knowledge; set PIPER_DEFAULT_VOICE to name one outright. The voice has to
      # be in the image - see the VOICES build arg in config/piper/Dockerfile.
      - PIPER_DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en-US}
    healthcheck:
      <<: *healthcheck-relaxed
      # python:3.12-slim ships no curl or wget, but python is the point of it.
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 30s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Piper"
      - "homepage.description=Text-to-speech, French by default"
      - "homepage.icon=mdi-text-to-speech"
    cpu_shares: *cpu-prio-idle
    # Same three cores as llama-cpp, leaving core 0 to traefik and DNS.
    cpuset: "1-3"
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # Speech-to-text for open-webui's microphone button.
  #
  # Open WebUI's own faster-whisper runs inside the open-webui container, capped
  # at 1g and already sitting at ~730MB, so the model has to stay small enough to
  # be bad. On 113s of read French (FLEURS fr_fr) over this Pi's three cores the
  # default `base` scored 20.2% WER at 0.95x realtime; `small` 12.5% at 1.25x and
  # `medium` 4.9% at 3.99x, the last two needing 1-2.7GB the web UI has no room
  # for. Parakeet lands whisper-medium's accuracy at 8.7% WER and 0.17x realtime,
  # a dictated sentence coming back in well under a second, and has no language
  # setting at all: it covers 25 European languages and picks one acoustically.
  #
  # Built here for the same reason as piper: upstream publishes no image, and
  # onnx-asr has no HTTP server at all - see config/parakeet/openai_api.py.
  parakeet:
    <<: *service-defaults
    build:
      context: ./config/parakeet
      dockerfile: Dockerfile
    image: pi-parakeet:local
    container_name: pi-parakeet
    profiles: ["parakeet", "all"]
    networks:
      - ai
    expose:
      - 8000
    environment:
      # Must match the Dockerfile build arg of the same name, or the weights
      # loaded are not the weights present. fp32 is the better model - 4.5% WER
      # against 8.7% - but 2.3GB resident instead of 1.2GB, and a ~2.5GB download.
      - PARAKEET_QUANTIZATION=int8
      # Matches the cpuset below; onnxruntime would otherwise size its thread
      # pool from the host's four cores and oversubscribe the cgroup.
      - PARAKEET_THREADS=3
    healthcheck:
      <<: *healthcheck-relaxed
      # /health is 503 until the model is resident, ~5s from start.
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 60s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Parakeet"
      - "homepage.description=Multilingual speech-to-text"
      - "homepage.icon=mdi-microphone-message"
    cpu_shares: *cpu-prio-idle
    # Same three cores as llama-cpp and piper, leaving core 0 to traefik and DNS.
    cpuset: "1-3"
    # ~1.2GB resident for the int8 weights and the onnxruntime arena, plus the
    # encoder's working set on a full window (~1.4GB measured). The headroom is
    # what stops a long upload being an OOM: before openai_api.py windowed them,
    # a 120s pass went past 2GB.
    mem_limit: 2560m
    memswap_limit: 3584m
    oom_score_adj: *oom-score-deprioritize

  # Serves the host's status to the local model as an OpenAPI tool; see
  # config/system-tools/app.py. / is mounted at /hostfs because statvfs cannot
  # measure a filesystem this process cannot see.
  system-tools:
    <<: *service-defaults
    build:
      context: ./config/system-tools
      dockerfile: Dockerfile
    image: pi-system-tools:local
    container_name: pi-system-tools
    profiles: ["system-tools", "all"]
    networks:
      - ai
      # `devices` reads headscale's node API, which only listens on frontend.
      # Egress only: nothing here accepts a URL, so the reachable surface widens
      # but the steerable one does not. Putting headscale on `ai` instead would
      # hand it a leg into the network where open-webui runs admin-supplied Python.
      - frontend
    expose:
      - 8000
    environment:
      # Without this the container is UTC and `uptime` is four hours off.
      - TZ=${TIMEZONE:-Europe/Paris}
      # Derived from the directory name, so it cannot be guessed in-container.
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-pi-web}
      # Backrest's own log, because the repos are remote and restic would want
      # their password. Read off the bind mount below rather than through
      # /hostfs: DATA_LOCATION is relative to the project directory by default,
      # and a relative path means nothing against the host root.
      - BACKREST_OPLOG=/run/backrest/oplog.sqlite
      - HEADSCALE_URL=http://pi-headscale:8080
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      # rslave, or unplugging /mnt/usbdrive fails while this container runs.
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          propagation: rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Backrest's data directory, holding the oplog `backups` reads. A directory
      # rather than the file itself: the oplog does not exist before backrest's
      # first run, and Docker would materialise a directory in its place.
      - ${DATA_LOCATION:-./data}/backrest/data:/run/backrest:ro
      # The key homepage's headscale widget already uses, rather than a second one
      # to rotate: Headscale API keys expire, so both break together.
      # scripts/headscale-pre-start.sh keeps the path a file, or Docker would
      # create a directory here and the bootstrap could never write the key in.
      - ./config/homepage/secrets/headscale_api_key:/run/secrets/headscale_api_key:ro
    healthcheck:
      <<: *healthcheck-relaxed
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 20s
    labels:
      - "homepage.group=AI"
      - "homepage.name=System Tools"
      - "homepage.description=Server status for the local LLM"
      - "homepage.icon=mdi-tools"
    # No cpuset: a call only runs while llama-cpp waits for its result.
    cpu_shares: *cpu-prio-normal
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  open-webui:
    <<: *service-defaults
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: pi-open-webui
    profiles: ["open-webui", "all"]
    networks:
      - frontend
      - ai
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.1"
    expose:
      - 8080
    # Plain assignments under `-e`; see the same entrypoint on the litellm
    # service for why `export X=$(cat ...)` hid a missing file.
    entrypoint: ["bash", "-euc", "OAUTH_CLIENT_SECRET=$(cat /run/secrets/oidc_open-webui_secret); OPENAI_API_KEY=sk-$(cat /run/secrets/litellm/master_key); export OAUTH_CLIENT_SECRET OPENAI_API_KEY; exec bash start.sh"]
    environment:
      - WEBUI_AUTH=true
      - ENABLE_LOGIN_FORM=false
      - CORS_ALLOW_ORIGIN=https://ai.${HOST_NAME:-pi.lan}
      - ENABLE_OAUTH_SIGNUP=true
      # Authelia already gates ai.${HOST_NAME:-pi.lan}, so Open WebUI's own
      # "pending" default would just park every SSO login until an admin looks.
      - DEFAULT_USER_ROLE=user
      - OAUTH_CLIENT_ID=open-webui
      - OPENID_PROVIDER_URL=https://auth.${HOST_NAME:-pi.lan}/.well-known/openid-configuration
      - OAUTH_PROVIDER_NAME=Authelia
      - OAUTH_SCOPES=openid profile email
      - OAUTH_USERNAME_CLAIM=preferred_username
      # Authelia's portal logout route, not an end_session_endpoint - see
      # docs/SECURITY.md. Open WebUI redirects to this verbatim once discovery
      # turns up no endpoint of its own.
      - WEBUI_AUTH_SIGNOUT_REDIRECT_URL=https://auth.${HOST_NAME:-pi.lan}/logout?rd=https%3A%2F%2Fai.${HOST_NAME:-pi.lan}%2Fauth
      - DATABASE_URL=postgresql://open-webui:${PASSWORD}@postgres/open-webui
      # Through LiteLLM, so a model added there appears here without touching
      # this file. The master key rather than a virtual one: a virtual key can
      # only be minted after LiteLLM is up, which is after this container is
      # created. The entrypoint above reads it from the file the proxy reads, so
      # a rotation cannot leave the two disagreeing.
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      # No Ollama in the stack; left on, this probes localhost:11434 on every
      # start and on the model list of every page load.
      - ENABLE_OLLAMA_API=false
      - DEFAULT_LOCALE=${DEFAULT_LANGUAGE:-en-US}
      # Speech-to-text on the parakeet sidecar rather than the faster-whisper that
      # ships inside this container - see that service for the numbers. These are
      # PersistentConfig, so they only take on an instance that has never started;
      # scripts/open-webui-bootstrap.sh carries the same values to one whose
      # database already exists.
      #
      # The base URL is not optional: Open WebUI defaults it to
      # OPENAI_API_BASE_URL, which here is litellm, so leaving it out would
      # point the microphone at the chat model.
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://parakeet:8000/v1
      - AUDIO_STT_MODEL=parakeet-tdt-0.6b-v3
      - AUDIO_STT_OPENAI_API_KEY=parakeet
    volumes:
      - open_webui_data:/app/backend/data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_open-webui_secret.txt:/run/secrets/oidc_open-webui_secret:ro
      # The whole directory, for the reason given on the litellm service. The
      # salt key comes with it, and unlocks nothing the master key does not.
      - ${DATA_LOCATION:-./data}/litellm/secrets:/run/secrets/litellm:ro
    depends_on:
      postgres:
        condition: service_healthy
      # llama-cpp is reached through litellm now, so this is where the wait is.
      litellm:
        condition: service_healthy
        required: false
      # service_started, not service_healthy: system-tools is on the relaxed
      # healthcheck (120s interval, no start_interval), so Docker's first probe
      # lands at t=120s and the chat UI would wait for it on every boot - for a
      # tool server that is only ever called mid-conversation.
      system-tools:
        condition: service_started
        required: false
    healthcheck:
      <<: *healthcheck-relaxed
      test: ["CMD", "curl", "-fsS", "http://localhost:8080"]
      start_period: 60s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Open WebUI"
      - "homepage.href=https://ai.${HOST_NAME:-pi.lan}"
      - "homepage.description=Local AI chat"
      - "homepage.icon=open-webui.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.open-webui.rule=Host(`ai.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    cpu_shares: *cpu-prio-idle
    mem_limit: 1g
    memswap_limit: 1536m
    oom_score_adj: *oom-score-deprioritize

  # OpenAI-compatible gateway in front of llama-cpp. Everything that speaks to a
  # model goes through here, so a second model or a cloud provider is a row in
  # its database instead of an environment change in every client, and the spend
  # of each key is recorded whether the caller is the chat UI or a script.
  litellm:
    <<: *service-defaults
    image: ghcr.io/berriai/litellm:v1.100.0
    container_name: pi-litellm
    # open-webui, because the chat has no models without this proxy now. Same
    # shape as flaresolverr under prowlarr.
    profiles: ["litellm", "open-webui", "all"]
    networks:
      - frontend
      - ai
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 4000
    # Three values that cannot come from `environment:`, all files - see
    # scripts/litellm-pre-start.sh for why two of them are not PASSWORD.
    #
    # Plain assignments under `-e`, not `export X=$(cat ...)`: export is a
    # command, so its own success masks a failed substitution, and the proxy came
    # up with the master key "sk-" and an empty salt key. Measured both ways.
    entrypoint: ["bash", "-euc", "GENERIC_CLIENT_SECRET=$(cat /run/secrets/oidc_litellm_secret); LITELLM_SALT_KEY=$(cat /run/secrets/litellm/salt_key); LITELLM_MASTER_KEY=sk-$(cat /run/secrets/litellm/master_key); export GENERIC_CLIENT_SECRET LITELLM_SALT_KEY LITELLM_MASTER_KEY; exec docker/prod_entrypoint.sh --config /etc/litellm/config.yaml --port 4000"]
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # No UI_PASSWORD, so this account's password is the master key - the way
      # back in when Authelia itself is what is broken.
      - UI_USERNAME=${ADMIN_USER:-admin}
      - DATABASE_URL=postgresql://litellm:${PASSWORD}@postgres:5432/litellm
      - STORE_MODEL_IN_DB=True
      # What the SSO redirect URI is built from; without it LiteLLM sends the
      # browser back to the container's own address.
      - PROXY_BASE_URL=https://llm.${HOST_NAME:-pi.lan}
      # Matched against GENERIC_USER_ID_ATTRIBUTE below: this account is
      # promoted to proxy_admin, everyone else gets config/litellm's role.
      - PROXY_ADMIN_ID=${ADMIN_USER:-admin}
      - GENERIC_CLIENT_ID=litellm
      # Written out rather than discovered: LiteLLM's generic provider takes the
      # three endpoints, not an issuer.
      - GENERIC_AUTHORIZATION_ENDPOINT=https://auth.${HOST_NAME:-pi.lan}/api/oidc/authorization
      - GENERIC_TOKEN_ENDPOINT=https://auth.${HOST_NAME:-pi.lan}/api/oidc/token
      - GENERIC_USERINFO_ENDPOINT=https://auth.${HOST_NAME:-pi.lan}/api/oidc/userinfo
      - GENERIC_USER_ID_ATTRIBUTE=preferred_username
      - GENERIC_USER_EMAIL_ATTRIBUTE=email
      - GENERIC_USER_DISPLAY_NAME_ATTRIBUTE=name
    volumes:
      - ./config/litellm/config.yaml:/etc/litellm/config.yaml:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_litellm_secret.txt:/run/secrets/oidc_litellm_secret:ro
      # The directory, not the files inside it: Docker materialises a
      # *directory* at a missing bind-mount source, and `[ -s ]` in the
      # pre-start hook then reads that as already generated. An empty directory
      # is merely empty, and the next hook run fills it in place.
      - ${DATA_LOCATION:-./data}/litellm/secrets:/run/secrets/litellm:ro
    depends_on:
      postgres:
        condition: service_healthy
      llama-cpp:
        condition: service_started
        required: false
    healthcheck:
      <<: *healthcheck-relaxed
      # The image ships neither curl nor wget, and /health/liveliness is the one
      # health route that takes no credential.
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:4000/health/liveliness').read()"]
      # Prisma migrates on first start. start_interval so open-webui, which
      # waits on this being healthy, is not held to the 120s probe interval.
      start_period: 180s
      start_interval: 5s
    labels:
      - "homepage.group=AI"
      - "homepage.name=LiteLLM"
      - "homepage.href=https://llm.${HOST_NAME:-pi.lan}"
      - "homepage.description=LLM gateway, keys and spend"
      # dashboard-icons has nothing for LiteLLM.
      - "homepage.icon=mdi-router-network"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.litellm.rule=Host(`llm.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.litellm.entrypoints=websecure"
      # No authelia@docker: /v1 is called with a virtual key by scripts and
      # editors that have no browser to complete a login in, and the UI has the
      # Authelia OIDC client above.
      - "traefik.http.routers.litellm.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.litellm.tls=true"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
    cpu_shares: *cpu-prio-idle
    mem_limit: 1g
    memswap_limit: 1536m
    oom_score_adj: *oom-score-deprioritize

  # MCP gateway: one endpoint that federates tool servers, with the UI to add
  # them behind an Authelia login. LLM traffic is litellm's job, not this one's.
  agentgateway:
    <<: *service-defaults
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    container_name: pi-agentgateway
    profiles: ["agentgateway", "all"]
    # The image runs as 65532, which cannot write a data directory the project
    # owner must stay able to read; 1000 is what every PUID here assumes.
    user: "1000:1000"
    networks:
      - frontend
      - ai
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 4000
    command: ["-f", "/config.yaml"]
    environment:
      # Expanded by agentgateway inside /config.yaml, not by Compose.
      - HOST_NAME=${HOST_NAME:-pi.lan}
    env_file:
      # OIDC_COOKIE_SECRET and UI_CLIENT_SECRET, written by
      # scripts/agentgateway-pre-start.sh. Frozen at container creation, so a
      # rotated secret needs `up -d`, not `restart`.
      - path: ./config/agentgateway/agentgateway.env
        required: false
    volumes:
      - ./config/agentgateway/config.yaml:/config.yaml:ro
      - ${DATA_LOCATION:-./data}/agentgateway:/data
    depends_on:
      # Both healthy: it fetches the OIDC discovery document at startup and
      # exits when that fails, and the issuer resolves through Traefik.
      authelia:
        condition: service_healthy
      traefik:
        condition: service_healthy
    # No healthcheck: the image is distroless, so there is no shell and no HTTP
    # client to probe with. Uptime Kuma watches the container instead.
    labels:
      - "homepage.group=AI"
      - "homepage.name=Agentgateway"
      - "homepage.href=https://agent.${HOST_NAME:-pi.lan}/ui"
      - "homepage.description=MCP gateway"
      - "homepage.icon=agentgateway.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.agentgateway.rule=Host(`agent.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.agentgateway.entrypoints=websecure"
      # No authelia@docker: the gateway runs its own OIDC authorization-code
      # flow against the same Authelia, and a forward-auth in front of it would
      # intercept the /oauth/callback that flow returns to.
      - "traefik.http.routers.agentgateway.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.agentgateway.tls=true"
      - "traefik.http.services.agentgateway.loadbalancer.server.port=4000"
    cpu_shares: *cpu-prio-idle
    mem_limit: 256m
    oom_score_adj: *oom-score-deprioritize

  # Database & Cache
  postgres:
    <<: *service-defaults
    restart: always
    container_name: pi-postgres
    # Postgres 18. The data directory moved with the major: from 18 the upstream
    # image keeps PGDATA at /var/lib/postgresql/<major>/docker and refuses to
    # start with anything mounted at /var/lib/postgresql/data, so the mount is
    # the parent and the host path carries the major. That also leaves the
    # Postgres 16 cluster at ${DATA_LOCATION}/postgres intact as the rollback —
    # which also needs `docker compose build backrest`, since its pinned
    # pgNN-client moved with this line and a newer client's dumps do not replay
    # into an older server (config/backrest/Dockerfile).
    # Migrate with scripts/pg-major-upgrade.sh, never by editing these two lines
    # alone: 18 cannot read a 16 data directory.
    # pgvecto.rs is gone from the 18 images; nothing here used it (the immich
    # database only ever created vchord and earthdistance).
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.5@sha256:6e384bf4aa03866473395961786f40006555e4cd008b98f92bf4a44e5ab7b012
    environment:
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_LOCATION:-./data}/postgres18:/var/lib/postgresql
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    networks:
      - immich
      - nextcloud
      - auth
      - ai
      - vault
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      start_interval: 3s
    mem_limit: 1536m
    mem_reservation: 768m
    # 256 MB of swap, not the 1536 MB Docker would grant by default: 535 MB of
    # this limit is shared_buffers, and shmem is swappable but not reclaimable,
    # so a paged-out buffer cache is a database that thinks it is reading RAM.
    memswap_limit: 1792m
    # No cpuset on purpose. "1-3" put the database on exactly the three cores
    # llama-cpp and parakeet saturate, and left it the one core it could not
    # use. Everything that queries it waits on it, so it floats over all four
    # and wins on cpu_shares instead - which the AI services cannot do to it,
    # being pinned away from core 0.
    cpu_shares: *cpu-prio-critical
    shm_size: 256mb
    oom_score_adj: *oom-score-critical

  redis:
    <<: *service-defaults
    restart: always
    container_name: pi-redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      <<: *healthcheck-fast
      # Matched on the reply, because `redis-cli ping` exits 0 while printing
      # `NOAUTH Authentication required` - so the probe this replaces would have
      # reported healthy on a cache every client was being rejected by.
      test: ["CMD-SHELL", "REDISCLI_AUTH=$(cat /run/secrets/redis_password) valkey-cli ping | grep -q PONG"]
      start_period: 5s
      start_interval: 3s
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./config/redis/valkey.conf:/etc/valkey/valkey.conf:ro
      - ${DATA_LOCATION:-./data}/redis/redis-auth.conf:/run/secrets/redis-auth.conf:ro
      # The same secret again, bare, because the healthcheck above cannot parse
      # a config directive.
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/redis_password:/run/secrets/redis_password:ro
      - redis_data:/data
    networks:
      - immich
      - nextcloud
      - auth
    cpu_shares: *cpu-prio-critical
    # Shared by Immich, Nextcloud and Authelia. Peak dataset has been seen at
    # ~44M; the limit must also cover the BGSAVE fork's copy-on-write pages, so
    # keep it well above config/redis/valkey.conf's maxmemory (192mb).
    mem_limit: 256m
    mem_reservation: 64m
    oom_score_adj: *oom-score-critical

volumes:
  # Seeded by scripts/llama-cpp-pre-start.sh. A volume rather than a
  # DATA_LOCATION bind mount so the mmap'd weights sit on the NVMe, not the USB.
  llama_models:
  open_webui_data:
  ddns_data:
  stremio_data:
  comet_data:
  kavita_config:
  beszel_data:
  beszel_agent_data:
  beszel_socket:
  dockhand_data:
  pihole_data:
  n8n_data:
  ntfy_cache:
  ntfy_data:
  immich_model_cache:
  nextcloud_html:
  headscale_data:
  headplane_data:
  tailscale_state:
  redis_data:

networks:
  dns_internal:
    driver: bridge
    name: dns_internal
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.53.0/24
          gateway: 172.30.53.1
  # Three single-member segments rather than one shared "dns_egress", which only
  # bought its members reachability to each other: immich's model downloader
  # could open unbound:5335, for no functional reason. A bridge is the only way
  # to give a container egress, so one member is the right size, not waste.
  #
  # Pinned outside 172.30.0.0/16 on purpose: these have unrestricted egress and
  # no peer, and an address inside ALLOW_IP_RANGES is a hairpin route to every
  # LAN-only service. Pinning also keeps them off the daemon pool, so this file
  # works on a host whose daemon.json was never updated.
  egress_unbound:
    driver: bridge
    name: egress_unbound
    ipam:
      config:
        - subnet: 172.31.240.0/24
  egress_immich:
    driver: bridge
    name: egress_immich
    ipam:
      config:
        - subnet: 172.31.241.0/24
  # ddns-updater had no `networks:` key at all, which put it on the implicit
  # <project>_default: invisible here, holding a zone-scoped Cloudflare token.
  #
  # The one egress network with IPv6: ddns-updater discovers the address it
  # publishes by asking an echo service, and the ULA is masqueraded to the
  # host's global address - the one inbound traffic arrives on.
  egress_ddns:
    driver: bridge
    name: egress_ddns
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.31.242.0/24
        - subnet: fd00:31:242::/64
  frontend:
    driver: bridge
    name: frontend
    ipam:
      driver: default
      config:
        - subnet: 172.30.11.0/24
          gateway: 172.30.11.1
  lan:
    driver: macvlan
    name: lan
    driver_opts:
      parent: ${HOST_LAN_PARENT:-eth0}
    ipam:
      driver: default
      config:
        - subnet: ${HOST_LAN_SUBNET:-192.168.1.0/24}
          gateway: ${HOST_LAN_GATEWAY:-192.168.1.1}
  nextcloud:
    driver: bridge
    name: nextcloud
    internal: true
  immich:
    driver: bridge
    name: immich
    internal: true
  ntfy:
    driver: bridge
    name: ntfy
    internal: true
  auth:
    driver: bridge
    name: auth
    internal: true
  # Not internal: Code nodes run here, and helpers.httpRequest inside one is a
  # documented way to reach the internet.
  n8n_runners:
    driver: bridge
    name: n8n_runners
  ai:
    driver: bridge
    name: ai
    internal: true
  # A dedicated segment rather than reusing "auth" so the vault has no path to
  # lldap, matching the split already used for immich, nextcloud and ai.
  vault:
    driver: bridge
    name: vault
    internal: true
  # Same idea for backrest, whose API returns the restic key and the S3 keys to any
  # authenticated caller: on frontend that port was open to ~24 containers, here to
  # two. Not `internal` - unlike the segments above, restic has to reach S3 through it.
  backup:
    driver: bridge
    name: backup
    # Traefik publishes :80/:443 from whichever of its networks Docker picks, so
    # this subnet must sit inside ALLOW_IP_RANGES. Left to Docker it lands on
    # 172.31.0.0/16 and every host-originated request gets a bare 403 from lan@docker.
    ipam:
      config:
        - subnet: 172.30.12.0/24
  # Same split as `backup`, for the two services worth taking out of a
  # ~20-container broadcast domain first: dockhand mounts the Docker socket,
  # vaultwarden is the vault. Neither has an east-west consumer - Uptime Kuma
  # watches both over docker.sock, not HTTP - so Traefik is the only other member.
  # Subnets pinned inside 172.30.0.0/16, the only range in ALLOW_IP_RANGES, for
  # the hairpinned requests these carry back to Traefik.
  dockhand:
    driver: bridge
    name: dockhand
    ipam:
      config:
        - subnet: 172.30.13.0/24
  vaultwarden_web:
    driver: bridge
    name: vaultwarden_web
    ipam:
      config:
        - subnet: 172.30.14.0/24
  # Traefik alone, so it holds the stack's only IPv6 address and nothing else is
  # reachable over IPv6 however wide the router's firewall is opened. A v6 subnet
  # on `frontend` instead would hand one to gluetun - whose namespace
  # qbittorrent, stremio and kapowarr share - and their traffic would leave
  # outside the tunnel, on the residential address.
  #
  # The /24 is pinned inside 172.30.0.0/16 because Docker may pick this network
  # for the IPv4 publishes too - measured - and a host-originated request would
  # then reach Traefik from a gateway outside the allowlist: `backup`'s trap.
  ingress6:
    driver: bridge
    name: ingress6
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.15.0/24
        - subnet: fd00:30:15::/64
