x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

# CPU priority, not capacity. cpu_shares lands on cgroup v2 cpu.weight and is
# only arbitrated when the cores are actually contended, so a tier costs
# nothing on an idle box - 1024 is the kernel default, mapping to weight 100.
# It replaces `deploy: resources: reservations: cpus:`, which compose silently
# drops outside swarm: every container ran at the default weight regardless of
# the tier it named. The order is by *who waits on whom*, not by appetite - the
# model services want the most CPU and get the least, because a DNS answer or a
# healthcheck blocked behind an inference is what actually breaks the stack.
x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

# Lower = less likely to be OOM-killed. Range -1000 (never) to +1000 (first).
x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

# Three memory keys, none of which does the other's job, and only the first is
# a plain ceiling. See docs/ARCHITECTURE.md#rationing-cpu-and-memory.
#
#   mem_limit       cgroup v2 memory.max. Counts page cache and shmem as well
#                   as anonymous pages, so squeezing an I/O-heavy service buys
#                   re-reads, not RAM.
#   mem_reservation memory.low. The only key that means "do not page this
#                   out". On the latency-critical set only: the protection is
#                   proportional, so reserving everywhere protects nothing.
#   memswap_limit   memory *plus* swap, so the swap ceiling is the difference.
#                   Only on the services that measurably swap - unset, Docker
#                   grants every container a swap allowance equal to its
#                   mem_limit, and one idle model server took the whole file.

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s

x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s

x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s

x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

# Stremio runs in one of two mutually exclusive modes (see docs/NETWORKING.md).
# `network_mode` and `networks` cannot coexist and a merge key cannot remove a
# key, so each mode is its own thin service over this shared body.
x-stremio-common: &stremio-common
  <<: *service-defaults
  image: stremio/server:v4.21.1
  environment:
    - NO_CORS=1
    - TZ=${TIMEZONE:-Europe/Paris}
    # The image installs jellyfin-ffmpeg but ships these empty, and its install
    # path is not on PATH, so the server finds no binary and cannot remux at all.
    - FFMPEG_BIN=/usr/lib/jellyfin-ffmpeg/ffmpeg
    - FFPROBE_BIN=/usr/lib/jellyfin-ffmpeg/ffprobe
    # Only its truthiness is read, so "0" would still disable casting: it must
    # be empty. Left at the image's default, /casting answers 404 to every client.
    - CASTING_DISABLED=
  volumes:
    - stremio_data:/root/.stremio-server
  healthcheck:
    <<: *healthcheck-default
    test: ["CMD", "curl", "-f", "http://localhost:11470/"]
    start_period: 30s
  cpu_shares: *cpu-prio-normal
  mem_limit: 1024m
  oom_score_adj: *oom-score-deprioritize

services:
  ddns-updater:
    <<: *service-defaults
    image: ghcr.io/qdm12/ddns-updater:v2.10.0
    container_name: pi-ddns-updater
    networks:
      - egress_ddns
    environment:
      # It looks a name up *before* writing it, so the first AAAA publication
      # seeds a NODATA into the router's negative cache and the healthcheck then
      # reports a mismatch on a record that is correct.
      RESOLVER_ADDRESS: 1.1.1.1:53
      # ip_version on every entry: the default is "ipv4 or ipv6", i.e. whichever
      # the lookup returns first, so an unpinned entry *replaces* the A record
      # with an AAAA instead of adding one. One entry carries one family.
      # `:+` so an empty switch adds nothing rather than a comma, which would
      # make CONFIG invalid JSON.
      CONFIG: >-
        {"settings":[ {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false,"ip_version":"ipv4"}, {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"*.${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false,"ip_version":"ipv4"}${IPV6_PUBLIC_RECORDS:+, {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false,"ip_version":"ipv6"}, {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"*.${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false,"ip_version":"ipv6"}} ]}
    volumes:
      - ddns_data:/updater/data
    cpu_shares: *cpu-prio-normal
    mem_limit: 64m
    oom_score_adj: *oom-score-critical

  backrest:
    <<: *service-defaults
    build:
      context: ./config/backrest
      dockerfile: Dockerfile
    image: pi-backrest:local
    container_name: pi-backrest
    networks:
      # Not frontend: its API is as valuable as the backups (see BACKREST_AUTH_USER
      # below), and frontend carries ~24 other containers, any one of which could
      # open :9898. `backup` is a dedicated segment joined only by traefik (to route
      # backrest.$HOST_NAME) and homepage (for its widget) - the same split already
      # used for vault, immich, nextcloud and ai. It is the only non-internal network
      # backrest has left, so it is also what carries restic's egress to S3.
      - backup
      - immich
      - ntfy
      - nextcloud
      - auth
    expose:
      - 9898
    environment:
      - BACKREST_PORT=0.0.0.0:9898
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/backrest/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=${TIMEZONE:-Europe/Paris}
      - HOST_NAME=${HOST_NAME:-pi.lan}
      - DB_HOST=postgres
      - DB_NAME=nextcloud
      - DB_USER=nextcloud
      - DB_PASSWORD=${PASSWORD}
      - NEXTCLOUD_CONFIG_FILE=/userdata/nextcloud-config/config.php
      - NEXTCLOUD_SQL_BACKUP_DIR=/userdata/nextcloud-config/backups
      - NEXTCLOUD_SQL_BACKUP_KEEP=${NEXTCLOUD_SQL_BACKUP_KEEP:-30}
      - NEXTCLOUD_HOOK_STATE_FILE=/tmp/nextcloud-maintenance.state
      - AUTHELIA_DB_NAME=authelia
      - AUTHELIA_DB_USER=authelia
      - AUTHELIA_DB_PASSWORD=${PASSWORD}
      - AUTHELIA_SQL_BACKUP_DIR=/userdata/authelia-config/backups
      - AUTHELIA_SQL_BACKUP_KEEP=7
      - LLDAP_DB_NAME=lldap
      - LLDAP_DB_USER=lldap
      - LLDAP_DB_PASSWORD=${PASSWORD}
      - LLDAP_SQL_BACKUP_DIR=/userdata/lldap/backups
      - LLDAP_SQL_BACKUP_KEEP=7
      - OPEN_WEBUI_DB_NAME=open-webui
      - OPEN_WEBUI_DB_USER=open-webui
      - OPEN_WEBUI_DB_PASSWORD=${PASSWORD}
      - OPEN_WEBUI_SQL_BACKUP_DIR=/userdata/open-webui/backups
      - OPEN_WEBUI_SQL_BACKUP_KEEP=7
      - LITELLM_DB_NAME=litellm
      - LITELLM_DB_USER=litellm
      - LITELLM_DB_PASSWORD=${PASSWORD}
      - LITELLM_SQL_BACKUP_DIR=/userdata/litellm/backups
      - LITELLM_SQL_BACKUP_KEEP=7
      - IMMICH_DB_NAME=immich
      - IMMICH_DB_USER=immich
      - IMMICH_DB_PASSWORD=${PASSWORD}
      - IMMICH_SQL_BACKUP_DIR=/userdata/immich/backups
      - IMMICH_SQL_BACKUP_KEEP=7
      - VAULTWARDEN_DB_NAME=vaultwarden
      - VAULTWARDEN_DB_USER=vaultwarden
      - VAULTWARDEN_DB_PASSWORD=${PASSWORD}
      - VAULTWARDEN_SQL_BACKUP_DIR=/userdata/vaultwarden/backups
      - VAULTWARDEN_SQL_BACKUP_KEEP=7
      - RESTIC_PACK_SIZE=32
      - GOMEMLIMIT=1200MiB
      # Backrest's API serves the repo password and S3 keys to anyone who can reach
      # :9898 and authenticate. The image entrypoint turns this user and the password
      # from backrest.env into the bcrypt entry in config.json.
      - BACKREST_AUTH_USER=${ADMIN_USER:-admin}
      # Reached directly on the internal ntfy network instead of the old
      # `ntfy.$HOST_NAME` -> 172.30.11.1 hop, which was the *frontend bridge gateway*
      # (i.e. the host) and then back in through Traefik - a route that no longer
      # exists now that backrest is off frontend. ntfy's own user/password auth is
      # unchanged; what is lost is TLS across a three-member internal bridge.
      - NTFY_BASE_URL=http://pi-ntfy
    env_file:
      - path: ./config/ntfy/ntfy.env
        required: false
      # BACKREST_AUTH_PASSWORD, generated by scripts/backrest-pre-start.sh. Kept out
      # of `environment:` above, where it would shadow this file (Compose lets
      # `environment:` win). Frozen at container creation - rotate with `up -d`.
      - path: ./config/backrest/backrest.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/backrest/data:/data
      - ./config/backrest:/config/backrest
      - ${DATA_LOCATION:-./data}/backrest/repos:/repos
      - ${DATA_LOCATION:-./data}/immich:/userdata/immich:ro
      # Writable so the db-backup.sh hook can drop its pg_dump here. Also the
      # only immich DB backup: the immich role is not a superuser, so Immich's
      # built-in pg_dumpall job cannot run (disabled in config/immich/config.yaml).
      - ${DATA_LOCATION:-./data}/immich/backups:/userdata/immich/backups
      - ${DATA_LOCATION:-./data}/nextcloud:/userdata/nextcloud-data:ro
      - ${DATA_LOCATION:-./data}/nextcloud-config:/userdata/nextcloud-config
      - ${DATA_LOCATION:-./data}/nextcloud-themes:/userdata/nextcloud-themes:ro
      - ${DATA_LOCATION:-./data}/uptime-kuma:/userdata/uptime-kuma:ro
      - beszel_data:/userdata/beszel:ro
      - ${DATA_LOCATION:-./data}/lldap:/userdata/lldap:ro
      - ${DATA_LOCATION:-./data}/vaultwarden:/userdata/vaultwarden:ro
      # Writable so the db-backup.sh hook can drop its pg_dump here, like lldap's.
      - ${DATA_LOCATION:-./data}/vaultwarden/backups:/userdata/vaultwarden/backups
      - ${DATA_LOCATION:-./data}/lldap/backups:/userdata/lldap/backups
      - ${DATA_LOCATION:-./data}/authelia-config:/userdata/authelia-config
      - ${DATA_LOCATION:-./data}/open-webui/backups:/userdata/open-webui/backups
      # The salt key rides along: without it the credentials in the dump below
      # cannot be decrypted. Read-only parent, writable backups child, as above.
      - ${DATA_LOCATION:-./data}/litellm:/userdata/litellm:ro
      - ${DATA_LOCATION:-./data}/litellm/backups:/userdata/litellm/backups
      # The only copy of the MCP targets added through its UI.
      - ${DATA_LOCATION:-./data}/agentgateway:/userdata/agentgateway:ro
      # Open WebUI's uploads and vector store; without this a DB restore points
      # at blobs that were never snapshotted.
      - open_webui_data:/userdata/open-webui-data:ro
      # Small, high-value state that nothing else can regenerate: tailnet node
      # keys and ACLs, n8n workflow credentials, ntfy topic ACLs, ACME certs,
      # and the *arr configs that carry their API keys. Under 100 MB together.
      - headscale_data:/userdata/headscale:ro
      - headplane_data:/userdata/headplane:ro
      - n8n_data:/userdata/n8n:ro
      - ntfy_data:/userdata/ntfy:ro
      - kavita_config:/userdata/kavita:ro
      - pihole_data:/userdata/pihole:ro
      - ${DATA_LOCATION:-./data}/traefik/letsencrypt:/userdata/traefik-letsencrypt:ro
      - ${DATA_LOCATION:-./data}/qbittorrent:/userdata/qbittorrent:ro
      - ${DATA_LOCATION:-./data}/prowlarr:/userdata/prowlarr:ro
      - ${DATA_LOCATION:-./data}/kapowarr/db:/userdata/kapowarr-db:ro
      - ${DATA_LOCATION:-./data}/shelfmark:/userdata/shelfmark:ro
      # Only /config: the SQLite database, the server settings and the OIDC
      # client live there. /metadata is covers and cached art, rebuilt by a scan.
      - ${DATA_LOCATION:-./data}/audiobookshelf/config:/userdata/audiobookshelf:ro
      # Read by backrest-env-snapshot.sh, which feeds two plans: s3-backup
      # (off-site, but opening that repo needs BACKREST_S3_REPO_PASSWORD, which
      # is inside the .env it stores) and usb-env, a local repo under
      # /repos/env whose password sits next to it on the data disk so this file
      # can be restored from that disk alone. See docs/MONITORING.md.
      #
      # The project directory, not ./.env directly: a single-file bind mount
      # pins the inode, and every writer here (services.sh, rotate-password.sh,
      # any editor) replaces .env instead of rewriting it, so the container
      # would keep snapshotting the pre-edit file. backrest-env-snapshot.sh
      # reads it by name at snapshot time and drops a copy in the second mount,
      # which is the one that gets backed up. /pi-web-src is outside /userdata,
      # so the repo itself is not in the snapshot.
      - ./:/pi-web-src:ro
      - ${DATA_LOCATION:-./data}/backrest/env-snapshot:/userdata/pi-web-env
      # Where sqlite-backup.sh writes its consistent copies of the live SQLite
      # databases above, which are all mounted read-only. Writable, and inside
      # /userdata so the snapshot picks it up.
      - ${DATA_LOCATION:-./data}/backrest/sqlite:/userdata/sqlite-backups
      - ./scripts/db-backup.sh:/hooks/db-backup.sh:ro
      - ./scripts/sqlite-backup.sh:/hooks/sqlite-backup.sh:ro
      - ./scripts/backrest-env-snapshot.sh:/hooks/backrest-env-snapshot.sh:ro
      - ./scripts/backrest-post-hook.sh:/hooks/backrest-post-hook.sh:ro
      - ./scripts/backrest-unlock.sh:/hooks/backrest-unlock.sh:ro
    tmpfs:
      - /cache
      - /tmp
    depends_on:
      immich-server:
        condition: service_healthy
        required: false
      nextcloud:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
      authelia:
        condition: service_healthy
    labels:
      - "homepage.group=Backup & Recovery"
      - "homepage.name=Backrest"
      - "homepage.icon=backrest.png"
      - "homepage.href=https://backrest.${HOST_NAME:-pi.lan}"
      - "homepage.description=Backup management"
      - "homepage.widget.type=backrest"
      - "homepage.widget.url=http://pi-backrest:9898"
      - "homepage.widget.username={{HOMEPAGE_VAR_ADMIN_USER}}"
      - "homepage.widget.password={{HOMEPAGE_FILE_BACKREST_PASSWORD}}"
      - "traefik.enable=true"
      # Overrides --providers.docker.network=frontend: backrest is not there any more.
      - "traefik.docker.network=backup"
      - "traefik.http.routers.backrest.rule=Host(`backrest.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.backrest.tls=true"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-fsS", "http://localhost:9898/"]
      start_period: 45s
    cpu_shares: *cpu-prio-batch
    mem_limit: 1536m
    memswap_limit: 2g
    oom_score_adj: *oom-score-important

  traefik:
    <<: *service-defaults
    image: traefik:v3.7.13
    container_name: pi-traefik
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN:-}
    command:
      - "--log.level=INFO"
      # Without this, an ipallowlist rejection is invisible: it never reaches the
      # backend's own log, so a bare 403 has no recorded client address to blame.
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--entrypoints.web.address=:80/tcp"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443/tcp"
      # autodetect must stay last, so it wraps the router middlewares whose own
      # responses need it: Traefik v3 no longer fills a missing Content-Type, and
      # the ipallowlist 403 sets none - nosniff then leaves the browser nothing to
      # render, so the denial downloads as a file.
      - "--entrypoints.websecure.http.middlewares=compress@docker,security-headers@docker,autodetect@docker"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
      - "--entrypoints.websecure.http3=true"
      # No forwardedHeaders.trustedIPs on purpose: nothing proxies in front of
      # Traefik, so every X-Forwarded-* here is client-supplied. Trusting them
      # lets a client forge X-Forwarded-Host and pick which rule Authelia applies.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0"
      - "--providers.docker=true"
      - "--providers.docker.watch=true"
      - "--providers.docker.network=frontend"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.cloudflare.acme.email=${EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=10"
    labels:
      - "homepage.group=Network"
      - "homepage.name=Traefik"
      - "homepage.icon=traefik.png"
      - "homepage.href=https://traefik.${HOST_NAME:-pi.lan}"
      - "homepage.description=Reverse proxy"
      - "homepage.widget.type=traefik"
      # The address, not the name: traefik is on frontend and backup, and Docker's
      # DNS answers pi-traefik with the backup one, which internalapi-allow denies.
      - "homepage.widget.url=http://172.30.11.250:8080"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.middlewares.autodetect.contenttype=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=same-origin"
      # Deliberately NOT in security-headers: that one is applied at the websecure
      # entrypoint, which wraps every router's own middlewares, so nothing downstream
      # can opt out of it. Vaultwarden needs to (see its labels), so the frame policy
      # lives here and is attached per router instead.
      - "traefik.http.middlewares.frame-deny.headers.frameDeny=true"
      # HOST_LAN_SUBNET6 and WAN_HAIRPIN_IP are appended rather than merged into
      # ALLOW_IP_RANGES: they expire with what the ISP hands out, and
      # wan-allowlist-sync.sh owns both. `:+` so an empty value adds nothing
      # rather than a trailing comma, which Traefik rejects as an invalid CIDR -
      # taking every router referencing the middleware offline with it.
      - "traefik.http.middlewares.lan.ipallowlist.sourcerange=${ALLOW_IP_RANGES:-127.0.0.1/32,192.168.1.0/24,100.64.0.0/10,172.30.0.0/16,::1/128,fd7a:115c:a1e0::/48}${HOST_LAN_SUBNET6:+,${HOST_LAN_SUBNET6}}${WAN_HAIRPIN_IP:+,${WAN_HAIRPIN_IP}}"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.average=10"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.burst=20"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.period=1s"
      - "traefik.http.routers.traefik.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.domains[0].main=${HOST_NAME:-pi.lan}"
      - "traefik.http.routers.traefik.tls.domains[0].sans=*.${HOST_NAME:-pi.lan}"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      # Traefik's implicit :8080 "traefik" entrypoint, so Homepage can read the
      # API from inside frontend without the Authelia-protected dashboard router.
      - "traefik.http.routers.internalapi.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.internalapi.entrypoints=traefik"
      - "traefik.http.routers.internalapi.service=api@internal"
      # api@internal is unauthenticated and /api/rawdata is the full router map,
      # public-bypass rules included. Homepage's widget is the only consumer.
      - "traefik.http.middlewares.internalapi-allow.ipallowlist.sourcerange=172.30.11.240/32"
      - "traefik.http.routers.internalapi.middlewares=internalapi-allow@docker"
    ports:
      # Both families spelled out, never a bare port. An IPv6 listener is only
      # safe once the container has an IPv6 address to DNAT to - without one,
      # docker-proxy rewrites the source to a Docker gateway address, inside
      # ALLOW_IP_RANGES. That is what `ingress6` is for. docs/NETWORKING.md#ipv6.
      - "0.0.0.0:80:80"
      - "[::]:80:80"
      - "0.0.0.0:443:443"
      - "[::]:443:443"
      # http3=true advertises Alt-Svc, which browsers cache for ~30 days; without
      # this listener they retry QUIC and time out. Also needs a router forward.
      - "0.0.0.0:443:443/udp"
      - "[::]:443:443/udp"
    expose:
      - 8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_LOCATION:-./data}/traefik/letsencrypt:/letsencrypt
    networks:
      frontend:
        ipv4_address: 172.30.11.250
      # Only so backrest.$HOST_NAME can still be routed after backrest left
      # frontend. Nothing else lives on this segment except homepage.
      backup: {}
      # Same again for dockhand and vaultwarden. Static .250 as on frontend, so
      # vaultwarden's extra_hosts can name Traefik by address.
      dockhand:
        ipv4_address: 172.30.13.250
      vaultwarden_web:
        ipv4_address: 172.30.14.250
      # The DNAT target for the [::] ports above, and necessarily so: Docker
      # programs DNAT per address family, and this is the only endpoint with an
      # IPv6 address. Which network serves the *v4* publishes is an unpinned
      # tie-break, harmless because every candidate sits in 172.30.0.0/16.
      ingress6:
        ipv4_address: 172.30.15.250
        ipv6_address: fd00:30:15::250
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      start_interval: 5s
    cpuset: "0"
    cpu_shares: *cpu-prio-critical
    mem_limit: 192m
    mem_reservation: 96m
    oom_score_adj: *oom-score-critical

  beszel:
    <<: *service-defaults
    image: henrygd/beszel:0.19.0
    container_name: pi-beszel
    profiles: ["beszel", "beszel-agent", "all"]
    networks:
      - frontend
    expose:
      - 8090
    environment:
