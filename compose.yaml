    container_name: pi-headplane
    profiles: ["headplane", "all"]
    networks:
      - frontend
    extra_hosts:
      - "headscale.${HOST_NAME:-pi.lan}:172.30.11.1"
    expose:
      - 3000
    volumes:
      - ./config/headplane/config.yaml:/etc/headplane/config.yaml:ro
      - ./config/headscale:/etc/headscale:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_headplane_secret.txt:/run/secrets/oidc_headplane_secret:ro
      - ./config/headplane/headscale_api_key:/run/secrets/headplane_headscale_api_key:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - headplane_data:/var/lib/headplane
      - ./config/headplane/wasm/wasm_exec.js:/app/build/client/wasm_exec.js:ro
      - ./config/headplane/wasm/hp_ssh.wasm:/app/build/client/hp_ssh.wasm:ro
    environment:
      - NODE_OPTIONS=--max-old-space-size=160
      - HEADPLANE_HEADSCALE__URL=https://headscale.${HOST_NAME:-pi.lan}
      - HEADPLANE_OIDC__ISSUER=https://auth.${HOST_NAME:-pi.lan}
      - HEADPLANE_OIDC__CLIENT_ID=headplane
      - HEADPLANE_OIDC__CLIENT_SECRET_PATH=/run/secrets/oidc_headplane_secret
      - HEADPLANE_OIDC__TOKEN_ENDPOINT_AUTH_METHOD=client_secret_basic
      - HEADPLANE_OIDC__DISABLE_API_KEY_LOGIN=true
      - HEADPLANE_OIDC__HEADSCALE_API_KEY_PATH=/run/secrets/headplane_headscale_api_key
      - HEADPLANE_OIDC__SCOPE=openid email profile
    depends_on:
