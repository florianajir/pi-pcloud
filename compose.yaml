      - "traefik.docker.network=frontend"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    environment:
      - N8N_HOST=n8n.${HOST_NAME:-pi.lan}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${HOST_NAME:-pi.lan}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-${TIMEZONE:-Europe/Paris}}
      - TZ=${TIMEZONE:-Europe/Paris}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      - DB_TYPE=sqlite
      - DB_SQLITE_POOL_SIZE=2
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=${SMTP_HOST:-localhost}
      - N8N_SMTP_PORT=${SMTP_PORT:-587}
      - N8N_SMTP_USER=${SMTP_USERNAME:-}
      - N8N_SMTP_PASS=${SMTP_PASSWORD:-}
      - N8N_SMTP_SENDER=${EMAIL:-noreply@localhost}
      - N8N_SMTP_SSL=${SMTP_SSL:-false}
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=512
    # N8N_RUNNERS_AUTH_TOKEN, generated by scripts/n8n-pre-start.sh. The broker
    # listens on 0.0.0.0 inside `frontend`, so this gates ~25 containers out of
    # registering as a task runner - it must never fall back to a default.
    env_file:
      - path: ./config/n8n/n8n.env
        required: false
    volumes:
      - n8n_data:/home/node/.n8n
      - ${DATA_LOCATION:-./data}/n8n:/files
    networks:
      - frontend
      - n8n_runners
    depends_on:
      - traefik
    healthcheck:
      <<: *healthcheck-default
      # Explicit IPv4 loopback: localhost resolves to ::1 here and the dial fails.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
    cpu_shares: *cpu-prio-normal
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  n8n-runners:
    <<: *service-defaults
    image: n8nio/runners:2.38.1
    container_name: pi-n8n-runners
    profiles: ["n8n-runners", "all"]
    labels:
      - "homepage.description=Sandboxed task runner for n8n"
      - "pi-pcloud.companion-of=n8n"
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
