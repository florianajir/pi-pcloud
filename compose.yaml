# The project root. It declares no service: they live by domain in compose/ and
# `include:` merges them. Kept here rather than pushed down:
#   - the x- anchors: YAML anchors are file-scoped, so every compose/*.yaml
#     carries a copy of these; tests/compose-invariants.py fails on drift.
#   - volumes and networks: one namespace for every domain.
#
# `project_directory: .` on every include is load-bearing: without it the
# included file's ./config and ./data binds resolve against compose/.
# `env_file: /dev/null` stops an include from re-reading .env on its own, behind
# --env-file's back (compose-go defaults it); interpolation still sees .env
# through the CLI.
#
# The compose- filename prefix is for Dependabot, which only opens basenames
# matching (docker-)compose(-*).yaml and follows neither `include:` nor
# subdirectories - a core.yaml would silently get no image bumps.

x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

# cpu_shares tiers, ordered by who waits on whom rather than by appetite:
# docs/ARCHITECTURE.md#cpu.
x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

# Lower = less likely to be OOM-killed. Range -1000 (never) to +1000 (first).
x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

# mem_limit, mem_reservation and memswap_limit each do a different job:
# docs/ARCHITECTURE.md#memory.

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s

x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s

x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s

x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

include:
  - path: ./compose/compose-core.yaml
    project_directory: .
    env_file: /dev/null
  - path: ./compose/compose-identity.yaml
    project_directory: .
    env_file: /dev/null
  - path: ./compose/compose-network.yaml
    project_directory: .
    env_file: /dev/null
  - path: ./compose/compose-cloud.yaml
    project_directory: .
    env_file: /dev/null
  - path: ./compose/compose-media.yaml
    project_directory: .
    env_file: /dev/null
  - path: ./compose/compose-knowledge.yaml
    project_directory: .
    env_file: /dev/null
  - path: ./compose/compose-ai.yaml
    project_directory: .
    env_file: /dev/null
  - path: ./compose/compose-monitoring.yaml
    project_directory: .
    env_file: /dev/null

volumes:
  # A volume rather than a DATA_LOCATION bind, so the mmap'd weights are not on
  # a USB media disk. Seeded by scripts/llama-cpp-pre-start.sh.
  llama_models:
  open_webui_data:
  ddns_data:
  stremio_data:
  aiostreams_data:
  aiometadata_data:
  stremthru_data:
  kavita_config:
  beszel_data:
  beszel_agent_data:
  dockhand_data:
  pihole_data:
  n8n_data:
  ntfy_cache:
  ntfy_data:
  immich_model_cache:
  nextcloud_html:
  headscale_data:
  headplane_data:
  tailscale_state:
  redis_data:
  # The image's own `VOLUME`s, named so a recreate does not strand an anonymous
  # one.
  searxng_config:
  searxng_cache:
  # Not backed up: regenerable, and Grafana's content is provisioned from
  # config/.
  prometheus_data:
  grafana_data:
  # Volumes rather than DATA_LOCATION binds: a USB bridge that acknowledges
  # fsync early turns a power cut into a corrupt RocksDB. Backrest takes media
  # and backups, never the live database.
  tuwunel_data:
  tuwunel_media:
  tuwunel_backups:
  # Same reason: SQLite sessions and the Matrix crypto snapshot, which an
  # unclean shutdown corrupts (openclaw issue #158784).
  openclaw_state:

# Members and purpose of every network: docs/NETWORKING.md#network-isolation.
networks:
  dns_internal:
    driver: bridge
    name: dns_internal
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.53.0/24
          gateway: 172.30.53.1
  # One member each: a bridge is the only way to give a container egress, and a
  # shared one let its members reach each other. Pinned outside 172.30.0.0/16 on
  # purpose: with unrestricted egress, an address inside ALLOW_IP_RANGES would
  # be a hairpin route to every LAN-only service.
  egress_unbound:
    driver: bridge
    name: egress_unbound
    ipam:
      config:
        - subnet: 172.31.240.0/24
  egress_immich:
    driver: bridge
    name: egress_immich
    ipam:
      config:
        - subnet: 172.31.241.0/24
  # IPv6 so ddns-updater can observe the public address it publishes as AAAA.
  egress_ddns:
    driver: bridge
    name: egress_ddns
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.31.242.0/24
        - subnet: fd00:31:242::/64
  egress_flaresolverr:
    driver: bridge
    name: egress_flaresolverr
    ipam:
      config:
        - subnet: 172.31.243.0/24
  frontend:
    driver: bridge
    name: frontend
    ipam:
      driver: default
      config:
        - subnet: 172.30.11.0/24
          gateway: 172.30.11.1
  lan:
    driver: macvlan
    name: lan
    driver_opts:
      parent: ${HOST_LAN_PARENT:-eth0}
    ipam:
      driver: default
      config:
        - subnet: ${HOST_LAN_SUBNET:-192.168.1.0/24}
          gateway: ${HOST_LAN_GATEWAY:-192.168.1.1}
  nextcloud:
    driver: bridge
    name: nextcloud
    internal: true
  immich:
    driver: bridge
    name: immich
    internal: true
  ntfy:
    driver: bridge
    name: ntfy
    internal: true
  auth:
    driver: bridge
    name: auth
    internal: true
  # Not internal: a Code node can reach the internet through
  # helpers.httpRequest.
  n8n_runners:
    driver: bridge
    name: n8n_runners
  ai:
    driver: bridge
    name: ai
    internal: true
  # Not `auth`, so the vault has no path to lldap.
  vault:
    driver: bridge
    name: vault
    internal: true
  # forge, rss and aiometadata: one service and its datastore. Each service
  # reaches the internet over frontend.
  forge:
    driver: bridge
    name: forge
    internal: true
  rss:
    driver: bridge
    name: rss
    internal: true
  # FlareSolverr and its two clients: Prowlarr, and Kapowarr through gluetun's
  # namespace. Gluetun's firewall admits every subnet attached to it, so joining
  # is all Kapowarr needs. Pinned outside 172.30.0.0/16 so FlareSolverr's
  # address is not in ALLOW_IP_RANGES, which qBittorrent exempts from its login.
  flaresolverr:
    driver: bridge
    name: flaresolverr
    internal: true
    ipam:
      config:
        - subnet: 172.31.244.0/24
  # Redis only - on `auth`, a media addon would have a route to the directory.
  aiometadata:
    driver: bridge
    name: aiometadata
    internal: true
  # Internal, and OpenClaw is on nothing else but `ai`: the agent has no route
  # to the internet, which is what a prompt injection would exfiltrate through.
  assistant:
    driver: bridge
    name: assistant
    internal: true
  # Off frontend because backrest's API returns the restic and S3 keys to any
  # authenticated caller. Not internal: restic reaches S3 through it.
  backup:
    driver: bridge
    name: backup
    # Pinned inside ALLOW_IP_RANGES: Traefik may serve its publishes from any of
    # its networks, and a gateway outside the allowlist gets a bare 403 from
    # lan@docker. Same for the pinned subnets below.
    ipam:
      config:
        - subnet: 172.30.12.0/24
  # Traefik plus one service each: dockhand mounts the Docker socket, and
  # vaultwarden is the vault. Neither has an east-west consumer.
  dockhand:
    driver: bridge
    name: dockhand
    ipam:
      config:
        - subnet: 172.30.13.0/24
  vaultwarden_web:
    driver: bridge
    name: vaultwarden_web
    ipam:
      config:
        - subnet: 172.30.14.0/24
  # Traefik alone, so it holds the stack's only IPv6 address. A v6 subnet on
  # frontend would give one to gluetun, and the containers in its namespace
  # would leave outside the tunnel.
  ingress6:
    driver: bridge
    name: ingress6
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.15.0/24
        - subnet: fd00:30:15::/64
