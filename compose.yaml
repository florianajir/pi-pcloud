    labels:
      - "homepage.group=Network"
      - "homepage.name=Headplane"
      - "homepage.icon=headscale.png"
      - "homepage.href=https://headscale.${HOST_NAME:-pi.lan}/admin"
      - "homepage.description=Headscale administration"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.headplane.rule=Host(`headscale.${HOST_NAME:-pi.lan}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.headplane.entrypoints=websecure"
      - "traefik.http.routers.headplane.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.headplane.tls=true"
      - "traefik.http.routers.headplane.tls.certresolver=cloudflare"
      - "traefik.http.services.headplane.loadbalancer.server.port=3000"
      - "traefik.http.routers.headplane-wasm.rule=Host(`headscale.${HOST_NAME:-pi.lan}`) && (Path(`/wasm_exec.js`) || Path(`/hp_ssh.wasm`))"
      - "traefik.http.routers.headplane-wasm.entrypoints=websecure"
      - "traefik.http.routers.headplane-wasm.tls=true"
      - "traefik.http.routers.headplane-wasm.tls.certresolver=cloudflare"
      - "traefik.http.routers.headplane-wasm.service=headplane"
      - "traefik.http.routers.headplane-wasm.middlewares=frame-deny@docker,wasm-path@docker"
      - "traefik.http.middlewares.wasm-path.replacepathregex.regex=/(wasm_exec.js|hp_ssh.wasm)"
      - "traefik.http.middlewares.wasm-path.replacepathregex.replacement=/admin/$$1"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "/nodejs/bin/node", "-e", "const net=require('node:net');const s=net.connect({host:'127.0.0.1',port:3000},()=>{s.end();process.exit(0)});s.setTimeout(5000,()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"]
    cpu_shares: *cpu-prio-normal
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  # Network Stack
  headscale:
    <<: *service-defaults
    image: headscale/headscale:v0.29.3
    container_name: pi-headscale
    command: serve
    environment:
      - HEADSCALE_SERVER_URL=https://headscale.${HOST_NAME:-pi.lan}
      - HEADSCALE_LISTEN_ADDR=0.0.0.0:8080
      - HEADSCALE_DNS_BASE_DOMAIN=tailnet.${HOST_NAME:-pi.lan}
    networks:
      - frontend
    extra_hosts:
      # Authelia's OIDC discovery endpoint, reached through Traefik internally.
      # Headscale resolves the provider exactly once, at startup, and
      # only_start_if_oidc_is_available now makes that call fatal - so it must
      # not depend on public DNS answering and the router hairpinning its own
      # WAN address back in.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 8080
      - 9090
      - 50443
    ports:
      # v4-only: headscale has no IPv6 address, so a [::] publish would fall
      # back to docker-proxy and STUN would report a Docker gateway address to
      # its own clients - worse than advertising none. docs/NETWORKING.md#ipv6.
      - "0.0.0.0:3478:3478/udp"
    volumes:
      - ./config/headscale:/etc/headscale:ro
      - headscale_data:/var/lib/headscale
    depends_on:
      authelia:
        condition: service_healthy
    tmpfs:
      - /var/run/headscale
    labels:
      - "homepage.group=Network"
      - "homepage.name=Headscale"
      - "homepage.icon=tailscale.png"
      - "homepage.href=https://headscale.${HOST_NAME:-pi.lan}"
      - "homepage.description=Private Tailnet coordination"
      - "homepage.widget.type=headscale"
      - "homepage.widget.url=http://pi-headscale:8080"
      - "homepage.widget.nodeId={{HOMEPAGE_FILE_HEADSCALE_NODE_ID}}"
      - "homepage.widget.key={{HOMEPAGE_FILE_HEADSCALE_API_KEY}}"
      - "me.tale.headplane.target=headscale"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.headscale.rule=Host(`headscale.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.headscale.entrypoints=websecure"
      - "traefik.http.routers.headscale.tls=true"
      - "traefik.http.routers.headscale.tls.certresolver=cloudflare"
      - "traefik.http.routers.headscale.tls.domains[0].main=${HOST_NAME:-pi.lan}"
      - "traefik.http.routers.headscale.tls.domains[0].sans=*.${HOST_NAME:-pi.lan}"
      - "traefik.http.routers.headscale.middlewares=frame-deny@docker,headscale-cors"
      # A redirect, not an addprefix onto the headscale service (which has no
      # /admin): it hands the browser to Headplane's router, gate included.
      - "traefik.http.routers.headscale-root.rule=Host(`headscale.${HOST_NAME:-pi.lan}`) && Path(`/`)"
      - "traefik.http.routers.headscale-root.entrypoints=websecure"
      - "traefik.http.routers.headscale-root.tls=true"
      - "traefik.http.routers.headscale-root.service=headscale"
      - "traefik.http.routers.headscale-root.middlewares=frame-deny@docker,headscale-root-redirect"
      - "traefik.http.services.headscale.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.headscale-root-redirect.redirectregex.regex=^https?://([^/]+)/$$"
      - "traefik.http.middlewares.headscale-root-redirect.redirectregex.replacement=https://$${1}/admin"
      - "traefik.http.middlewares.headscale-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.headscale-cors.headers.accesscontrolallowmethods=GET,POST,PUT"
      - "traefik.http.middlewares.headscale-cors.headers.accesscontrolalloworiginlist=https://headscale.${HOST_NAME:-pi.lan}"
      - "traefik.http.middlewares.headscale-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.headscale-cors.headers.addvaryheader=true"
    healthcheck:
