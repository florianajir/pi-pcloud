# Overrides only the parts of compose.yaml that cannot work on a CI runner.
# Usage: docker compose -f compose.yaml -f compose.test.yaml up -d

services:
  # --- Services excluded from CI ---
  # These services need special hardware, real credentials, or capabilities that are
  # unavailable on GitHub Actions runners.

  tailscale:
    # Requires /dev/net/tun, SYS_MODULE capability, and real VPN auth.
    profiles: [ci-excluded]

  headplane:
    profiles: [ci-excluded]

  beszel-agent:
    # Depends on Traefik TLS endpoint which is not functional in CI.
    profiles: [ci-excluded]

  gluetun:
    # Requires /dev/net/tun, NET_ADMIN capability, and real VPN credentials.
    profiles: [ci-excluded]

  qbittorrent:
    # Depends on gluetun which is excluded from CI.
    profiles: [ci-excluded]

  kapowarr:
    # Depends on gluetun which is excluded from CI.
    profiles: [ci-excluded]

  stremio:
    # Depends on gluetun which is excluded from CI.
    profiles: [ci-excluded]

  ddns-updater:
    # Requires valid Cloudflare zone and API token.
    profiles: [ci-excluded]

  backrest:
    # Depends on the full healthy stack; not suitable for CI.
    profiles: [ci-excluded]

  headscale:
    # Fetches OIDC discovery from https://auth.test.local at startup, which does
    # not resolve on GitHub Actions runners.
    profiles: [ci-excluded]

  agentgateway:
    # Same as headscale: its ui.policies.oidc makes it fetch the discovery
    # document from https://auth.test.local before it serves anything, and it
    # exits when that fails - so Traefik's docker provider never loads its
    # router and the probe reports a 404 rather than the 403 it expects.
    profiles: [ci-excluded]

  llama-cpp:
    # Needs the 4.4GB of Gemma 4 weights that scripts/llama-cpp-pre-start.sh
    # seeds into the llama_models volume, which CI does not run.
    profiles: [ci-excluded]

  piper:
    # Builds an image that downloads ~180MB of voice models; nothing else in the
    # stack depends on it being up.
    profiles: [ci-excluded]

  parakeet:
    # Same as piper: the build bakes in ~660MB of Parakeet weights, and nothing
    # else in the stack depends on it being up.
    profiles: [ci-excluded]

  stremio-lan:
    # Wants an address on the LAN segment, which is a bridge here, and its
    # pre-start hook checks STREMIO_IP against a subnet a runner does not have.
    # Named here rather than left out of the selection: tests/ci-profiles.py
    # computes what CI starts from this file, so "not selected" has to be said
    # in the one place that says it for every other service too.
    profiles: [ci-excluded]

  # --- open-webui: run without the excluded inference backend ---
  open-webui:
    # depends_on must be reset, not merged: compose would otherwise pull
    # llama-cpp back in despite its profile.
    depends_on: !override
      postgres:
        condition: service_healthy
    # Without this open-webui blocks on an unreachable http://llama-cpp:8080/v1
    # every time it builds a model list.
    environment:
      - ENABLE_OPENAI_API=false

  # --- nextcloud: production's own mounts, with the ownership CI has to give ---
  #
  # These used to be replaced by named volumes, on the reasoning that Docker
  # creates a missing bind source root:root and www-data (uid 33) cannot write
  # to it. Named volumes did not fix that for `config`: the image's
  # /var/www/html is empty, so there is nothing at /var/www/html/config to seed
  # the volume's ownership from, and it came out root:root all the same. Worse,
  # custom.config.php is bind-mounted *inside* that directory, so the entrypoint
  # sees a non-empty config/ and skips the rsync that would have chowned it.
  #
  # Nextcloud has therefore never installed in CI. It logged `Cannot write into
  # "config" directory!` four times and served 503 from status.php forever,
  # which the healthcheck below used to accept as "still initialising the DB" —
  # so every Nextcloud check in this job has been passing on an empty shell
  # since the day it was written.
  #
  # The workflow pre-creates the three directories owned by uid 33 instead, and
  # the mounts are production's, which is the arrangement worth testing anyway.
  nextcloud:
    healthcheck:
      # installed:true, not a status code: 503 is what a Nextcloud that cannot
      # write its own config answers, and accepting it is what hid this.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/status.php | grep -q '\"installed\":true'",
        ]
      interval: 20s
      timeout: 10s
      retries: 8
      # The install, the four occ calls its post-installation hooks make, and
      # the external storage they mount all happen inside this window.
      start_period: 120s

  # --- postgres: replace host bind mount with a named volume for CI ---
  # ./data/postgres18 may hold production data initialised with a different
  # PASSWORD; a named volume guarantees a fresh database on the CI one.
  # Mount point is /var/lib/postgresql, not .../data — see compose.yaml.
  postgres:
    volumes: !override
      - postgres_ci_data:/var/lib/postgresql
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh

  # --- authelia: keep generated config mounts writable in CI ---
  # CI pre-renders configuration.yml and secrets into DATA_LOCATION before the
  # stack starts. Authelia adjusts ownership under /config during startup, so
  # the generated config mounts must be writable here even though production
  # keeps them read-only.
  authelia:
    volumes: !override
      - ${DATA_LOCATION:-./data}/authelia-config/configuration.yml:/config/configuration.yml
      - ${DATA_LOCATION:-./data}/authelia-config/secrets:/config/secrets
      - ${DATA_LOCATION:-./data}/authelia-config:/config/data

  # --- lldap: set JWT secret inline for CI ---
  # `required: false` on compose.yaml's lldap.env only suppresses ENOENT, not
  # EACCES, so a root-owned or unreadable file there still fails the run.
  lldap:
    environment:
      LLDAP_JWT_SECRET: ci-jwt-secret-for-testing-placeholder
    env_file: !reset []

  # --- unbound: use multi-arch image for CI (mvance/unbound-rpi is ARM-only) ---
  # klutchell/unbound is a distroless image; pass -d to stay in foreground.
  # The drill binary is broken on some ARM64 kernels; use unbound-host instead.
  unbound:
    image: klutchell/unbound:v1.26.0@sha256:5020cfe1218aeda38777f88279220162e602c3a44efc684550dbf46137106a16
    command: ["-d"]
    volumes: !override
      - ./config/unbound/unbound.conf:/etc/unbound/unbound.conf:ro
      # This image ships its trust anchor at /var/unbound/root.key, not where the
      # production image keeps it; unbound.conf includes this path either way.
      - ./config/unbound/dnssec-ci.conf:/etc/unbound/dnssec.d/dnssec.conf:ro
    healthcheck:
      test: ["CMD", "unbound-host", "-r", "-t", "A", "cloudflare.com"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- pihole: disable host port bindings, fix static IP for CI bridge network ---
  pihole:
    # systemd-resolved already holds port 53 on the runner.
    ports: !reset []
    expose:
      - 53
      - 8082
    healthcheck:
      test: ["CMD", "nslookup", "cloudflare.com", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      frontend: {}
      lan:
        # Must be within the CI bridge subnet defined below (192.168.88.0/24).
        ipv4_address: "192.168.88.250"

# macvlan needs a real physical parent interface and promiscuous mode, neither of
# which a GitHub Actions VM runner has.
networks:
  lan:
    driver: bridge
    driver_opts: !reset {}
    ipam:
      driver: default
      config:
        - subnet: 192.168.88.0/24
          gateway: 192.168.88.1

volumes:
  postgres_ci_data:
