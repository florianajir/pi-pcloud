# Always-on infrastructure: the reverse proxy, the two shared datastores and
# the updater that keeps the public DNS records pointing here.
#
# Included by compose.yaml, which declares the networks and volumes and holds
# the canonical x- anchors these are copies of (tests/compose-invariants.py
# fails if one drifts: change compose.yaml first).

x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s
x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  traefik:
    <<: *service-defaults
    image: traefik:v3.7.14
    container_name: pi-traefik
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN:-}
    command:
      - "--log.level=INFO"
      # Without it an ipallowlist 403 leaves no trace: it never reaches the
      # backend's own log.
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--entrypoints.web.address=:80/tcp"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443/tcp"
      # autodetect must stay last: Traefik v3 no longer fills a missing
      # Content-Type, and with nosniff the ipallowlist 403 downloads as a file.
      - "--entrypoints.websecure.http.middlewares=compress@docker,security-headers@docker,autodetect@docker"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
      - "--entrypoints.websecure.http3=true"
      # No forwardedHeaders.trustedIPs on purpose: nothing proxies in front of
      # Traefik, so trusting X-Forwarded-* would let a client forge
      # X-Forwarded-Host and pick which rule Authelia applies.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0"
      # Served on the implicit `traefik` entrypoint (:8080); /metrics on
      # websecure is a 404.
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--providers.docker=true"
      - "--providers.docker.watch=true"
      - "--providers.docker.network=frontend"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.cloudflare.acme.email=${EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=10"
    labels:
      - "homepage.group=Network"
      - "homepage.name=Traefik"
      - "homepage.icon=traefik.png"
      - "homepage.href=https://traefik.${HOST_NAME:-pi.lan}"
      - "homepage.description=Reverse proxy and TLS certificates"
      - "homepage.widget.type=traefik"
      # The address, not the name: Docker's DNS answers pi-traefik with its
      # `backup` address, which internalapi-allow denies.
      - "homepage.widget.url=http://172.30.11.250:8080"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.middlewares.autodetect.contenttype=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=same-origin"
      # Not in security-headers: an entrypoint middleware wraps every router, so
      # no router could opt out, and Vaultwarden must. Attached per router.
      - "traefik.http.middlewares.frame-deny.headers.frameDeny=true"
      # HOST_LAN_SUBNET6 and WAN_HAIRPIN_IP expire with the ISP lease and are
      # owned by wan-allowlist-sync.sh. `:+` so an empty value adds no trailing
      # comma: Traefik rejects it as an invalid CIDR and drops every router
      # using this middleware.
      - "traefik.http.middlewares.lan.ipallowlist.sourcerange=${ALLOW_IP_RANGES:-127.0.0.1/32,192.168.1.0/24,100.64.0.0/10,172.30.0.0/16,::1/128,fd7a:115c:a1e0::/48}${HOST_LAN_SUBNET6:+,${HOST_LAN_SUBNET6}}${WAN_HAIRPIN_IP:+,${WAN_HAIRPIN_IP}}"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.average=10"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.burst=20"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.period=1s"
      # For surfaces one client hammers but that cost nothing upstream (Stremio
      # artwork and catalogues: one home paint is over a thousand requests).
      # Stream lookups stay on rate-limit-auth. docs/SECURITY.md.
      - "traefik.http.middlewares.rate-limit-burst.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit-burst.ratelimit.burst=200"
      - "traefik.http.middlewares.rate-limit-burst.ratelimit.period=1s"
      # The SSO portal's own: a cold load is 21 requests at once, which
      # rate-limit-auth's burst of 20 would break. It caps floods; guessing is
      # left to Authelia's regulation.
      - "traefik.http.middlewares.rate-limit-portal.ratelimit.average=20"
      - "traefik.http.middlewares.rate-limit-portal.ratelimit.burst=60"
      - "traefik.http.middlewares.rate-limit-portal.ratelimit.period=1s"
      - "traefik.http.routers.traefik.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.domains[0].main=${HOST_NAME:-pi.lan}"
      - "traefik.http.routers.traefik.tls.domains[0].sans=*.${HOST_NAME:-pi.lan}"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      # On the implicit :8080 entrypoint, so Homepage reads the API from inside
      # frontend without the Authelia-gated dashboard router.
      - "traefik.http.routers.internalapi.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.internalapi.entrypoints=traefik"
      - "traefik.http.routers.internalapi.service=api@internal"
      # api@internal is unauthenticated and /api/rawdata maps every router,
      # public bypasses included. Homepage is the only consumer.
      - "traefik.http.middlewares.internalapi-allow.ipallowlist.sourcerange=172.30.11.240/32"
      - "traefik.http.routers.internalapi.middlewares=internalapi-allow@docker"
    ports:
      # Both families spelled out, never a bare port: an IPv6 publish to a
      # container without an IPv6 address falls back to docker-proxy, which
      # rewrites the source into ALLOW_IP_RANGES. docs/NETWORKING.md#ipv6.
      - "0.0.0.0:80:80"
      - "[::]:80:80"
      - "0.0.0.0:443:443"
      - "[::]:443:443"
      # http3=true advertises Alt-Svc, cached ~30 days by browsers: without this
      # listener they retry QUIC and time out first.
      - "0.0.0.0:443:443/udp"
      - "[::]:443:443/udp"
    expose:
      - 8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_LOCATION:-./data}/traefik/letsencrypt:/letsencrypt
    networks:
      frontend:
        ipv4_address: 172.30.11.250
      # backup, dockhand and vaultwarden_web: to route the services that left
      # frontend. Static .250 where an extra_hosts names Traefik by address.
      backup: {}
      dockhand:
        ipv4_address: 172.30.13.250
      vaultwarden_web:
        ipv4_address: 172.30.14.250
      # The DNAT target for the [::] publishes: the stack's only IPv6 endpoint.
      ingress6:
        ipv4_address: 172.30.15.250
        ipv6_address: fd00:30:15::250
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      start_interval: 5s
    cpuset: "0"
    cpu_shares: *cpu-prio-critical
    mem_limit: 192m
    mem_reservation: 96m
    oom_score_adj: *oom-score-critical

  postgres:
    <<: *service-defaults
    restart: always
    container_name: pi-postgres
    # From 18 the image keeps PGDATA at /var/lib/postgresql/<major>/docker, so
    # the mount is the parent and the host path carries the major. Upgrade only
    # with scripts/pg-major-upgrade.sh, and rebuild backrest after: its pg
    # client follows this major. docs/POSTGRES-UPGRADE.md.
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.5@sha256:a20e21841b21b9c009daf572c844ffedfaef75fce51287bbf080edf171ef0834
    environment:
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # No DB_STORAGE_TYPE: the image's SSD default suits solid-state
      # POSTGRES_DATA_LOCATION. On a spinning disk add `DB_STORAGE_TYPE: HDD`.
    volumes:
      # POSTGRES_DATA_LOCATION so the cluster can live off the media disk: it
      # wants low seek latency and a truthful fsync. docs/ARCHITECTURE.md.
      - ${POSTGRES_DATA_LOCATION:-${DATA_LOCATION:-./data}}/postgres18:/var/lib/postgresql
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    networks:
      - immich
      - nextcloud
      - auth
      - ai
      - vault
      - rss
      - forge
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      start_interval: 3s
    mem_limit: 1536m
    mem_reservation: 768m
    # 256 MB of swap: shared_buffers is shmem, swappable but not reclaimable,
    # and a paged-out buffer cache is a database that thinks it reads RAM.
    memswap_limit: 1792m
    # No cpuset: on 1-3 it fought llama-cpp and parakeet for the cores they
    # saturate. It wins on cpu_shares instead.
    cpu_shares: *cpu-prio-critical
    shm_size: 256mb
    oom_score_adj: *oom-score-critical

  redis:
    <<: *service-defaults
    restart: always
    container_name: pi-redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      <<: *healthcheck-fast
      # Matched on PONG: `valkey-cli ping` exits 0 on a NOAUTH reply.
      test: ["CMD-SHELL", "REDISCLI_AUTH=$(cat /run/secrets/redis_password) valkey-cli ping | grep -q PONG"]
      start_period: 5s
      start_interval: 3s
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./config/redis/valkey.conf:/etc/valkey/valkey.conf:ro
      - ${DATA_LOCATION:-./data}/redis/redis-auth.conf:/run/secrets/redis-auth.conf:ro
      # The same secret, bare, for the healthcheck.
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/redis_password:/run/secrets/redis_password:ro
      - redis_data:/data
    networks:
      - immich
      - nextcloud
      - auth
      - aiometadata
    cpu_shares: *cpu-prio-critical
    # Well above maxmemory in config/redis/valkey.conf: the BGSAVE fork's
    # copy-on-write pages count too. maxmemory is one budget for every tenant,
    # and an evicted Nextcloud lock is a concurrent write - if evicted_keys
    # climbs, give aiometadata a valkey of its own.
    #
    # After recreating this container, `docker restart pi-aiometadata`: its
    # client never reconnects, and its /health/live does not test the cache.
    mem_limit: 512m
    mem_reservation: 64m
    oom_score_adj: *oom-score-critical

  ddns-updater:
    <<: *service-defaults
    image: ghcr.io/qdm12/ddns-updater:v2.10.0
    container_name: pi-ddns-updater
    networks:
      - egress_ddns
    # Public resolvers: on a cold boot 127.0.0.11 has no working upstream until
    # unbound and pihole are up, and ddns-updater latches that failure until a
    # manual restart. depends_on does not help: dockerd ignores it when the
    # restart policy starts containers after a power cut.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      # It looks a name up before writing it; through the router, the first
      # AAAA seeds a NODATA into its negative cache and the healthcheck then
      # reports a mismatch on a correct record.
      RESOLVER_ADDRESS: 1.1.1.1:53
      # ip_version on every entry: unpinned, an entry replaces the A record with
      # an AAAA. `:+` so an empty switch adds no comma (invalid JSON).
      CONFIG: >-
        {"settings":[ {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false,"ip_version":"ipv4"}, {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"*.${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false,"ip_version":"ipv4"}${IPV6_PUBLIC_RECORDS:+, {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false,"ip_version":"ipv6"}, {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"*.${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false,"ip_version":"ipv6"}} ]}
    volumes:
      - ddns_data:/updater/data
    cpu_shares: *cpu-prio-normal
    mem_limit: 64m
    oom_score_adj: *oom-score-critical
