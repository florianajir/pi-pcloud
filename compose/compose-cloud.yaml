# The services that hold user data - files, photos, secrets, automations -
# and the notification bus the rest of the stack publishes to.
#
# Included by compose.yaml, which declares the networks and volumes named
# below and supplies the .env this file interpolates. Not startable on its
# own: `docker compose -f compose/compose-cloud.yaml` resolves every relative
# path against compose/ instead of the project root.

# --- shared preamble: identical in every compose/*.yaml ---
#
# YAML anchors are file-scoped and `include:` parses each file on its own, so
# this block cannot be shared - it is copied. compose.yaml holds the canonical
# copy, with the reasoning behind every tier; tests/compose-invariants.py fails
# the build when a copy drifts from it. Change compose.yaml first, then here.

x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s
x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

# --- end shared preamble ---

services:
  nextcloud:
    <<: *service-defaults
    image: nextcloud:34.0.4-apache
    container_name: pi-nextcloud
    profiles: ["nextcloud", "all"]
    environment:
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${PASSWORD}
      - NEXTCLOUD_ADMIN_EMAIL=${EMAIL}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${HOST_NAME:-pi.lan} localhost 127.0.0.1
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - OVERWRITEHOST=nextcloud.${HOST_NAME:-pi.lan}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://nextcloud.${HOST_NAME:-pi.lan}
      - TRUSTED_PROXIES=172.30.11.250/32
      - ALLOW_IP_RANGES=${ALLOW_IP_RANGES:-127.0.0.1/32,192.168.1.0/24,100.64.0.0/10,172.30.0.0/16,::1/128,fd7a:115c:a1e0::/48}
      - FORWARDED_FOR_HEADERS=HTTP_X_FORWARDED_FOR
      - NEXTCLOUD_MAINTENANCE_WINDOW_START=${NEXTCLOUD_MAINTENANCE_WINDOW_START:-2}
      - NEXTCLOUD_DEFAULT_PHONE_REGION=${NEXTCLOUD_DEFAULT_PHONE_REGION:-FR}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${PASSWORD}
      - REDIS_HOST=redis
      # The file variant, so the password is not in docker inspect - and it has
      # to stay a path every UID in the container can read, because
      # `docker exec -u www-data` re-resolves it. See the mount below.
      - REDIS_HOST_PASSWORD_FILE=/run/secrets/redis_password
      - TZ=${TIMEZONE:-Europe/Paris}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_SECURE=${SMTP_SECURE:-tls}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_AUTHTYPE=${SMTP_AUTHTYPE:-LOGIN}
      - SMTP_NAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-nextcloud}
      - MAIL_DOMAIN=${HOST_NAME:-pi.lan}
    volumes:
      - nextcloud_html:/var/www/html
      - ${DATA_LOCATION:-./data}/nextcloud:/var/www/html/data
      - ${DATA_LOCATION:-./data}/nextcloud-config:/var/www/html/config
      - ${DATA_LOCATION:-./data}/nextcloud-themes:/var/www/html/themes
      # The download tree and the reading libraries, read-write, so Nextcloud is
      # also where they get organised - renamed, moved, deleted - and not only
      # where a file gets a public share link.
      #
      # Read-write here is necessary but not sufficient: Nextcloud's PHP runs as
      # uid 33 and everything below belongs to uid/gid 1000 in mode 0755, so it
      # would still only get r-x. scripts/nextcloud-pre-start.sh grants uid 33
      # write access with an ACL. Note `group_add: 1000` does NOT work here,
      # tempting as it looks: Apache calls initgroups() when it drops to
      # www-data, which rebuilds the group list from the container's /etc/group
      # and discards the supplementary gid compose added.
      #
      # config/nextcloud/hooks/post-installation/20-external-storage.sh turns
      # these into files_external mounts; keep the two lists in step.
      - ${DATA_LOCATION:-./data}/download:/mnt/qbittorrent-downloads
      - ${DATA_LOCATION:-./data}/comics:/mnt/library-comics
      - ${DATA_LOCATION:-./data}/manga:/mnt/library-manga
      - ${DATA_LOCATION:-./data}/download/books:/mnt/library-books
      - ${DATA_LOCATION:-./data}/download/audiobooks:/mnt/library-audiobooks
      - ./config/nextcloud/custom.config.php:/var/www/html/config/custom.config.php:ro
      - ./config/nextcloud/security-headers.conf:/etc/apache2/conf-enabled/security-headers.conf:ro
      - ./config/nextcloud/zz-opcache-jit.ini:/usr/local/etc/php/conf.d/zz-opcache-jit.ini:ro
      - ./config/nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      # The 0644 copy, not the 0600 original: redis.config.php keeps the
      # `_FILE` branch and re-reads it per request, so www-data needs it too.
      - ${DATA_LOCATION:-./data}/redis/redis-password:/run/secrets/redis_password:ro
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    networks:
      - frontend
      - nextcloud
    labels:
      - "homepage.group=Storage"
      - "homepage.name=Nextcloud"
      - "homepage.icon=nextcloud.png"
      - "homepage.href=https://nextcloud.${HOST_NAME:-pi.lan}"
      - "homepage.description=File sync and collaboration"
      - "homepage.widget.type=nextcloud"
      - "homepage.widget.url=https://nextcloud.${HOST_NAME:-pi.lan}"
      - "homepage.widget.username={{HOMEPAGE_VAR_NEXTCLOUD_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # frame-deny@docker sends DENY, but Nextcloud's own check wants SAMEORIGIN
      # exactly - same fix as Vaultwarden's vaultwarden-frame below.
      - "traefik.http.middlewares.nextcloud-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-frame@docker,lan@docker"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.priority=10"
      # Same caveat as immich-public: no lan@docker, so this rule is the public
      # surface. Two prefixes were wider than any share needs.
      # `/avatar/` was an account-enumeration oracle - /avatar/<known-mail>/64/dark
      # answers 200 where an unknown one answers 201, unauthenticated. Shares only
      # ever request /avatar/guest/, so the prefix is narrowed to that.
      # `/apps/` also exposed /apps/files/api/v1/*; the negation keeps the app
      # assets (js, css, l10n, img, theming) that a share page genuinely loads
      # while dropping every app's REST surface. /ocs/ and /remote.php/ were
      # already absent from here, so the OCS API stays behind lan@docker.
      # `/custom_apps/` is where store-installed apps serve their assets, and it
      # was never in this rule - which quietly broke public calendar sharing:
      # /apps/calendar/p/<token> is reachable, but the page it returns pulls
      # /custom_apps/calendar/js/calendar-main.js, so the calendar never rendered
      # for anyone outside the LAN. Mirrors the /apps/ negation above so the
      # store apps' REST surfaces stay private.
      # Assets only under /apps, /custom_apps and /core, never the whole tree:
      # anything broader publishes /apps/user_oidc/login and with it a way to
      # reach /apps/files/ and /core/preview from off-LAN. The subdirectory list
      # is what a real public share page requests, plus l10n/fonts/vendor. LAN
      # and tailnet clients match the `lan` router instead and are unaffected.
      - "traefik.http.routers.nextcloud-public.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/s/`) || PathPrefix(`/public.php`) || PathPrefix(`/avatar/guest/`) || PathPrefix(`/dist/`) || PathPrefix(`/js/`) || PathPrefix(`/themes/`) || PathPrefix(`/apps/files_sharing/publicpreview`) || PathRegexp(`^/core/(css|js|img|fonts|l10n|vendor)/`) || PathRegexp(`^/(apps|custom_apps)/[^/]+/(css|js|img|fonts|l10n|vendor|theme|favicon|icon|manifest)/`) || PathPrefix(`/remote.php/dav/calendars/`) || PathPrefix(`/remote.php/dav/public-calendars/`))"
      - "traefik.http.routers.nextcloud-public.entrypoints=websecure"
      - "traefik.http.routers.nextcloud-public.middlewares=nextcloud-frame@docker"
      - "traefik.http.routers.nextcloud-public.tls=true"
      - "traefik.http.routers.nextcloud-public.priority=20"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      start_period: 60s
      start_interval: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpuset: "1-3"
    cpu_shares: *cpu-prio-normal
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  immich-server:
    <<: *service-defaults
    container_name: pi-immich
    profiles: ["immich-server", "all"]
    image: ghcr.io/immich-app/immich-server:v3.2.2
    volumes:
      - ${DATA_LOCATION:-./data}/immich:/data
      - ${DATA_LOCATION:-./data}/authelia-config/immich-oauth-config.yaml:/immich-oauth-config.yaml:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/redis_password:/run/secrets/redis_password:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: postgres
      DB_DATABASE_NAME: immich
      DB_USERNAME: immich
      DB_PASSWORD: ${PASSWORD}
      REDIS_HOSTNAME: redis
      # The file variant, so the password is not in docker inspect.
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      IMMICH_CONFIG_FILE: /immich-oauth-config.yaml
      IMMICH_TRUSTED_PROXIES: 172.30.11.250/32
      # The whole enum. `repo` and `io` are the expensive halves - a histogram
      # per repository method and per filesystem op - so set
      # IMMICH_TELEMETRY_EXCLUDE=repo,io if the TSDB size cap starts biting.
      IMMICH_TELEMETRY_INCLUDE: all
      CPU_CORES: 3
      TZ: ${TIMEZONE:-Europe/Paris}
    networks:
      - frontend
      - immich
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - 2283
      # IMMICH_API_METRICS_PORT and IMMICH_MICROSERVICES_METRICS_PORT at their
      # defaults: one container, two workers, two listeners.
      - 8081
      - 8082
    labels:
      - "homepage.group=Storage"
      - "homepage.name=Immich"
      - "homepage.icon=immich.png"
      - "homepage.href=https://immich.${HOST_NAME:-pi.lan}"
      - "homepage.description=Photo and video library"
      - "homepage.widget.type=immich"
      - "homepage.widget.url=http://pi-immich:2283"
      - "homepage.widget.key={{HOMEPAGE_FILE_IMMICH_API_KEY}}"
      - "homepage.widget.version=2"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.immich.rule=Host(`immich.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.routers.immich.priority=10"
      # This router carries no lan@docker, so its rule *is* the public surface.
      # A blanket PathPrefix(`/api`) put the whole authenticated API on the
      # internet - /api/users/me, /api/albums, /api/faces, /api/sync/stream -
      # none of which a share link touches. Worse, `immich@` then only ever saw
      # the HTML shell: every API call from the logged-in app was routed here.
      # Measured against a real share by splitting the access log per TCP
      # connection, every anonymous request carries `key` or `slug`, without
      # exception. So /api/assets - which a share and the app request at the
      # same paths - is gated on that parameter rather than on the path.
      # Fails closed: a missing path 403s from outside while still working from
      # the LAN, so any change here must be validated off-tailnet.
      # The three loose files are not decoration: /service-worker.js was 403ing
      # in a retry loop on every share view (32 times over one off-tailnet test),
      # and none of them ever matched the old rule either - they sit at the root,
      # outside /share, /s/, /_app and /api.
      - "traefik.http.routers.immich-public.rule=Host(`immich.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/share`) || PathPrefix(`/s/`) || PathPrefix(`/_app`) || Path(`/service-worker.js`) || Path(`/custom.css`) || Path(`/dark_skeleton.png`) || Path(`/api/server/config`) || Path(`/api/server/features`) || Path(`/api/server/media-types`) || ((PathPrefix(`/api/assets`) || PathPrefix(`/api/download`) || PathPrefix(`/api/timeline`) || PathPrefix(`/api/albums`)) && (QueryRegexp(`key`, `.+`) || QueryRegexp(`slug`, `.+`))))"
      - "traefik.http.routers.immich-public.entrypoints=websecure"
      # rate-limit-burst, not rate-limit-auth: a share page pulls one thumbnail
      # per photo from /api/assets, so the tight limiter would answer 429 to most
      # of an album exactly as it did to AIOMetadata's posters. 100/s with a burst
      # of 200, per source, bounds a download hammer without touching a real view.
      - "traefik.http.routers.immich-public.middlewares=frame-deny@docker,rate-limit-burst@docker"
      - "traefik.http.routers.immich-public.tls=true"
      - "traefik.http.routers.immich-public.priority=20"
      # The password of a protected share had no brute-force protection of any
      # kind. Measured from an address outside the allowlist: eight consecutive
      # wrong passwords on /api/shared-links/login all answered 401 in ~53 ms,
      # flat - Immich throttles nothing here, and this router carried no limiter.
      # Nextcloud, on the same test, recorded the attempts against the real client
      # IP and armed a 25 s delay; Immich has no equivalent to enable.
      #
      # So the two credential endpoints get their own router and their own
      # limiter. /login is the password submission - upstream's own summary on
      # `Post('login')` is "Login to a password protected shared link"
      # (server/dist/controllers/shared-link.controller.js) - and /me is where a
      # share page learns a password is required at all. Both are carved out of the
      # router above rather than left on the burst limiter, which at 100/s is no
      # obstacle to guessing.
      #
      # Carved out means *removed* from immich-public's rule, not merely
      # outranked by this one. Leaving them there would make the split fail
      # open: this router is one mistyped middleware name away from being
      # dropped from the routing table - the failure mode the ipv6Subnet note
      # below warns about - and the credential endpoints would then quietly land
      # back on rate-limit-burst instead of 404ing. With them gone, a router that
      # fails to load leaves those two paths to immich@ at priority 10, which
      # carries lan@docker: LAN keeps working, the internet gets a 403.
      #
      # 30 per minute with a burst of 20: a human who mistypes a share password
      # three times never notices, while a guesser drops from unbounded to ~43k
      # attempts a day. Not measured against real share traffic - there is none in
      # the access log to measure - so it is sized for the call pattern (/me once
      # per page load, /login once per submission), not observed load.
      #
      # ipv6Subnet is what makes it worth having. Without it a per-IP bucket is
      # decorative against IPv6: this host answers on a /64 and a client can pick a
      # fresh address per request. Grouping the bucket by /64 makes rotating within
      # the prefix pointless. Traefik 3.7 field; it silently does nothing if the
      # name is wrong, so check the middleware in /api/http/middlewares after any
      # edit rather than trusting the label.
      - "traefik.http.middlewares.immich-share-limit.ratelimit.average=30"
      - "traefik.http.middlewares.immich-share-limit.ratelimit.burst=20"
      - "traefik.http.middlewares.immich-share-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.immich-share-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64"
      - "traefik.http.routers.immich-share-auth.rule=Host(`immich.${HOST_NAME:-pi.lan}`) && (Path(`/api/shared-links/me`) || Path(`/api/shared-links/login`))"
      - "traefik.http.routers.immich-share-auth.entrypoints=websecure"
      - "traefik.http.routers.immich-share-auth.middlewares=frame-deny@docker,immich-share-limit@docker"
      - "traefik.http.routers.immich-share-auth.tls=true"
      - "traefik.http.routers.immich-share-auth.priority=30"
      - "traefik.http.routers.immich-share-auth.service=immich"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    cpuset: "1-3"
    cpu_shares: *cpu-prio-normal
    mem_limit: 3072m
    memswap_limit: 3584m
    oom_score_adj: *oom-score-deprioritize

  immich-machine-learning:
    <<: *service-defaults
    container_name: pi-immich-machine-learning
    profiles: ["immich-machine-learning", "all"]
    labels:
      - "homepage.description=Face and object recognition for Immich"
      - "pi-pcloud.companion-of=immich-server"
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    networks:
      - egress_immich
      - immich
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
      MACHINE_LEARNING_WORKERS: 2
      MACHINE_LEARNING_REQUEST_THREADS: 2
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS: 1
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 2
      MACHINE_LEARNING_MODEL_TTL: 180
      MACHINE_LEARNING_WORKER_TIMEOUT: 300
      MACHINE_LEARNING_ANN: "false"
      MACHINE_LEARNING_RKNN: "false"
    volumes:
      - immich_model_cache:/cache
    cpuset: "2-3"
    cpu_shares: *cpu-prio-idle
    mem_limit: 2g
    memswap_limit: 2560m
    oom_score_adj: *oom-score-deprioritize

  vaultwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.3
    container_name: pi-vaultwarden
    profiles: ["vaultwarden", "all"]
    # Not frontend: no east-west consumer at all. See `vaultwarden_web` below.
    networks:
      - vaultwarden_web
      - vault
    expose:
      - 80
    # So the SSO_AUTHORITY discovery call resolves to Traefik, reached on
    # vaultwarden_web since this container moved off frontend.
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.14.250"
    # Neither SSO_CLIENT_SECRET nor ADMIN_TOKEN has a *_FILE variant, so the mounted
    # secrets are exported before handing over to the image's own /start.sh. Same
    # trick as open-webui. Both values are hex/PHC, so they need no quoting.
    entrypoint: ["sh", "-c", "export SSO_CLIENT_SECRET=$(cat /run/secrets/oidc_vaultwarden_secret) ADMIN_TOKEN=$(cat /run/secrets/admin_token_hash) && exec /start.sh"]
    environment:
      - DOMAIN=https://vault.${HOST_NAME:-pi.lan}
      - DATABASE_URL=postgresql://vaultwarden:${PASSWORD}@postgres/vaultwarden
      # This router is only behind the LAN allowlist, so open registration would
      # let anyone on the tailnet create a vault. Invite from /admin instead.
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      # ADMIN_TOKEN is exported by the entrypoint from an Argon2id digest generated
      # by scripts/vaultwarden-pre-start.sh - deliberately not derived from PASSWORD.
      # This does NOT remove the master password: that key encrypts the vault
      # itself and never reaches the identity provider.
      - SSO_ENABLED=true
      - SSO_AUTHORITY=https://auth.${HOST_NAME:-pi.lan}
      - SSO_CLIENT_ID=vaultwarden
      - SSO_SCOPES=profile email offline_access
      # Native email+password login is off, so everyone who signs in - including
      # an emergency-access contact - must exist in LLDAP. An invitation only
      # creates a stub account, claimed by signing in through Authelia.
      - SSO_ONLY=true
      # Authelia rotates refresh tokens single-use with no grace period, and the
      # Bitwarden clients refresh even while their access token is still valid.
      # Any refresh response that fails to reach the client (a restart mid-flight,
      # a transient 500) therefore burns the only token it holds and locks it out
      # for good. Authelia stays the sole way *in*; the session it opens is ours.
      - SSO_AUTH_ONLY_NOT_SESSION=true
      # Deliberate, not just the default: needs the SMTP below to deliver its
      # invite, grant and takeover-notification mails.
      - EMERGENCY_ACCESS_ALLOWED=true
      # starttls suits the default port 587; use force_tls on 465.
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${EMAIL:-noreply@localhost}
      - SMTP_FROM_NAME=Vaultwarden
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/vaultwarden:/data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_vaultwarden_secret.txt:/run/secrets/oidc_vaultwarden_secret:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/vaultwarden_admin_token_hash:/run/secrets/admin_token_hash:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The bundled /healthcheck.sh already handles ROCKET_PORT and base paths.
      <<: *healthcheck-light
      test: ["CMD", "/healthcheck.sh"]
    labels:
      - "homepage.group=Security"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden.png"
      - "homepage.href=https://vault.${HOST_NAME:-pi.lan}"
      - "homepage.description=Bitwarden-compatible password manager"
      - "traefik.enable=true"
      - "traefik.docker.network=vaultwarden_web"
      # Deliberately no authelia@docker: forward-auth breaks the browser extension
      # and mobile clients, which cannot complete the interactive portal. They are
      # authenticated through OIDC instead (see SSO_* above).
      # The websecure entrypoint's security-headers sets X-Frame-Options: DENY on
      # every response, which Vaultwarden's own diagnostics flag: it replaces the
      # SAMEORIGIN the API needs, and adds the header to the *-connector.html pages
      # that must have none - those are framed by the browser extension from a
      # chrome-extension:// origin, which any X-Frame-Options value would block.
      # Restoring per-router requires re-emitting the header after the entrypoint.
      - "traefik.http.middlewares.vaultwarden-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.middlewares=vaultwarden-frame@docker,lan@docker"
      - "traefik.http.routers.vaultwarden.tls=true"
      # Longer rule than the catch-all above, so Traefik's rule-length priority
      # picks it for the connector pages without an explicit priority.
      - "traefik.http.routers.vaultwarden-connector.rule=Host(`vault.${HOST_NAME:-pi.lan}`) && (Path(`/webauthn-connector.html`) || Path(`/sso-connector.html`))"
      - "traefik.http.routers.vaultwarden-connector.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-connector.middlewares=lan@docker"
      - "traefik.http.routers.vaultwarden-connector.tls=true"
      - "traefik.http.routers.vaultwarden-connector.service=vaultwarden"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    cpu_shares: *cpu-prio-normal
    mem_limit: 256m
    mem_reservation: 32m
    oom_score_adj: *oom-score-important

  # A git forge: repositories, issues, pull requests and releases, self-hosted.
  # It is the one service here whose data is not a copy of something else - a
  # repository pushed only to this host exists nowhere but this host, which is
  # why it is dumped (Postgres) *and* mirrored (the bare repos) by backrest.
  forgejo:
    <<: *service-defaults
    # Forgejo, not Gitea: same codebase originally, but Forgejo is GPLv3 and
    # governed by Codeberg e.V. (a non-profit) rather than by Gitea Ltd. under a
    # CLA that can relicense contributions. See the PR body for the rest of the
    # comparison. The digest pins the multi-arch index, not one platform's
    # manifest, so it resolves on arm64 here and on amd64 in CI.
    image: codeberg.org/forgejo/forgejo:16.0.5@sha256:cf5f5ae6acf2ababca0ee3d255705b83a47f35b25e07fc931d694d60664053fe
    container_name: pi-forgejo
    profiles: ["forgejo", "all"]
    networks:
      # frontend for Traefik, and for what Forgejo itself reaches out to:
      # Authelia's discovery document, repository mirrors, and the SMTP relay.
      - frontend
      # postgres is on internal segments only; this is Forgejo's own.
      - forge
    extra_hosts:
      # Authelia's discovery document, fetched through Traefik. Forgejo
      # validates the URL when the auth source is *created*, so
      # scripts/forgejo-oidc-bootstrap.sh fails outright without this - it is
      # not only the sign-in path.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 3000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # The image chowns /data to these and drops to them. 1000:1000 is the
      # host's own user here, so ${DATA_LOCATION}/forgejo stays readable to a
      # non-root `make update` and to backrest's bind mount.
      - USER_UID=1000
      - USER_GID=1000
      # Everything below lands in /data/gitea/conf/app.ini through the image's
      # FORGEJO__<section>__<KEY> expansion, re-applied on every start - so this
      # file stays the source of truth and an edit in the web UI's admin panel
      # is reverted by the next recreate. The OIDC auth source is the deliberate
      # exception: it lives in the database, because Forgejo has no ini key for
      # it (see scripts/forgejo-oidc-bootstrap.sh).
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${PASSWORD}
      - FORGEJO__server__DOMAIN=git.${HOST_NAME:-pi.lan}
      - FORGEJO__server__ROOT_URL=https://git.${HOST_NAME:-pi.lan}/
      - FORGEJO__server__HTTP_PORT=3000
      # No git-over-SSH. It needs a published host port, which every service
      # here deliberately does without (Traefik is the only ingress), and :22 on
      # this host is the Pi's own sshd. Clones and pushes go over HTTPS with a
      # Forgejo access token as the password - which is also why
      # ENABLE_BASIC_AUTHENTICATION is left at its default of true.
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__server__LFS_START_SERVER=true
      # Install wizard skipped: the settings it would ask for are all above, and
      # an unlocked instance serves /install to the first caller instead.
      - FORGEJO__security__INSTALL_LOCK=true
      # Traefik's address alone, matching FreshRSS's TRUSTED_PROXY and Immich's
      # IMMICH_TRUSTED_PROXIES. Forgejo defaults this to 127.0.0.0/8 - so
      # without it X-Forwarded-For is never honoured and every sign-in, audit
      # entry and rate-limit bucket is attributed to the proxy. A wider range
      # would be worse than the default: it would let any container on
      # `frontend` choose the address Forgejo records.
      - FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES=172.30.11.250/32
      # Accounts come from LLDAP through Authelia and from nowhere else: the
      # sign-up form is gone, and the OIDC source creates the account on first
      # sign-in. DISABLE_REGISTRATION would have blocked that too - it stops
      # external registration as well as the form.
      - FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      # This router carries no authelia@docker (see the labels below), so
      # without this every account on the tailnet - and every request the LAN
      # allowlist admits - could browse the repositories anonymously. The
      # healthcheck endpoint is exempt, verified against v16.0.5.
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=true
      - FORGEJO__service__ENABLE_NOTIFY_MAIL=true
      # Trust Authelia's verified address rather than mailing a confirmation
      # link to an identity LLDAP already vouched for.
      - FORGEJO__service__REGISTER_EMAIL_CONFIRM=false
      # Forgejo's *other* OpenID support - the 2007 OpenID 2.0 consumer, no
      # relation to the OIDC source. Off, so the sign-in page offers exactly one
      # way in.
      - FORGEJO__openid__ENABLE_OPENID_SIGNIN=false
      - FORGEJO__openid__ENABLE_OPENID_SIGNUP=false
      - FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      # The LLDAP uid, matching FreshRSS's OIDC_REMOTE_USER_CLAIM. The default is
      # `nickname`, which Authelia does not send - every account would be named
      # from the fallback instead.
      - FORGEJO__oauth2_client__USERNAME=preferred_username
      - FORGEJO__oauth2_client__ACCOUNT_LINKING=auto
      - FORGEJO__oauth2_client__UPDATE_AVATAR=false
      # Forgejo Actions, off: there is no runner on this host and there should
      # not be one - a CI job is exactly the kind of unbounded CPU consumer the
      # cpu_shares tiers exist to keep away from DNS and the database. Enabled
      # it would only add a tab that never runs anything.
      - FORGEJO__actions__ENABLED=false
      # The code search indexer, off (it is also the upstream default, stated
      # here because it is the one setting that would change this service's
      # memory profile): it builds a bleve index over every file of every
      # repository, which on a Pi costs more than grep-on-demand is worth.
      - FORGEJO__indexer__REPO_INDEXER_ENABLED=false
      - FORGEJO__mailer__ENABLED=true
      - FORGEJO__mailer__PROTOCOL=smtp+starttls
      - FORGEJO__mailer__SMTP_ADDR=${SMTP_HOST:-localhost}
      - FORGEJO__mailer__SMTP_PORT=${SMTP_PORT:-587}
      - FORGEJO__mailer__USER=${SMTP_USERNAME:-}
      - FORGEJO__mailer__PASSWD=${SMTP_PASSWORD:-}
      - FORGEJO__mailer__FROM=${EMAIL:-noreply@localhost}
    volumes:
      # Repositories, LFS objects, avatars, attachments, the session store and
      # the generated app.ini - everything but the database.
      - ${DATA_LOCATION:-./data}/forgejo:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-default
      # The image ships no HEALTHCHECK. /api/healthz is a real probe, unlike a
      # bare GET /: it pings the database and the cache and answers 503 when
      # either is down. curl is in the image; wget and bash are too.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      start_period: 60s
    labels:
      - "homepage.group=Tools"
      - "homepage.name=Forgejo"
      - "homepage.icon=forgejo.png"
      - "homepage.href=https://git.${HOST_NAME:-pi.lan}"
      - "homepage.description=Self-hosted git forge"
      # No homepage.widget: there is no forgejo/gitea widget in homepage, and
      # the gitea one it is sometimes confused with reads a per-account token.
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # No authelia@docker: Forgejo runs the OIDC flow itself (see
      # scripts/forgejo-oidc-bootstrap.sh), and forward-auth on top would
      # also cover /<owner>/<repo>.git and /api/v1 - the paths git and every API
      # client use, which send a token over basic auth and cannot complete an
      # interactive portal. Same rationale as FreshRSS's greader API and
      # Kavita's OPDS clients. REQUIRE_SIGNIN_VIEW above is what closes the
      # anonymous browsing this leaves open.
      #
      # frame-deny@docker is not optional here: the entrypoint-wide
      # security-headers middleware deliberately carries no frame policy, and
      # Forgejo sends neither X-Frame-Options nor a frame-ancestors CSP of its
      # own (checked against v16.0.5) - so without it any page can frame a
      # signed-in session and click through to "Delete repository".
      - "traefik.http.routers.forgejo.rule=Host(`git.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.forgejo.tls=true"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
    cpu_shares: *cpu-prio-batch
    # Measured on this host at v16.0.5: 132 MiB idle, 191 MiB peak while
    # pushing and re-cloning this repository. The headroom is for `git gc`,
    # which the built-in cron forks on the repositories themselves.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  n8n:
    <<: *service-defaults
    image: n8nio/n8n:2.40.3
    container_name: pi-n8n
    profiles: ["n8n", "n8n-runners", "all"]
    expose:
      - 5678
    labels:
      - "homepage.group=Automation"
      - "homepage.name=n8n"
      - "homepage.icon=n8n.png"
      - "homepage.href=https://n8n.${HOST_NAME:-pi.lan}"
      - "homepage.description=Workflow automation"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    environment:
      - N8N_HOST=n8n.${HOST_NAME:-pi.lan}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${HOST_NAME:-pi.lan}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-${TIMEZONE:-Europe/Paris}}
      - TZ=${TIMEZONE:-Europe/Paris}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      - DB_TYPE=sqlite
      - DB_SQLITE_POOL_SIZE=2
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=${SMTP_HOST:-localhost}
      - N8N_SMTP_PORT=${SMTP_PORT:-587}
      - N8N_SMTP_USER=${SMTP_USERNAME:-}
      - N8N_SMTP_PASS=${SMTP_PASSWORD:-}
      - N8N_SMTP_SENDER=${EMAIL:-noreply@localhost}
      - N8N_SMTP_SSL=${SMTP_SSL:-false}
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      # n8n has no separate telemetry listener and does not gate the endpoint,
      # so this also makes n8n.$HOST_NAME/metrics readable by anything past
      # lan@docker. N8N_METRICS_INCLUDE_* stay off, so no workflow names are in
      # it. See docs/MONITORING.md#what-enabling-metrics-exposes.
      - N8N_METRICS=true
      - NODE_OPTIONS=--max-old-space-size=512
    # N8N_RUNNERS_AUTH_TOKEN, generated by scripts/n8n-pre-start.sh. The broker
    # listens on 0.0.0.0 inside `frontend`, so this gates ~25 containers out of
    # registering as a task runner - it must never fall back to a default.
    env_file:
      - path: ./config/n8n/n8n.env
        required: false
    volumes:
      - n8n_data:/home/node/.n8n
      - ${DATA_LOCATION:-./data}/n8n:/files
    networks:
      - frontend
      - n8n_runners
    depends_on:
      - traefik
    healthcheck:
      <<: *healthcheck-default
      # Explicit IPv4 loopback: localhost resolves to ::1 here and the dial fails.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
    cpu_shares: *cpu-prio-normal
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  n8n-runners:
    <<: *service-defaults
    image: n8nio/runners:2.40.3
    container_name: pi-n8n-runners
    profiles: ["n8n-runners", "all"]
    labels:
      - "homepage.description=Sandboxed task runner for n8n"
      - "pi-pcloud.companion-of=n8n"
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    # Same generated secret as the broker above; see scripts/n8n-pre-start.sh.
    env_file:
      - path: ./config/n8n/n8n.env
        required: false
    networks:
      - n8n_runners
    depends_on:
      - n8n
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5680/healthz && nc -z -w 2 n8n 5679"]
      start_period: 5s
      start_interval: 3s
    cpu_shares: *cpu-prio-normal
    mem_limit: 256m
    oom_score_adj: *oom-score-deprioritize

  ntfy:
    <<: *service-defaults
    image: binwiederhier/ntfy:v2.28.0
    container_name: pi-ntfy
    command: serve
    networks:
      - frontend
      - ntfy
    expose:
      - 80
      - 9090
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Deliberately not NTFY_ENABLE_METRICS, which would add /metrics to the
      # routed :80. Here and not in ntfy.env, which ntfy-pre-start.sh rewrites
      # whole.
      - NTFY_METRICS_LISTEN_HTTP=:9090
      - NTFY_BASE_URL=https://ntfy.${HOST_NAME:-pi.lan}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_ENABLE_LOGIN=true
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      # Internal publishers are tierless, so ntfy keys them on `ip:<container
      # address>` and hands each the stock bucket - 60 requests, then one per 5s.
      # A burst that outruns it is refused with 42901 whatever it carries:
      # measured 2026-09, a flood of spurious Prowlarr grabs took 105 unrelated
      # messages down with it, health alerts included.
      #
      # The whole /16 rather than today's segments: the `ntfy` network has no
      # ipam block and takes whatever the daemon pool hands it, so a narrower
      # range would stop matching the first time it is recreated, silently.
      #
      # This does not exempt the internet despite covering Traefik's address:
      # with NTFY_BEHIND_PROXY the limiter keys on X-Forwarded-For, and Traefik
      # sets no forwardedHeaders.trustedIPs, so it overwrites a client-supplied
      # header rather than believing it.
      #
      # Typos are silent - an unparseable entry is one startup WARN and nothing
      # else, so read the log rather than assume.
      - NTFY_VISITOR_REQUEST_LIMIT_EXEMPT_HOSTS=172.30.0.0/16
      - NTFY_SMTP_SENDER_ADDR=${SMTP_HOST:-localhost}:${SMTP_PORT:-587}
      - NTFY_SMTP_SENDER_USER=${SMTP_USERNAME:-}
      - NTFY_SMTP_SENDER_PASS=${SMTP_PASSWORD:-}
      - NTFY_SMTP_SENDER_FROM=${EMAIL:-noreply@localhost}
    env_file:
      - path: ./config/ntfy/ntfy.env
        required: false
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    labels:
      - "homepage.group=Notifications"
      - "homepage.name=ntfy"
      - "homepage.icon=ntfy.png"
      - "homepage.href=https://ntfy.${HOST_NAME:-pi.lan}"
      - "homepage.description=Push notifications"
      - "homepage.widget.type=ntfy"
      - "homepage.widget.url=http://pi-ntfy"
      # The widget reads a single topic; monitoring is the one worth a glance on
      # the dashboard. downloads and security are phone-only topics.
      - "homepage.widget.topic=monitoring"
      - "homepage.widget.username={{HOMEPAGE_VAR_ADMIN_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.ntfy.tls=true"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/v1/health"]
    cpu_shares: *cpu-prio-critical
    mem_limit: 128m
    mem_reservation: 32m
    oom_score_adj: *oom-score-important
