# The services that hold user data - files, photos, secrets, code, chat,
# automations - and the notification bus the rest of the stack publishes to.
#
# Included by compose.yaml, which declares the networks and volumes and holds
# the canonical x- anchors these are copies of (tests/compose-invariants.py
# fails if one drifts: change compose.yaml first).

x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s
x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  nextcloud:
    <<: *service-defaults
    image: nextcloud:35.0.2-apache
    container_name: pi-nextcloud
    profiles: ["nextcloud", "all"]
    environment:
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${PASSWORD}
      - NEXTCLOUD_ADMIN_EMAIL=${EMAIL}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${HOST_NAME:-pi.lan} localhost 127.0.0.1
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - OVERWRITEHOST=nextcloud.${HOST_NAME:-pi.lan}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://nextcloud.${HOST_NAME:-pi.lan}
      - TRUSTED_PROXIES=172.30.11.250/32
      - ALLOW_IP_RANGES=${ALLOW_IP_RANGES:-127.0.0.1/32,192.168.1.0/24,100.64.0.0/10,172.30.0.0/16,::1/128,fd7a:115c:a1e0::/48}
      - FORWARDED_FOR_HEADERS=HTTP_X_FORWARDED_FOR
      - NEXTCLOUD_MAINTENANCE_WINDOW_START=${NEXTCLOUD_MAINTENANCE_WINDOW_START:-2}
      - NEXTCLOUD_DEFAULT_PHONE_REGION=${NEXTCLOUD_DEFAULT_PHONE_REGION:-FR}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${PASSWORD}
      - REDIS_HOST=redis
      # The file variant keeps the password out of docker inspect. It must stay
      # readable by every UID: `docker exec -u www-data` re-resolves it.
      - REDIS_HOST_PASSWORD_FILE=/run/secrets/redis_password
      - TZ=${TIMEZONE:-Europe/Paris}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_SECURE=${SMTP_SECURE:-tls}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_AUTHTYPE=${SMTP_AUTHTYPE:-LOGIN}
      - SMTP_NAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-nextcloud}
      - MAIL_DOMAIN=${HOST_NAME:-pi.lan}
    volumes:
      - nextcloud_html:/var/www/html
      - ${DATA_LOCATION:-./data}/nextcloud:/var/www/html/data
      - ${DATA_LOCATION:-./data}/nextcloud-config:/var/www/html/config
      - ${DATA_LOCATION:-./data}/nextcloud-themes:/var/www/html/themes
      # Read-write, so files can be organised from Nextcloud. uid 33's write
      # access is a POSIX ACL from scripts/nextcloud-pre-start.sh - not
      # `group_add`, which Apache's initgroups() discards. Keep in step with
      # config/nextcloud/hooks/post-installation/20-external-storage.sh.
      - ${DATA_LOCATION:-./data}/download:/mnt/qbittorrent-downloads
      - ${DATA_LOCATION:-./data}/comics:/mnt/library-comics
      - ${DATA_LOCATION:-./data}/manga:/mnt/library-manga
      - ${DATA_LOCATION:-./data}/download/books:/mnt/library-books
      - ${DATA_LOCATION:-./data}/download/audiobooks:/mnt/library-audiobooks
      - ./config/nextcloud/custom.config.php:/var/www/html/config/custom.config.php:ro
      - ./config/nextcloud/security-headers.conf:/etc/apache2/conf-enabled/security-headers.conf:ro
      - ./config/nextcloud/zz-opcache-jit.ini:/usr/local/etc/php/conf.d/zz-opcache-jit.ini:ro
      - ./config/nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      # The 0644 copy, not the 0600 original: redis.config.php keeps the
      # `_FILE` branch and re-reads it per request, so www-data needs it too.
      - ${DATA_LOCATION:-./data}/redis/redis-password:/run/secrets/redis_password:ro
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    networks:
      - frontend
      - nextcloud
      - assistant
    labels:
      - "homepage.group=Storage"
      - "homepage.name=Nextcloud"
      - "homepage.icon=nextcloud.png"
      - "homepage.href=https://nextcloud.${HOST_NAME:-pi.lan}"
      - "homepage.description=File sync and collaboration"
      - "homepage.widget.type=nextcloud"
      - "homepage.widget.url=https://nextcloud.${HOST_NAME:-pi.lan}"
      - "homepage.widget.username={{HOMEPAGE_VAR_NEXTCLOUD_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Nextcloud's own check wants SAMEORIGIN exactly; frame-deny sends DENY.
      - "traefik.http.middlewares.nextcloud-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-frame@docker,lan@docker"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.priority=10"
      # No lan@docker: this rule is the public surface, kept to what a share
      # page loads - assets only under /apps, /custom_apps and /core (never an
      # app's REST API), and the guest avatar only (/avatar/<mail> is an account
      # oracle). docs/SECURITY.md#per-service-protection.
      - "traefik.http.routers.nextcloud-public.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/s/`) || PathPrefix(`/public.php`) || PathPrefix(`/avatar/guest/`) || PathPrefix(`/dist/`) || PathPrefix(`/js/`) || PathPrefix(`/themes/`) || PathPrefix(`/apps/files_sharing/publicpreview`) || PathRegexp(`^/core/(css|js|img|fonts|l10n|vendor)/`) || PathRegexp(`^/(apps|custom_apps)/[^/]+/(css|js|img|fonts|l10n|vendor|theme|favicon|icon|manifest)/`) || PathPrefix(`/remote.php/dav/calendars/`) || PathPrefix(`/remote.php/dav/public-calendars/`))"
      - "traefik.http.routers.nextcloud-public.entrypoints=websecure"
      - "traefik.http.routers.nextcloud-public.middlewares=nextcloud-frame@docker"
      - "traefik.http.routers.nextcloud-public.tls=true"
      - "traefik.http.routers.nextcloud-public.priority=20"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      start_period: 60s
      start_interval: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpuset: "1-3"
    cpu_shares: *cpu-prio-normal
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  immich-server:
    <<: *service-defaults
    container_name: pi-immich
    profiles: ["immich-server", "all"]
    image: ghcr.io/immich-app/immich-server:v3.3.3
    volumes:
      - ${DATA_LOCATION:-./data}/immich:/data
      - ${DATA_LOCATION:-./data}/authelia-config/immich-oauth-config.yaml:/immich-oauth-config.yaml:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/redis_password:/run/secrets/redis_password:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: postgres
      DB_DATABASE_NAME: immich
      DB_USERNAME: immich
      DB_PASSWORD: ${PASSWORD}
      REDIS_HOSTNAME: redis
      # The file variant, so the password is not in docker inspect.
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      IMMICH_CONFIG_FILE: /immich-oauth-config.yaml
      IMMICH_TRUSTED_PROXIES: 172.30.11.250/32
      # `repo` and `io` are the expensive halves:
      # IMMICH_TELEMETRY_EXCLUDE=repo,io if the TSDB size cap starts biting.
      IMMICH_TELEMETRY_INCLUDE: all
      CPU_CORES: 3
      TZ: ${TIMEZONE:-Europe/Paris}
    networks:
      - frontend
      - immich
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - 2283
      # Metrics of the API and microservices workers, at their default ports.
      - 8081
      - 8082
    labels:
      - "homepage.group=Storage"
      - "homepage.name=Immich"
      - "homepage.icon=immich.png"
      - "homepage.href=https://immich.${HOST_NAME:-pi.lan}"
      - "homepage.description=Photo and video library"
      - "homepage.widget.type=immich"
      - "homepage.widget.url=http://pi-immich:2283"
      - "homepage.widget.key={{HOMEPAGE_FILE_IMMICH_API_KEY}}"
      - "homepage.widget.version=2"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.immich.rule=Host(`immich.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.routers.immich.priority=10"
      # No lan@docker: this rule is the public surface. Anonymous share requests
      # always carry `key` or `slug`, so the API paths are gated on that, never
      # on a blanket /api. Fails closed: validate any change off-tailnet.
      # docs/SECURITY.md#per-service-protection.
      - "traefik.http.routers.immich-public.rule=Host(`immich.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/share`) || PathPrefix(`/s/`) || PathPrefix(`/_app`) || Path(`/service-worker.js`) || Path(`/custom.css`) || Path(`/dark_skeleton.png`) || Path(`/api/server/config`) || Path(`/api/server/features`) || Path(`/api/server/media-types`) || ((PathPrefix(`/api/assets`) || PathPrefix(`/api/download`) || PathPrefix(`/api/timeline`) || PathPrefix(`/api/albums`)) && (QueryRegexp(`key`, `.+`) || QueryRegexp(`slug`, `.+`))))"
      - "traefik.http.routers.immich-public.entrypoints=websecure"
      # rate-limit-burst: a share page pulls one thumbnail per photo.
      - "traefik.http.routers.immich-public.middlewares=frame-deny@docker,rate-limit-burst@docker"
      - "traefik.http.routers.immich-public.tls=true"
      - "traefik.http.routers.immich-public.priority=20"
      # The share-password endpoints, on their own limiter: Immich throttles
      # nothing. Removed from immich-public's rule rather than outranked, so if
      # this router fails to load they fall to the lan@docker router, not the
      # burst limiter. ipv6subnet buckets a /64 together; a misspelt field is
      # silently ignored, so check /api/http/middlewares after an edit.
      - "traefik.http.middlewares.immich-share-limit.ratelimit.average=30"
      - "traefik.http.middlewares.immich-share-limit.ratelimit.burst=20"
      - "traefik.http.middlewares.immich-share-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.immich-share-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64"
      - "traefik.http.routers.immich-share-auth.rule=Host(`immich.${HOST_NAME:-pi.lan}`) && (Path(`/api/shared-links/me`) || Path(`/api/shared-links/login`))"
      - "traefik.http.routers.immich-share-auth.entrypoints=websecure"
      - "traefik.http.routers.immich-share-auth.middlewares=frame-deny@docker,immich-share-limit@docker"
      - "traefik.http.routers.immich-share-auth.tls=true"
      - "traefik.http.routers.immich-share-auth.priority=30"
      - "traefik.http.routers.immich-share-auth.service=immich"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    cpuset: "1-3"
    cpu_shares: *cpu-prio-normal
    mem_limit: 3072m
    memswap_limit: 3584m
    oom_score_adj: *oom-score-deprioritize

  immich-machine-learning:
    <<: *service-defaults
    container_name: pi-immich-machine-learning
    profiles: ["immich-machine-learning", "all"]
    labels:
      - "homepage.description=Face and object recognition for Immich"
      - "pi-pcloud.companion-of=immich-server"
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.1
    networks:
      - egress_immich
      - immich
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
      MACHINE_LEARNING_WORKERS: 2
      MACHINE_LEARNING_REQUEST_THREADS: 2
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS: 1
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 2
      MACHINE_LEARNING_MODEL_TTL: 180
      MACHINE_LEARNING_WORKER_TIMEOUT: 300
      MACHINE_LEARNING_ANN: "false"
      MACHINE_LEARNING_RKNN: "false"
    volumes:
      - immich_model_cache:/cache
    cpuset: "2-3"
    cpu_shares: *cpu-prio-idle
    mem_limit: 2g
    memswap_limit: 2560m
    oom_score_adj: *oom-score-deprioritize

  vaultwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.4
    container_name: pi-vaultwarden
    profiles: ["vaultwarden", "all"]
    # Not frontend: it has no east-west consumer.
    networks:
      - vaultwarden_web
      - vault
    expose:
      - 80
    # OIDC discovery through Traefik, on vaultwarden_web.
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.14.250"
    # Neither SSO_CLIENT_SECRET nor ADMIN_TOKEN has a *_FILE variant, so the
    # mounted secrets are exported before the image's /start.sh. ADMIN_TOKEN is
    # an Argon2id digest from scripts/vaultwarden-pre-start.sh, deliberately not
    # PASSWORD.
    entrypoint: ["sh", "-c", "export SSO_CLIENT_SECRET=$(cat /run/secrets/oidc_vaultwarden_secret) ADMIN_TOKEN=$(cat /run/secrets/admin_token_hash) && exec /start.sh"]
    environment:
      - DOMAIN=https://vault.${HOST_NAME:-pi.lan}
      - DATABASE_URL=postgresql://vaultwarden:${PASSWORD}@postgres/vaultwarden
      # Only the LAN allowlist is in front, so open registration would let
      # anyone on the tailnet create a vault. Invite from /admin instead.
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SSO_ENABLED=true
      - SSO_AUTHORITY=https://auth.${HOST_NAME:-pi.lan}
      - SSO_CLIENT_ID=vaultwarden
      - SSO_SCOPES=profile email offline_access
      # No native login, so everyone - emergency-access contacts included - must
      # exist in LLDAP. An invitation only creates a stub, claimed through
      # Authelia.
      - SSO_ONLY=true
      # Authelia rotates refresh tokens single-use with no grace period, and
      # Bitwarden clients refresh early: one lost response locks a client out
      # for good. So Authelia is only the way in, and the session is
      # Vaultwarden's own.
      - SSO_AUTH_ONLY_NOT_SESSION=true
      # Needs the SMTP below for its invite and takeover mails.
      - EMERGENCY_ACCESS_ALLOWED=true
      # starttls suits the default port 587; use force_tls on 465.
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${EMAIL:-noreply@localhost}
      - SMTP_FROM_NAME=Vaultwarden
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/vaultwarden:/data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_vaultwarden_secret.txt:/run/secrets/oidc_vaultwarden_secret:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/vaultwarden_admin_token_hash:/run/secrets/admin_token_hash:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "/healthcheck.sh"]
    labels:
      - "homepage.group=Security"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden.png"
      - "homepage.href=https://vault.${HOST_NAME:-pi.lan}"
      - "homepage.description=Bitwarden-compatible password manager"
      - "traefik.enable=true"
      - "traefik.docker.network=vaultwarden_web"
      # No authelia@docker: the browser extension and mobile apps cannot pass
      # the portal; they authenticate through OIDC (SSO_* above).
      #
      # Exempt from frame-deny: the API needs SAMEORIGIN, and the
      # *-connector.html pages, framed by the extension, need no frame header at
      # all (router below).
      - "traefik.http.middlewares.vaultwarden-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.middlewares=vaultwarden-frame@docker,lan@docker"
      - "traefik.http.routers.vaultwarden.tls=true"
      # Longer than the catch-all's rule, so it wins on rule-length priority.
      - "traefik.http.routers.vaultwarden-connector.rule=Host(`vault.${HOST_NAME:-pi.lan}`) && (Path(`/webauthn-connector.html`) || Path(`/sso-connector.html`))"
      - "traefik.http.routers.vaultwarden-connector.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-connector.middlewares=lan@docker"
      - "traefik.http.routers.vaultwarden-connector.tls=true"
      - "traefik.http.routers.vaultwarden-connector.service=vaultwarden"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    cpu_shares: *cpu-prio-normal
    mem_limit: 256m
    mem_reservation: 32m
    oom_score_adj: *oom-score-important

  # Its data is a copy of nothing: a repository pushed only here exists nowhere
  # else, so backrest takes both the database dump and the bare repositories.
  forgejo:
    <<: *service-defaults
    image: codeberg.org/forgejo/forgejo:17.0.0@sha256:06d38310de496a10186d952bdad5ca764c153c8023ede8dfa0944c79a1dc5412
    container_name: pi-forgejo
    profiles: ["forgejo", "all"]
    networks:
      # Traefik, and Forgejo's own outbound: OIDC discovery, mirrors, SMTP.
      - frontend
      - forge
      # The assistant's repositories, pushed by scripts/openclaw-sync.py.
      - assistant
    extra_hosts:
      # Forgejo validates the discovery URL when the auth source is created, so
      # scripts/forgejo-oidc-bootstrap.sh fails without this, not only sign-in.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 3000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # The image chowns /data to these: the host user, so a non-root `make
      # update` and backrest can still read it.
      - USER_UID=1000
      - USER_GID=1000
      # FORGEJO__<section>__<KEY> is written into app.ini on every start,
      # reverting edits made in the admin panel. The OIDC source lives in the
      # database instead (scripts/forgejo-oidc-bootstrap.sh).
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${PASSWORD}
      - FORGEJO__server__DOMAIN=git.${HOST_NAME:-pi.lan}
      - FORGEJO__server__ROOT_URL=https://git.${HOST_NAME:-pi.lan}/
      - FORGEJO__server__HTTP_PORT=3000
      # No git-over-SSH: it needs a published port, and Traefik is the only
      # ingress. HTTPS with an access token instead, which is why basic auth
      # stays on.
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__server__LFS_START_SERVER=true
      # Unlocked, the instance serves /install to the first caller.
      - FORGEJO__security__INSTALL_LOCK=true
      # Traefik alone: the loopback default attributes everything to the proxy,
      # and a wider range lets any frontend container choose the address Forgejo
      # records.
      - FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES=172.30.11.250/32
      # Accounts from OIDC only. DISABLE_REGISTRATION would block those too.
      - FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      # No forward-auth on the router, so without this anyone past lan@docker
      # could browse the repositories anonymously.
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=true
      - FORGEJO__service__ENABLE_NOTIFY_MAIL=true
      # LLDAP already vouches for the address.
      - FORGEJO__service__REGISTER_EMAIL_CONFIRM=false
      # OpenID 2.0, unrelated to OIDC: off, so there is one way in.
      - FORGEJO__openid__ENABLE_OPENID_SIGNIN=false
      - FORGEJO__openid__ENABLE_OPENID_SIGNUP=false
      - FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      # The LLDAP uid; the default `nickname` is a claim Authelia does not send.
      - FORGEJO__oauth2_client__USERNAME=preferred_username
      - FORGEJO__oauth2_client__ACCOUNT_LINKING=auto
      - FORGEJO__oauth2_client__UPDATE_AVATAR=false
      # No runner here, and a CI job is exactly the unbounded CPU load the
      # cpu_shares tiers keep away from DNS and the database.
      - FORGEJO__actions__ENABLED=false
      # The default, stated: a bleve index of every file costs more than it
      # saves on a Pi.
      - FORGEJO__indexer__REPO_INDEXER_ENABLED=false
      - FORGEJO__mailer__ENABLED=true
      - FORGEJO__mailer__PROTOCOL=smtp+starttls
      - FORGEJO__mailer__SMTP_ADDR=${SMTP_HOST:-localhost}
      - FORGEJO__mailer__SMTP_PORT=${SMTP_PORT:-587}
      - FORGEJO__mailer__USER=${SMTP_USERNAME:-}
      - FORGEJO__mailer__PASSWD=${SMTP_PASSWORD:-}
      - FORGEJO__mailer__FROM=${EMAIL:-noreply@localhost}
    volumes:
      - ${DATA_LOCATION:-./data}/forgejo:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-default
      # /api/healthz pings the database and the cache, unlike GET /.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      start_period: 60s
    labels:
      - "homepage.group=Storage"
      - "homepage.name=Forgejo"
      - "homepage.icon=forgejo.png"
      - "homepage.href=https://git.${HOST_NAME:-pi.lan}"
      - "homepage.description=Self-hosted git forge"
      # No homepage.widget: Homepage has none for Forgejo.
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # No authelia@docker: git and /api/v1 clients send a token over basic auth
      # (REQUIRE_SIGNIN_VIEW closes anonymous browsing). frame-deny is required:
      # Forgejo sends no frame policy of its own.
      - "traefik.http.routers.forgejo.rule=Host(`git.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.forgejo.tls=true"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
    cpu_shares: *cpu-prio-batch
    # The headroom is for the `git gc` the built-in cron forks.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # The family chat: a Matrix homeserver for Element Web (below) and Element X.
  # An embedded RocksDB, so no Postgres role and no Redis.
  tuwunel:
    <<: *service-defaults
    image: ghcr.io/matrix-construct/tuwunel:v1.9.4@sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec
    container_name: pi-tuwunel
    # openclaw too: the assistant is a bot account here.
    profiles: ["tuwunel", "openclaw", "all"]
    # Root, but with no capability beyond DAC_READ_SEARCH (to read the 0600
    # client secret) and a read-only rootfs. Not uid 1000: new named volumes are
    # root-owned, and this Nix image offers no other owner to copy.
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    # The first start after an upgrade can run a RocksDB migration, and a kill
    # half-way leaves a database no admin command repairs. A normal stop takes
    # under a second.
    stop_grace_period: 30m
    networks:
      - frontend
      - assistant
    extra_hosts:
      # Fetched at the first sign-in. ip_range_denylist, whose default covers
      # 172.16.0.0/12, does not refuse it (verified at v1.9.3).
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 8008
    environment:
      # Permanent: the suffix of every user and room ID. chat.<HOST_NAME> rather
      # than the apex, so no /.well-known delegation has to be served there.
      - TUWUNEL_SERVER_NAME=chat.${HOST_NAME:-pi.lan}
      # The default is loopback only.
      - TUWUNEL_ADDRESS=0.0.0.0
      # LAN and tailnet only, like the router: there is no one to federate with.
      - TUWUNEL_ALLOW_FEDERATION=false
      # Upstream appends an emoji to every new display name by default.
      - TUWUNEL_NEW_USER_DISPLAYNAME_SUFFIX=
      # Otherwise journald stores the escape codes verbatim.
      - TUWUNEL_LOG_COLORS=false
      # Upstream's 24 MiB refuses many of the videos a phone records.
      - TUWUNEL_MAX_REQUEST_SIZE=100 MiB
      # The default (128 + 64 per core) would outgrow mem_limit.
      - TUWUNEL_DB_CACHE_CAPACITY_MB=128
      # Uploads in their own volume, so backrest never reads the live RocksDB.
      - TUWUNEL_STORAGE_PROVIDER__MEDIA__LOCAL__BASE_PATH=/var/lib/tuwunel-media
      # Also the issuer of the built-in OAuth server, which Element X signs in
      # through and Tuwunel brokers to Authelia.
      - TUWUNEL_WELL_KNOWN__CLIENT=https://chat.${HOST_NAME:-pi.lan}
      # An online backup on SIGUSR2, sent by tuwunel-backup.timer before
      # backrest's snapshot: backrest has no Docker socket, and a live RocksDB
      # copied file by file does not restore.
      - TUWUNEL_DATABASE_BACKUP_PATH=/var/lib/tuwunel-backups
      - TUWUNEL_DATABASE_BACKUPS_TO_KEEP=2
      - TUWUNEL_ADMIN_SIGNAL_EXECUTE=["server backup-database"]
      # Accounts are created on the first SSO sign-in (password registration
      # stays off), and the first one becomes server admin: the owner signs in
      # first.
      - TUWUNEL_IDENTITY_PROVIDER__0__BRAND=Authelia
      # Stored identities hang off it: renaming it orphans every account.
      - TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_ID=tuwunel
      - TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_SECRET_FILE=/run/secrets/oidc_tuwunel_secret
      - TUWUNEL_IDENTITY_PROVIDER__0__ISSUER_URL=https://auth.${HOST_NAME:-pi.lan}
      - TUWUNEL_IDENTITY_PROVIDER__0__CALLBACK_URL=https://chat.${HOST_NAME:-pi.lan}/_matrix/client/unstable/login/sso/callback/tuwunel
      - TUWUNEL_IDENTITY_PROVIDER__0__DEFAULT=true
      # Refuse the sign-in rather than invent a localpart when
      # preferred_username is unusable.
      - TUWUNEL_IDENTITY_PROVIDER__0__UNIQUE_ID_FALLBACKS=false
      # For the assistant's bot account (scripts/tuwunel-pre-start.sh). Traefik
      # routes no /_synapse path, so only a container on Tuwunel's networks can
      # call it.
      - TUWUNEL_REGISTRATION_SHARED_SECRET_FILE=/run/secrets/registration_shared_secret
    volumes:
      - tuwunel_data:/var/lib/tuwunel
      - tuwunel_media:/var/lib/tuwunel-media
      - tuwunel_backups:/var/lib/tuwunel-backups
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_tuwunel_secret.txt:/run/secrets/oidc_tuwunel_secret:ro
      - ${DATA_LOCATION:-./data}/tuwunel-secrets/registration_shared_secret:/run/secrets/registration_shared_secret:ro
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "tuwunel", "--health-check"]
      # As long as stop_grace_period: an `unhealthy` mid-migration invites the
      # restart that kills it.
      start_period: 30m
    labels:
      - "homepage.group=Communication"
      - "homepage.name=Chat"
      - "homepage.icon=element.png"
      - "homepage.href=https://chat.${HOST_NAME:-pi.lan}"
      - "homepage.description=Family chat (Matrix)"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # The Matrix API shares chat.<HOST_NAME> with Element under the prefixes a
      # client calls (the longer rule wins), plus the OAuth discovery document
      # at its issuer. No authelia@docker: clients hold a Matrix token, not a
      # session.
      - "traefik.http.routers.tuwunel.rule=Host(`chat.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_tuwunel`) || PathPrefix(`/.well-known/matrix`) || Path(`/.well-known/openid-configuration`))"
      - "traefik.http.routers.tuwunel.entrypoints=websecure"
      - "traefik.http.routers.tuwunel.middlewares=lan@docker"
      - "traefik.http.routers.tuwunel.tls=true"
      - "traefik.http.services.tuwunel.loadbalancer.server.port=8008"
    cpu_shares: *cpu-prio-normal
    # The headroom is for the 128 MB block cache filling as history grows.
    mem_limit: 384m
    oom_score_adj: *oom-score-deprioritize

  element:
    <<: *service-defaults
    image: ghcr.io/element-hq/element-web:v1.12.32@sha256:f8700633d4336258af7a05b53865a4f479e0d628cf2d9ca83d28b5939314d4ce
    container_name: pi-element
    # Started with tuwunel too: a homeserver with no web client is not the chat
    # anyone enabled.
    profiles: ["element", "tuwunel", "openclaw", "all"]
    # Static files behind an unprivileged nginx. The entrypoint renders conf.d
    # on every start, hence its tmpfs.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d:uid=101,gid=101
    networks:
      - frontend
    expose:
      - 8080
    environment:
      # Above 1024, so the unprivileged nginx needs no capability to bind it.
      - ELEMENT_WEB_PORT=8080
    volumes:
      # Rendered by scripts/element-pre-start.sh from config/element/.
      - ${DATA_LOCATION:-./data}/element/config.json:/app/config.json:ro
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/config.json"]
    labels:
      - "homepage.description=Web client for the family chat"
      - "pi-pcloud.companion-of=tuwunel"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # SAMEORIGIN, not frame-deny: downloads, Jitsi and widgets are same-origin
      # iframes.
      - "traefik.http.middlewares.element-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.routers.element.rule=Host(`chat.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.element.entrypoints=websecure"
      - "traefik.http.routers.element.middlewares=element-frame@docker,lan@docker"
      - "traefik.http.routers.element.tls=true"
      - "traefik.http.services.element.loadbalancer.server.port=8080"
    cpu_shares: *cpu-prio-batch
    mem_limit: 64m
    oom_score_adj: *oom-score-deprioritize

  n8n:
    <<: *service-defaults
    image: n8nio/n8n:2.44.4
    container_name: pi-n8n
    profiles: ["n8n", "n8n-runners", "all"]
    expose:
      - 5678
    labels:
      - "homepage.group=Automation"
      - "homepage.name=n8n"
      - "homepage.icon=n8n.png"
      - "homepage.href=https://n8n.${HOST_NAME:-pi.lan}"
      - "homepage.description=Workflow automation"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    environment:
      - N8N_HOST=n8n.${HOST_NAME:-pi.lan}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${HOST_NAME:-pi.lan}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-${TIMEZONE:-Europe/Paris}}
      - TZ=${TIMEZONE:-Europe/Paris}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      - DB_TYPE=sqlite
      - DB_SQLITE_POOL_SIZE=2
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=${SMTP_HOST:-localhost}
      - N8N_SMTP_PORT=${SMTP_PORT:-587}
      - N8N_SMTP_USER=${SMTP_USERNAME:-}
      - N8N_SMTP_PASS=${SMTP_PASSWORD:-}
      - N8N_SMTP_SENDER=${EMAIL:-noreply@localhost}
      - N8N_SMTP_SSL=${SMTP_SSL:-false}
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      # No separate listener and no gate: n8n.$HOST_NAME/metrics is readable
      # past lan@docker. N8N_METRICS_INCLUDE_* stay off, so no workflow names.
      # docs/MONITORING.md#what-enabling-metrics-exposes.
      - N8N_METRICS=true
      - NODE_OPTIONS=--max-old-space-size=512
    # N8N_RUNNERS_AUTH_TOKEN, from scripts/n8n-pre-start.sh: the broker listens
    # on frontend, and this keeps other containers from registering as runners.
    env_file:
      - path: ./config/n8n/n8n.env
        required: false
    volumes:
      - n8n_data:/home/node/.n8n
      - ${DATA_LOCATION:-./data}/n8n:/files
    networks:
      - frontend
      - n8n_runners
    depends_on:
      - traefik
    healthcheck:
      <<: *healthcheck-default
      # 127.0.0.1, not localhost, which resolves to ::1 here.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
    cpu_shares: *cpu-prio-normal
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  n8n-runners:
    <<: *service-defaults
    image: n8nio/runners:2.44.4
    container_name: pi-n8n-runners
    profiles: ["n8n-runners", "all"]
    labels:
      - "homepage.description=Sandboxed task runner for n8n"
      - "pi-pcloud.companion-of=n8n"
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    # Same generated secret as the broker above; see scripts/n8n-pre-start.sh.
    env_file:
      - path: ./config/n8n/n8n.env
        required: false
    networks:
      - n8n_runners
    depends_on:
      - n8n
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5680/healthz && nc -z -w 2 n8n 5679"]
      start_period: 5s
      start_interval: 3s
    cpu_shares: *cpu-prio-normal
    mem_limit: 256m
    oom_score_adj: *oom-score-deprioritize

  ntfy:
    <<: *service-defaults
    image: binwiederhier/ntfy:v2.32.0
    container_name: pi-ntfy
    command: serve
    networks:
      - frontend
      - ntfy
    expose:
      - 80
      - 9090
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Not NTFY_ENABLE_METRICS, which would put /metrics on the routed :80. Set
      # here because ntfy-pre-start.sh rewrites the env file whole.
      - NTFY_METRICS_LISTEN_HTTP=:9090
      - NTFY_BASE_URL=https://ntfy.${HOST_NAME:-pi.lan}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_ENABLE_LOGIN=true
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      # Internal publishers share ntfy's stock per-IP bucket, and a burst past
      # it drops messages, health alerts included. The whole /16: the `ntfy`
      # network takes its subnet from the daemon pool. The internet stays
      # limited: behind the proxy the limiter keys on X-Forwarded-For, which
      # Traefik overwrites. A typo here is only a startup WARN.
      - NTFY_VISITOR_REQUEST_LIMIT_EXEMPT_HOSTS=172.30.0.0/16
      - NTFY_SMTP_SENDER_ADDR=${SMTP_HOST:-localhost}:${SMTP_PORT:-587}
      - NTFY_SMTP_SENDER_USER=${SMTP_USERNAME:-}
      - NTFY_SMTP_SENDER_PASS=${SMTP_PASSWORD:-}
      - NTFY_SMTP_SENDER_FROM=${EMAIL:-noreply@localhost}
    env_file:
      - path: ./config/ntfy/ntfy.env
        required: false
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    labels:
      - "homepage.group=Notifications"
      - "homepage.name=ntfy"
      - "homepage.icon=ntfy.png"
      - "homepage.href=https://ntfy.${HOST_NAME:-pi.lan}"
      - "homepage.description=Push notifications"
      - "homepage.widget.type=ntfy"
      - "homepage.widget.url=http://pi-ntfy"
      # The widget reads one topic; downloads and security are phone-only.
      - "homepage.widget.topic=monitoring"
      - "homepage.widget.username={{HOMEPAGE_VAR_ADMIN_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.ntfy.tls=true"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/v1/health"]
    cpu_shares: *cpu-prio-critical
    mem_limit: 128m
    mem_reservation: 32m
    oom_score_adj: *oom-score-important
