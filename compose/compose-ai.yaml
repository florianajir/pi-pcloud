# The local inference stack - one model server per modality - the gateway in
# front of it, and the family assistant.
#
# Included by compose.yaml, which declares the networks and volumes and holds
# the canonical x- anchors these are copies of (tests/compose-invariants.py
# fails if one drifts: change compose.yaml first).

x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s
x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  # Inference backend for open-webui: Gemma 4 E2B on the CPU. llama.cpp's own
  # server rather than Ollama, which wraps the same engine in a model registry
  # and per-request runners. docs/AI.md#the-model.
  llama-cpp:
    <<: *service-defaults
    image: ghcr.io/ggml-org/llama.cpp:server-b10481
    container_name: pi-llama-cpp
    profiles: ["llama-cpp", "all"]
    networks:
      - ai
    expose:
      - 8080
    environment:
      # Seeded by scripts/llama-cpp-pre-start.sh: the ai network is internal,
      # and OFFLINE stops the server from trying to fetch.
      - LLAMA_ARG_MODEL=/models/gemma-4-E2B-it-qat-Q4_0.gguf
      # No LLAMA_ARG_MMPROJ: the projector costs ~1 GB of anonymous memory for
      # an image input nothing offers. docs/AI.md.
      - LLAMA_ARG_OFFLINE=1
      # Speculative decoding off Gemma 4's multi-token-prediction head: CPU
      # generation is bandwidth bound, so verifying drafted tokens is nearly
      # free - about twice the speed, identical output.
      - LLAMA_ARG_SPEC_DRAFT_MODEL=/models/mtp-gemma-4-E2B-it-Q4_0.gguf
      - LLAMA_ARG_SPEC_TYPE=draft-mtp
      - LLAMA_ARG_ALIAS=gemma-4-e2b-it
      - LLAMA_ARG_PORT=8080
      # A fourth thread measured no faster (bandwidth bound), and leaving core 0
      # alone keeps traefik, pihole and unbound responsive during a chat.
      - LLAMA_ARG_THREADS=3
      - LLAMA_ARG_FLASH_ATTN=on
      # The model goes to 128k, which no Pi has the RAM for. The KV cache stays
      # f16: quantising it cost ~10% speed for no memory worth having.
      - LLAMA_ARG_CTX_SIZE=16384
      # Thinking off: at this speed it is a minute of empty window before an
      # answer. --reasoning-budget 0 is NOT equivalent: the model then reasons
      # in the visible answer.
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"enable_thinking":false}'
      # Requests queue rather than split the three threads: two parallel slots
      # each ran at half speed.
      - LLAMA_ARG_N_PARALLEL=1
      # open-webui is the routed frontend; keep the surface down to the API.
      - LLAMA_ARG_UI=false
      - LLAMA_ARG_ENDPOINT_METRICS=1
    volumes:
      - llama_models:/models
    healthcheck:
      <<: *healthcheck-relaxed
      # /health is 503 while the weights load, 200 once a slot is free.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      start_period: 120s
      start_interval: 5s
    labels:
      # No homepage.href: an API, not a page. mdi- icons: dashboard-icons has
      # none for these.
      - "homepage.group=AI"
      - "homepage.name=llama.cpp"
      - "homepage.description=Local language model engine"
      - "homepage.icon=mdi-brain"
    cpu_shares: *cpu-prio-idle
    cpuset: "1-3"
    # mmap is only half of it: ~1.8G is anonymous (repacked weights, KV cache,
    # compute buffers) on top of the mapped model file.
    mem_limit: 6g
    memswap_limit: 8g
    oom_score_adj: *oom-score-deprioritize

  # Text-to-speech for open-webui's read-aloud button. Built here: upstream
  # publishes no image, and config/piper/openai_api.py translates its protocol
  # to the OpenAI shape open-webui calls.
  piper:
    <<: *service-defaults
    build:
      context: ./config/piper
      dockerfile: Dockerfile
    image: pi-piper:local
    container_name: pi-piper
    profiles: ["piper", "all"]
    networks:
      - ai
    expose:
      - 8000
    environment:
      # open-webui asks for OpenAI voice names, none of which exist here, so
      # this picks the voice. It has to be in the image (VOICES build arg);
      # PIPER_DEFAULT_VOICE names one outright.
      - PIPER_DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en-US}
    healthcheck:
      <<: *healthcheck-relaxed
      # No curl or wget in the image.
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 30s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Piper"
      - "homepage.description=Text-to-speech engine"
      - "homepage.icon=mdi-text-to-speech"
    cpu_shares: *cpu-prio-idle
    cpuset: "1-3"
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # Speech-to-text for open-webui's microphone, instead of the whisper bundled
  # in open-webui: docs/AI.md#speech-to-text-parakeet. Built here: upstream
  # publishes no image and onnx-asr has no server
  # (config/parakeet/openai_api.py).
  parakeet:
    <<: *service-defaults
    build:
      context: ./config/parakeet
      dockerfile: Dockerfile
    image: pi-parakeet:local
    container_name: pi-parakeet
    profiles: ["parakeet", "all"]
    networks:
      - ai
    expose:
      - 8000
    environment:
      # Must match the Dockerfile build arg. fp32 is more accurate but doubles
      # the resident memory and the download.
      - PARAKEET_QUANTIZATION=int8
      # Matches the cpuset: onnxruntime would size its pool from the host's four
      # cores.
      - PARAKEET_THREADS=3
    healthcheck:
      <<: *healthcheck-relaxed
      # /health is 503 until the model is resident, ~5s from start.
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 60s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Parakeet"
      - "homepage.description=Speech-to-text engine"
      - "homepage.icon=mdi-microphone-message"
    cpu_shares: *cpu-prio-idle
    cpuset: "1-3"
    # ~1.2 GB resident for the int8 weights and the onnxruntime arena, plus the
    # encoder's working set on a full window.
    mem_limit: 2560m
    memswap_limit: 3584m
    oom_score_adj: *oom-score-deprioritize

  # Serves the host's status to the local model as an OpenAPI tool; see
  # config/system-tools/app.py. / is mounted at /hostfs because statvfs cannot
  # measure a filesystem this process cannot see.
  system-tools:
    <<: *service-defaults
    build:
      context: ./config/system-tools
      dockerfile: Dockerfile
    image: pi-system-tools:local
    container_name: pi-system-tools
    profiles: ["system-tools", "all"]
    networks:
      - ai
      # headscale's node API listens on frontend only. Egress only: nothing here
      # takes a URL, while headscale on `ai` would reach the segment where
      # open-webui runs admin-supplied Python.
      - frontend
    expose:
      - 8000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Derived from the directory name, so it cannot be guessed in-container.
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-pi-web}
      # Backrest's own log: the repos are remote, and restic would want their
      # password. Read off the bind mount below, not /hostfs, as DATA_LOCATION
      # may be relative.
      - BACKREST_OPLOG=/run/backrest/oplog.sqlite
      - HEADSCALE_URL=http://pi-headscale:8080
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      # rslave, or unplugging /mnt/usbdrive fails while this container runs.
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          propagation: rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The directory, not the oplog file: it does not exist before backrest's
      # first run, and Docker would create a directory in its place.
      - ${DATA_LOCATION:-./data}/backrest/data:/run/backrest:ro
      # The key Homepage's widget uses, so both break together when it expires.
      # scripts/headscale-pre-start.sh keeps the path a file.
      - ./config/homepage/secrets/headscale_api_key:/run/secrets/headscale_api_key:ro
    healthcheck:
      <<: *healthcheck-relaxed
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 20s
    labels:
      - "homepage.group=AI"
      - "homepage.name=System Tools"
      - "homepage.description=Host status tools for the local AI"
      - "homepage.icon=mdi-tools"
    # No cpuset: a call only runs while llama-cpp waits for its result.
    cpu_shares: *cpu-prio-normal
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  open-webui:
    <<: *service-defaults
    image: ghcr.io/open-webui/open-webui:v0.12.4
    container_name: pi-open-webui
    profiles: ["open-webui", "all"]
    networks:
      - frontend
      - ai
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.1"
    expose:
      - 8080
    # Plain assignments, not `export X=$(...)`: export's own status masks a
    # failed substitution. `sk-` matches what agentgateway-pre-start.sh writes
    # into LLM_API_KEY; OPENAI_API_KEY is PersistentConfig, so a wrong first
    # value sticks in the database.
    entrypoint: ["bash", "-euc", "OAUTH_CLIENT_SECRET=$(cat /run/secrets/oidc_open-webui_secret); OPENAI_API_KEY=sk-$(cat /run/secrets/agentgateway_llm_key); export OAUTH_CLIENT_SECRET OPENAI_API_KEY; exec bash start.sh"]
    environment:
      # In the data volume: at the default path, inside the image, every
      # recreate minted a new key and logged everyone out.
      - WEBUI_SECRET_KEY_FILE=/app/backend/data/.webui_secret_key
      - WEBUI_AUTH=true
      - ENABLE_LOGIN_FORM=false
      - CORS_ALLOW_ORIGIN=https://ai.${HOST_NAME:-pi.lan}
      - ENABLE_OAUTH_SIGNUP=true
      # Authelia already gates who gets in; `pending` would park every SSO
      # login.
      - DEFAULT_USER_ROLE=user
      - OAUTH_CLIENT_ID=open-webui
      - OPENID_PROVIDER_URL=https://auth.${HOST_NAME:-pi.lan}/.well-known/openid-configuration
      - OAUTH_PROVIDER_NAME=Authelia
      - OAUTH_SCOPES=openid profile email
      - OAUTH_USERNAME_CLAIM=preferred_username
      # Authelia's portal logout, as it has no end_session_endpoint.
      # docs/SECURITY.md.
      - WEBUI_AUTH_SIGNOUT_REDIRECT_URL=https://auth.${HOST_NAME:-pi.lan}/logout?rd=https%3A%2F%2Fai.${HOST_NAME:-pi.lan}%2Fauth
      - DATABASE_URL=postgresql://open-webui:${PASSWORD}@postgres/open-webui
      # Through agentgateway, so a model added there appears here. The key is
      # read from the same file the gateway's apiKey policy uses.
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://agentgateway:4000/v1
      # No Ollama: left on, it probes localhost:11434 on every model list.
      - ENABLE_OLLAMA_API=false
      - DEFAULT_LOCALE=${DEFAULT_LANGUAGE:-en-US}
      # PersistentConfig: applied on a fresh instance only, and
      # scripts/open-webui-bootstrap.sh carries these to an existing one. The
      # base URL is required: it defaults to OPENAI_API_BASE_URL, the gateway.
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://parakeet:8000/v1
      - AUDIO_STT_MODEL=parakeet-tdt-0.6b-v3
      - AUDIO_STT_OPENAI_API_KEY=parakeet
      # Required: it falls back to OPENAI_API_KEY, which would ship the gateway
      # credential to piper on every read-aloud.
      - AUDIO_TTS_OPENAI_API_KEY=piper
      # PersistentConfig too, like the STT settings above.
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      # No `?q=<query>`: the client strips the query string anyway. It sends
      # format=json, which config/searxng/settings.yml has to allow.
      - SEARXNG_QUERY_URL=http://searxng:8080/search
      # `all`: SearXNG wants its own locale names, not DEFAULT_LANGUAGE's BCP-47
      # tag.
      - SEARXNG_LANGUAGE=all
      # Each result is a page this Pi fetches and embeds; five is the most a
      # chat waits for.
      - WEB_SEARCH_RESULT_COUNT=5
      # 0 means unlimited: every page at once, on cores shared with the model.
      - WEB_SEARCH_CONCURRENT_REQUESTS=2
    volumes:
      - open_webui_data:/app/backend/data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_open-webui_secret.txt:/run/secrets/oidc_open-webui_secret:ro
      # The file, not its directory: the sibling cookie_secret signs the
      # gateway's admin session cookie.
      - ${DATA_LOCATION:-./data}/agentgateway/secrets/llm_api_key:/run/secrets/agentgateway_llm_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Where the wait for llama-cpp is. service_started: the gateway image is
      # distroless and has no healthcheck.
      agentgateway:
        condition: service_started
        required: false
      # service_started: on the relaxed healthcheck its first probe comes two
      # minutes in, for a tool only ever called mid-conversation.
      system-tools:
        condition: service_started
        required: false
    healthcheck:
      <<: *healthcheck-relaxed
      test: ["CMD", "curl", "-fsS", "http://localhost:8080"]
      start_period: 60s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Open WebUI"
      - "homepage.href=https://ai.${HOST_NAME:-pi.lan}"
      - "homepage.description=AI chat interface"
      - "homepage.icon=open-webui.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.open-webui.rule=Host(`ai.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    cpu_shares: *cpu-prio-idle
    # torch and the RAG embedding model hold ~640M from boot, and a web search
    # embeds the fetched pages on top.
    mem_limit: 1536m
    memswap_limit: 2g
    oom_score_adj: *oom-score-deprioritize

  # The one gateway to every model and tool: an OpenAI-compatible /v1, an MCP
  # endpoint and the UI to add either, all on :4000.
  # docs/AI.md#the-gateway-agentgateway.
  agentgateway:
    <<: *service-defaults
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    container_name: pi-agentgateway
    # Started with open-webui and openclaw, which have no model without it.
    profiles: ["agentgateway", "open-webui", "openclaw", "all"]
    # The image runs as 65532, which cannot write a data directory the project
    # owner must stay able to read; 1000 is what every PUID here assumes.
    user: "1000:1000"
    networks:
      - frontend
      - ai
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 4000
      # The stats listener, on by default; this only opens it to Prometheus.
      - 15020
    command: ["-f", "/config.yaml"]
    environment:
      # Expanded by agentgateway inside /config.yaml, not by Compose.
      - HOST_NAME=${HOST_NAME:-pi.lan}
      # Provider keys. A placeholder rather than empty: an empty backendAuth key
      # exits 1. Here, not in the env file, which agentgateway-pre-start.sh
      # rewrites whole.
      - GROQ_API_KEY=${GROQ_API_KEY:-unset}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-unset}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-unset}
      # No AGENT_API_KEY above: a placeholder for a client credential would be a
      # password readable in this file.
    env_file:
      # OIDC_COOKIE_SECRET, UI_CLIENT_SECRET and the client keys, from
      # scripts/agentgateway-pre-start.sh. Frozen at creation: `up -d` after a
      # rotation, not `restart`.
      - path: ./config/agentgateway/agentgateway.env
        required: false
    volumes:
      - ./config/agentgateway/config.yaml:/config.yaml:ro
      - ${DATA_LOCATION:-./data}/agentgateway:/data
    depends_on:
      # Both healthy: it fetches the OIDC discovery document at startup and
      # exits when that fails, and the issuer resolves through Traefik.
      authelia:
        condition: service_healthy
      traefik:
        condition: service_healthy
      # service_started: no model backend is probed at boot.
      llama-cpp:
        condition: service_started
        required: false
    # No healthcheck: the image is distroless. Uptime Kuma's docker monitor only
    # proves the process lives; its `route llm` monitor is the readiness probe.
    labels:
      - "homepage.group=AI"
      - "homepage.name=Agentgateway"
      - "homepage.href=https://llm.${HOST_NAME:-pi.lan}/ui"
      - "homepage.description=LLM and MCP gateway"
      - "homepage.icon=agentgateway.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.agentgateway.rule=Host(`llm.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.agentgateway.entrypoints=websecure"
      # No authelia@docker: the gateway runs its own OIDC flow, whose
      # /oauth/callback forward-auth would intercept.
      - "traefik.http.routers.agentgateway.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.agentgateway.tls=true"
      - "traefik.http.services.agentgateway.loadbalancer.server.port=4000"
    cpu_shares: *cpu-prio-idle
    # The LLM route buffers whole request bodies, up to the 32 MiB
    # frontendPolicies limit.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # The family assistant: an OpenClaw agent per person, @assistant in the Matrix
  # chat. docs/AI.md#the-family-assistant-openclaw.
  #
  # Isolated rather than sandboxed: no tool that executes anything
  # (scripts/openclaw-pre-start.py), and no route out, no socket, no host path
  # but its own config, no capability.
  openclaw:
    <<: *service-defaults
    image: ghcr.io/openclaw/openclaw:2026.10.7@sha256:fb26f0841659dc757f23feec9adeab51f11d76779a409db5d22e191b43841afa
    container_name: pi-openclaw
    profiles: ["openclaw", "all"]
    # Not the image's docker-entrypoint.mjs: its `openclaw doctor --fix`
    # refreshes plugins from npm on every start and exits 1 on the read-only
    # config. scripts/openclaw-bootstrap.py installs them at the image's version
    # instead.
    entrypoint: ["tini", "-s", "--"]
    command: ["node", "openclaw.mjs", "gateway"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      # An explicit owner: a bare tmpfs comes back root-owned on `restart`, and
      # the gateway then dies on "Unable to create fallback OpenClaw temp dir".
      - /home/node/.cache:uid=1000,gid=1000,mode=0700
      - /home/node/.config:uid=1000,gid=1000,mode=0700
      - /home/node/.npm:uid=1000,gid=1000,mode=0700
    networks:
      # agentgateway. The agent has no tool that fetches a URL.
      - ai
      # Tuwunel, Forgejo and Nextcloud. Both segments are internal: no egress.
      - assistant
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Rendered by scripts/openclaw-pre-start.py and mounted read-only, closing
      # model-driven `config.patch` (GHSA-v3qc-wrwx-j3pw, GHSA-cwj3-vqpp-pmxr).
      - OPENCLAW_CONFIG_READONLY=1
      - OPENCLAW_NO_AUTO_UPDATE=1
      - DO_NOT_TRACK=1
    env_file:
      # The gateway token, the bot's Matrix password and its gateway key, from
      # scripts/openclaw-pre-start.py. Frozen at creation: `up -d` after a
      # rotation.
      - path: ./config/openclaw/openclaw.env
        required: false
    volumes:
      - openclaw_state:/home/node/.openclaw
      - ${DATA_LOCATION:-./data}/openclaw/openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ./config/openclaw/skills:/opt/household-skills:ro
      # The stack's Nextcloud plugin and the per-person app passwords it acts
      # with, outside every workspace so no agent's file tools reach them.
      - ./config/openclaw/plugins:/opt/household-plugins:ro
      - ${DATA_LOCATION:-./data}/openclaw/secrets/nextcloud:/run/nextcloud-tokens:ro
    depends_on:
      tuwunel:
        condition: service_healthy
      # service_started: agentgateway has no healthcheck.
      agentgateway:
        condition: service_started
    # Turns drain before the Matrix client closes and writes its crypto
    # snapshot; a SIGKILL mid-turn corrupts it (upstream issue #158784).
    stop_grace_period: 2m
    healthcheck:
      <<: *healthcheck-relaxed
      # Liveness only: a disconnected Matrix channel shows on /readyz.
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      start_period: 120s
    labels:
      - "homepage.group=Communication"
      - "homepage.name=Assistant"
      - "homepage.icon=mdi-robot-outline"
      - "homepage.href=https://chat.${HOST_NAME:-pi.lan}"
      - "homepage.description=Family assistant, @assistant in the chat"
    cpu_shares: *cpu-prio-normal
    # ~1.6 GiB peak in a turn, and every `openclaw` CLI call is a second Node
    # process in this cgroup: 2g left a turn plus a CLI call short of an OOM.
    mem_limit: 2560m
    mem_reservation: 1g
    oom_score_adj: *oom-score-deprioritize
