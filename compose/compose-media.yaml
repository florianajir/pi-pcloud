# Downloads behind the VPN, Stremio and its addons, and the reading and
# listening libraries.
#
# Included by compose.yaml, which declares the networks and volumes and holds
# the canonical x- anchors these are copies of (tests/compose-invariants.py
# fails if one drifts: change compose.yaml first).

x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s
x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

# Stremio runs in one of two mutually exclusive modes, stremio or stremio-lan.
# `network_mode` and `networks` cannot coexist and a merge key cannot remove a
# key, so each mode is a thin service over this shared body.
x-stremio-common: &stremio-common
  <<: *service-defaults
  image: stremio/server:v4.22.2
  environment:
    - NO_CORS=1
    - TZ=${TIMEZONE:-Europe/Paris}
    # The image installs jellyfin-ffmpeg but leaves these empty, off PATH:
    # without them the server cannot remux at all.
    - FFMPEG_BIN=/usr/lib/jellyfin-ffmpeg/ffmpeg
    - FFPROBE_BIN=/usr/lib/jellyfin-ffmpeg/ffprobe
    # Must be empty: only its truthiness is read, so "0" still disables casting.
    # At the image's default, /casting answers 404.
    - CASTING_DISABLED=
  volumes:
    - stremio_data:/root/.stremio-server
  healthcheck:
    <<: *healthcheck-default
    test: ["CMD", "curl", "-f", "http://localhost:11470/"]
    start_period: 30s
  cpu_shares: *cpu-prio-normal
  mem_limit: 1024m
  oom_score_adj: *oom-score-deprioritize

services:
  gluetun:
    <<: *service-defaults
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: pi-gluetun
    profiles: ["gluetun", "qbittorrent", "stremio", "kapowarr", "all"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      frontend:
        # Shelfmark's bypasser hands this to SeleniumBase, whose proxy
        # validation rejects a dotless host and then fails to start the browser.
        aliases:
          - gluetun.docker
    expose:
      - 8080
      - 11470
      - 12470
      - 5656
      - 8000
      - 8888
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Lets the Homepage widget read the public IP and port-forward status
      # without credentials; see the file.
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/gluetun/custom/auth-config.toml
      # For Shelfmark's direct downloads, plain HTTPS rather than torrents, at
      # gluetun:8888. Gluetun forwards it only over the VPN interface.
      - HTTPPROXY=on
    env_file:
      - path: ./config/gluetun/gluetun.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/gluetun:/gluetun
      - ./config/gluetun:/gluetun/custom:ro
    labels:
      - "homepage.group=Privacy"
      - "homepage.name=Gluetun"
      - "homepage.icon=gluetun.png"
      - "homepage.href=https://gluetun.${HOST_NAME:-pi.lan}"
      - "homepage.description=VPN tunnel for downloads and streaming"
      - "homepage.widget.type=gluetun"
      - "homepage.widget.url=http://pi-gluetun:8000"
      - "homepage.widget.version=2"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.http.routers.kapowarr.rule=Host(`kapowarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kapowarr.entrypoints=websecure"
      - "traefik.http.routers.kapowarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.kapowarr.tls=true"
      - "traefik.http.routers.kapowarr.service=kapowarr"
      - "traefik.http.services.kapowarr.loadbalancer.server.port=5656"
      - "traefik.http.routers.stremio-root.rule=Host(`stremio.${HOST_NAME:-pi.lan}`) && Path(`/`)"
      - "traefik.http.routers.stremio-root.entrypoints=websecure"
      - "traefik.http.routers.stremio-root.middlewares=frame-deny@docker,lan@docker,stremio-webui-redirect@docker"
      - "traefik.http.routers.stremio-root.priority=30"
      - "traefik.http.routers.stremio-root.tls=true"
      - "traefik.http.routers.stremio-root.service=noop@internal"
      # No authelia: a cast receiver fetches the stream itself, and
      # stremio.<HOST_NAME> has no Authelia rule, so forward-auth would deny
      # everyone.
      - "traefik.http.routers.stremio.rule=Host(`stremio.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.stremio.entrypoints=websecure"
      - "traefik.http.routers.stremio.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.stremio.priority=10"
      - "traefik.http.routers.stremio.tls=true"
      - "traefik.http.routers.stremio.service=stremio"
      - "traefik.http.services.stremio.loadbalancer.server.port=11470"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.regex=^https?://([^/]+)/?$"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.replacement=https://app.strem.io/shell-v4.4/?streamingServer=https%3A%2F%2F$${1}"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.permanent=false"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      start_period: 30s
      start_interval: 5s
    cpu_shares: *cpu-prio-critical
    mem_limit: 256m
    mem_reservation: 64m
    oom_score_adj: *oom-score-deprioritize

  qbittorrent:
    <<: *service-defaults
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls474@sha256:a00b6a597a3832a1814cde0ef60abc55c94644f3f80902c3432f6af6de8d4a96
    container_name: pi-qbittorrent
    profiles: ["qbittorrent", "all"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "homepage.group=Download"
      - "homepage.name=qBittorrent"
      - "homepage.icon=qbittorrent.png"
      - "homepage.href=https://qbittorrent.${HOST_NAME:-pi.lan}"
      - "homepage.description=Torrent client (VPN protected)"
      - "homepage.widget.type=qbittorrent"
      - "homepage.widget.url=http://pi-gluetun:8080"
      - "homepage.widget.username={{HOMEPAGE_VAR_ADMIN_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${DATA_LOCATION:-./data}/qbittorrent:/config
      - ${DATA_LOCATION:-./data}/download:/downloads
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      start_period: 30s
    cpu_shares: *cpu-prio-batch
    # At 256m the cgroup kept hitting memory.max reclaiming the torrent write
    # cache: page cache, not heap.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  stremio:
    <<: *stremio-common
    container_name: pi-stremio
    profiles: ["stremio", "all"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      # Routed by gluetun's labels: sharing its namespace leaves this container
      # with no address of its own for Traefik's docker provider to target.
      - "traefik.enable=false"
      - "homepage.group=Video"
      - "homepage.name=Stremio"
      - "homepage.icon=stremio.png"
      - "homepage.href=https://stremio.${HOST_NAME:-pi.lan}"
      - "homepage.description=Movie and TV streaming (VPN protected)"

  # The casting variant of `stremio`, never both (the conflicts-with label
  # below). SSDP/mDNS discovery crosses neither a Docker bridge nor gluetun's
  # firewall, so this one gets a LAN address - off the VPN: torrent pieces
  # Stremio fetches itself leave on the residential IP.
  stremio-lan:
    <<: *stremio-common
    container_name: pi-stremio-lan
    profiles: ["stremio-lan"]
    networks:
      frontend: {}
      lan:
        ipv4_address: ${STREMIO_IP:-192.168.1.251}
    # A macvlan child cannot reach its parent host, so reach Traefik on frontend
    # rather than at the public records' HOST_LAN_IP (EHOSTUNREACH).
    extra_hosts:
      - "stremio.${HOST_NAME:-pi.lan}:172.30.11.250"
      - "aiostreams.${HOST_NAME:-pi.lan}:172.30.11.250"
    labels:
      - "homepage.group=Video"
      - "homepage.name=Stremio"
      - "homepage.icon=stremio.png"
      - "homepage.href=https://stremio.${HOST_NAME:-pi.lan}"
      - "homepage.description=Movie and TV streaming (LAN, casting)"
      - "pi-pcloud.conflicts-with=stremio"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Same host rules as gluetun's routers but higher priority, so that if
      # gluetun is up for qbittorrent its now-dead stremio routers lose.
      - "traefik.http.routers.stremio-lan-root.rule=Host(`stremio.${HOST_NAME:-pi.lan}`) && Path(`/`)"
      - "traefik.http.routers.stremio-lan-root.entrypoints=websecure"
      - "traefik.http.routers.stremio-lan-root.middlewares=frame-deny@docker,lan@docker,stremio-lan-webui-redirect@docker"
      - "traefik.http.routers.stremio-lan-root.priority=80"
      - "traefik.http.routers.stremio-lan-root.tls=true"
      - "traefik.http.routers.stremio-lan-root.service=noop@internal"
      # No authelia, same reason as the gluetun-hosted router.
      - "traefik.http.routers.stremio-lan.rule=Host(`stremio.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.stremio-lan.entrypoints=websecure"
      - "traefik.http.routers.stremio-lan.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.stremio-lan.priority=60"
      - "traefik.http.routers.stremio-lan.tls=true"
      - "traefik.http.routers.stremio-lan.service=stremio-lan"
      - "traefik.http.services.stremio-lan.loadbalancer.server.port=11470"
      # Its own copy: the gluetun-hosted middleware is gone when gluetun is not
      # selected.
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.regex=^https?://([^/]+)/?$"
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.replacement=https://app.strem.io/shell-v4.4/?streamingServer=https%3A%2F%2F$${1}"
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.permanent=false"

  # Two Stremio addons: AIOStreams resolves streams, AIOMetadata catalogs and
  # metadata. On frontend rather than in gluetun's namespace: with a debrid
  # service they only talk to APIs. AIOStreams' P2P presets or built-in proxy
  # would change that, and mean moving it behind gluetun.
  aiostreams:
    <<: *service-defaults
    image: ghcr.io/viren070/aiostreams:v2.36.0
    container_name: pi-aiostreams
    profiles: ["aiostreams", "all"]
    networks:
      - frontend
    # Public resolvers: Pi-hole's lists block torrent indexers (0.0.0.0,
    # surfacing as "fetch failed"). Scoped to this container rather than an
    # ALLOW_LISTS entry, which would unblock them for the whole household.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # Every stack name it fetches, pinned to Traefik: through public resolvers
    # they would hairpin through the WAN and land on the rate-limited public
    # routers. Its own name included, since BASE_URL generates its stream URLs.
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
      - "aiostreams.${HOST_NAME:-pi.lan}:172.30.11.250"
      - "aiometadata.${HOST_NAME:-pi.lan}:172.30.11.250"
      - "stremthru.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 3000
    # The built-in Prowlarr scraper is initialised once and never retried:
    # started before Prowlarr listens, the Prowlarr preset is silently dropped
    # for the container's lifetime. required: false, since prowlarr has its own
    # profile.
    depends_on:
      prowlarr:
        condition: service_healthy
        required: false
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - PORT=3000
      # Install, self-scrape and stream URLs derive from it: a wrong value gives
      # a manifest that installs and then fetches nothing.
      - BASE_URL=https://aiostreams.${HOST_NAME:-pi.lan}
      - DATABASE_URI=sqlite://./data/db.sqlite
      # Runtime settings set here become read-only in the dashboard. The default
      # `trusted` breaks the SEL template sync on a single-operator instance.
      - SEL_SYNC_ACCESS=all
      # Without it the Torz preset uses a public third-party instance. The
      # Traefik hostname, not stremthru:8080: torz builds stream URLs from the
      # request host.
      - STREMTHRU_TORZ_URL=https://stremthru.${HOST_NAME:-pi.lan}/stremio/torz
      # Operator login only: the dashboard and the configuration page. The
      # /stremio/<uuid>/<password>/* URL stays a bearer credential, since
      # Stremio has no cookie jar.
      - AIOSTREAMS_OIDC_ENABLED=true
      - AIOSTREAMS_OIDC_ISSUER=https://auth.${HOST_NAME:-pi.lan}
      - AIOSTREAMS_OIDC_CLIENT_ID=aiostreams
      # The default omits `groups` (Google and Entra reject it as unknown).
      - AIOSTREAMS_OIDC_SCOPES=openid profile email groups
      # Deny-by-default: AIOSTREAMS_OIDC_DEFAULT_PERMISSIONS stays unset.
      - AIOSTREAMS_OIDC_GROUP_PERMISSIONS=admin=admin
      # SSO only. AIOSTREAMS_AUTH remains the HTTP Basic credential of the
      # built-in proxy and usenet engine. If Authelia is down, set this to true
      # and `up -d`: disabling OIDC does not bring local login back.
      - AIOSTREAMS_OIDC_ALLOW_LOCAL_LOGIN=false
      # Without it anyone reaching /stremio/configure can create a
      # configuration.
      - AIOSTREAMS_AUTH_REQUIRED=true
      # The stremio-addons.net badge, only emitted once the signature from the
      # second env file below is set too.
      - STREMIO_ADDONS_CONFIG_ISSUER=https://stremio-addons.net
      # The default 15 is about what the community SEL template alone uses.
      # Addons are fetched in parallel, so latency holds but memory grows: raise
      # mem_limit with it.
      - MAX_ADDONS=30
      # The default 7000 aborts every anime lookup: ~4.5 s goes on resolving
      # titles before any search. Only for addons with no timeout of their own -
      # the SEL wizard sets one per addon (Prowlarr needs 30000, set in the
      # dashboard).
      - DEFAULT_TIMEOUT=15000
      # AIOStreams rate-limits its Stremio surfaces itself, on top of Traefik.
      # AIOMetadata's ~60 catalogues proxied here exceed the default 30 per 5 s,
      # and they are answered from cache.
      - STREMIO_CATALOG_RATE_LIMIT_MAX_REQUESTS=300
      # Default 10 per 15 s, raised far less: a stream request fans out to every
      # addon and the debrid API.
      - STREMIO_STREAM_RATE_LIMIT_MAX_REQUESTS=30
    # SECRET_KEY, AIOSTREAMS_AUTH, the OIDC client secret and the Prowlarr pair,
    # from scripts/aiostreams-pre-start.sh. Not in `environment:`, which would
    # shadow them. Frozen at creation: `up -d` after a rotation, never
    # `restart`.
    env_file:
      - path: ./config/aiostreams/aiostreams.env
        required: false
      # STREMIO_ADDONS_CONFIG_SIGNATURE, never rewritten. Seeded commented out:
      # an empty signature suppresses the manifest field as silently as a
      # missing one.
      - path: ./config/aiostreams/addons-config.env
        required: false
    volumes:
      - aiostreams_data:/app/data
    labels:
      - "homepage.group=Video"
      - "pi-pcloud.companion-of=stremio"
      - "homepage.name=AIOStreams"
      - "homepage.href=https://aiostreams.${HOST_NAME:-pi.lan}"
      - "homepage.description=Stream aggregator and filtering for Stremio"
      - "homepage.icon=stremio.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # The LAN-only catch-all. No authelia@docker: it would 401 the Stremio
      # client, and the operator pages use OIDC.
      - "traefik.http.routers.aiostreams.rule=Host(`aiostreams.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.aiostreams.entrypoints=websecure"
      - "traefik.http.routers.aiostreams.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.aiostreams.tls=true"
      - "traefik.http.routers.aiostreams.priority=10"
      # The public half: the addon protocol, whose URL is itself the credential,
      # and the debrid playback redirect - without it an off-tailnet client
      # lists streams and plays none. The built-in proxy's and usenet's playback
      # paths are deliberately unmatched. Configure pages are carved out (`$$`
      # is a literal `$`). Fails closed: validate any change off-tailnet.
      # docs/SECURITY.md#per-service-protection.
      - "traefik.http.routers.aiostreams-public.rule=Host(`aiostreams.${HOST_NAME:-pi.lan}`) && ((PathPrefix(`/stremio/`) && !PathRegexp(`/configure(/|$$)`)) || PathPrefix(`/api/v1/debrid/playback/`))"
      - "traefik.http.routers.aiostreams-public.entrypoints=websecure"
      # rate-limit-auth: each stream request fans out to every addon and a
      # debrid API from the Pi's WAN address.
      - "traefik.http.routers.aiostreams-public.middlewares=frame-deny@docker,rate-limit-auth@docker"
      - "traefik.http.routers.aiostreams-public.tls=true"
      - "traefik.http.routers.aiostreams-public.priority=20"
      - "traefik.http.routers.aiostreams-public.service=aiostreams"
      # Catalogues, metadata, the manifest and the /static status clips, on the
      # looser limiter: a home paint asks for dozens of catalogues at once, and
      # a player loops a clip with range requests. Stream lookups stay on the
      # router above.
      - "traefik.http.routers.aiostreams-catalog.rule=Host(`aiostreams.${HOST_NAME:-pi.lan}`) && ((PathPrefix(`/stremio/`) && !PathRegexp(`/configure(/|$$)`) && !PathRegexp(`/stream/`)) || PathPrefix(`/static/`))"
      - "traefik.http.routers.aiostreams-catalog.entrypoints=websecure"
      - "traefik.http.routers.aiostreams-catalog.middlewares=frame-deny@docker,rate-limit-burst@docker"
      - "traefik.http.routers.aiostreams-catalog.tls=true"
      - "traefik.http.routers.aiostreams-catalog.priority=30"
      - "traefik.http.routers.aiostreams-catalog.service=aiostreams"
      - "traefik.http.services.aiostreams.loadbalancer.server.port=3000"
    healthcheck:
      <<: *healthcheck-default
      # busybox wget, no curl. --spider sends HEAD, which this route does not
      # answer.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/v1/status"]
      # The first boot fetches the anime mapping databases before the API
      # serves.
      start_period: 120s
    cpu_shares: *cpu-prio-normal
    # Node sizes its heap from this limit. A stream lookup holds every addon's
    # results at once, and an exhausted heap exits with "Reached heap limit"
    # (oomkilled stays false), seen only as an empty search. Raise with
    # MAX_ADDONS.
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  aiometadata:
    <<: *service-defaults
    image: ghcr.io/cedya77/aiometadata:3.6.1@sha256:83d23c3f3ce12bdceebb01566f66ced00e08b7ccb1758628af8bd45d2e022b85
    container_name: pi-aiometadata
    profiles: ["aiometadata", "all"]
    networks:
      - frontend
      - aiometadata
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 3232
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - PORT=3232
      - NODE_ENV=production
      # The addon's own variable, wanting a full URL: its redirect URI derives
      # from it.
      - HOST_NAME=https://aiometadata.${HOST_NAME:-pi.lan}
      - DATABASE_URI=sqlite://addon/data/db.sqlite
      # Gates who may configure, not who may use: the addon routes stay open to
      # whoever holds the URL.
      - OIDC_ENABLED=true
      - OIDC_ISSUER=https://auth.${HOST_NAME:-pi.lan}
      - OIDC_CLIENT_ID=aiometadata
      - OIDC_GROUPS_CLAIM=groups
      # Deny-by-default: OIDC_DEFAULT_PERMISSIONS stays unset.
      - OIDC_GROUP_PERMISSIONS=admin=admin|createConfig
      - AUTH_REQUIRE_SIGNIN=true
      # One proxy in front; too low and every visitor shares one sign-in
      # rate-limit bucket.
      - TRUST_PROXY_HOPS=1
      # Every warmer off: on a ~60-catalog config they burn MDBList's free 1000
      # calls a day in one pass. `essential` at most if cold browsing is too
      # slow, never `comprehensive`.
      - ENABLE_CACHE_WARMING=false
      - CACHE_WARMUP_ON_STARTUP=false
      - TMDB_POPULAR_WARMING_ENABLED=false
      - MAL_WARMUP_ENABLED=false
      # Disk L2 for metadata that never changes, so an eviction from the shared
      # Redis costs a disk read rather than a refetch.
      - META_COLD_STORE_ENABLED=true
      - META_COLD_STORE_PATH=/app/addon/data/metacache.sqlite
      - META_COLD_STORE_MAX_BYTES=512m
      # Artwork cached on disk rather than proxied on every render, the biggest
      # win for browsing. Excluded from the Backrest plan.
      - ENABLE_BUILTIN_POSTER_CACHE=true
      - POSTER_CACHE_MAX_SIZE=2g
      # Art URL patterns are user-supplied; nothing here serves art from the
      # LAN, so refuse rather than let the proxy follow one inward.
      - POSTER_PROXY_ALLOW_PRIVATE=false
    # REDIS_URL (no *_FILE variant, so the password is inlined), the OIDC client
    # secret and ADMIN_KEY, from scripts/aiometadata-pre-start.sh. Same
    # precedence and `up -d` rules as aiostreams.
    env_file:
      - path: ./config/aiometadata/aiometadata.env
        required: false
      # The provider keys (BUILT_IN_TMDB_API_KEY and friends), never rewritten.
      # Seeded commented out: empty and absent differ to this addon.
      - path: ./config/aiometadata/api-keys.env
        required: false
    volumes:
      - aiometadata_data:/app/addon/data
    labels:
      - "homepage.group=Video"
      - "pi-pcloud.companion-of=stremio"
      - "homepage.name=AIOMetadata"
      - "homepage.href=https://aiometadata.${HOST_NAME:-pi.lan}"
      - "homepage.description=Catalogs and metadata addon for Stremio"
      - "homepage.icon=stremio.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Same split as aiostreams, and no authelia@docker either.
      - "traefik.http.routers.aiometadata.rule=Host(`aiometadata.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.aiometadata.entrypoints=websecure"
      - "traefik.http.routers.aiometadata.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.aiometadata.tls=true"
      - "traefik.http.routers.aiometadata.priority=10"
      # The addon protocol (/stremio/<uuid>/...) is public. /dashboard, /api and
      # every configure page stay LAN-only, the per-user one carved out with the
      # same regexp as aiostreams. Fails closed.
      # docs/SECURITY.md#per-service-protection.
      - "traefik.http.routers.aiometadata-public.rule=Host(`aiometadata.${HOST_NAME:-pi.lan}`) && PathPrefix(`/stremio/`) && !PathRegexp(`/configure(/|$$)`)"
      - "traefik.http.routers.aiometadata-public.entrypoints=websecure"
      # rate-limit-auth: every catalog page fans out to TMDB/TVDB/MDBList, whose
      # free tier is 1000 calls a day.
      - "traefik.http.routers.aiometadata-public.middlewares=frame-deny@docker,rate-limit-auth@docker"
      - "traefik.http.routers.aiometadata-public.tls=true"
      - "traefik.http.routers.aiometadata-public.priority=20"
      - "traefik.http.routers.aiometadata-public.service=aiometadata"
      # Artwork on rate-limit-burst: a home paint asks for over a thousand
      # images, served off the local disk cache.
      - "traefik.http.routers.aiometadata-art.rule=Host(`aiometadata.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/poster`) || PathPrefix(`/logo`) || PathPrefix(`/background`) || Path(`/missing_poster.png`))"
      - "traefik.http.routers.aiometadata-art.entrypoints=websecure"
      - "traefik.http.routers.aiometadata-art.middlewares=frame-deny@docker,rate-limit-burst@docker"
      - "traefik.http.routers.aiometadata-art.tls=true"
      - "traefik.http.routers.aiometadata-art.priority=30"
      - "traefik.http.routers.aiometadata-art.service=aiometadata"
      - "traefik.http.services.aiometadata.loadbalancer.server.port=3232"
    healthcheck:
      <<: *healthcheck-default
      # /health/live, not /health, which answers before Redis and the database
      # are usable.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3232/health/live"]
      start_period: 90s
    cpu_shares: *cpu-prio-normal
    # Node's heap grows to whatever it is allowed: ~1 GiB idle, uncapped.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # SideKick edits the Stremio addon collection; torz is a stream source for
  # AIOStreams, fed by the DebridMediaManager hashlists and the torrent database
  # StremThru instances share.
  #
  # Torz must stay on p2p: with a store it encodes the debrid token into the
  # stream URLs it builds. docs/SECURITY.md#per-service-protection.
  stremthru:
    <<: *service-defaults
    image: ghcr.io/muniftanjim/stremthru:0.105.3
    container_name: pi-stremthru
    profiles: ["stremthru", "all"]
    networks:
      - frontend
    expose:
      - 8080
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - STREMTHRU_PORT=8080
      - STREMTHRU_BASE_URL=https://stremthru.${HOST_NAME:-pi.lan}
      # Go cannot see the cgroup limit, and an OOM restarts the catch-up workers
      # from scratch. It bounds the Go heap only, as SQLite allocates through
      # cgo: so it is mem_limit minus the SQLite budget below and some page
      # cache.
      - GOMEMLIMIT=768MiB
      # max_conns trades memory for concurrency: upstream forces a 64 MB page
      # cache on every connection, held in cgo where GOMEMLIMIT cannot see it
      # (~135 MiB each once warm), and pools 8 by default. At 2, a mapping scan
      # and one large write left no connection for anyone else, and four
      # concurrent viewers timed out; at 4 none did.
      - STREMTHRU_DATABASE_URI=sqlite://./data/stremthru.db?max_conns=4
      # An allowlist: naming any feature disables every default-on one left out,
      # so dmm_hashlist and imdb_title must be listed. Naming a default-disabled
      # one bare (`anime`, `stremio_p2p`) is fatal at boot, and `+x` enables
      # nothing here.
      #
      # `vault` turns on as soon as STREMTHRU_VAULT_SECRET is set, whatever this
      # line says: keep it empty until stremthru_data is in Backrest.
      - STREMTHRU_FEATURE=stremio_sidekick,torz,stremio_torz,dmm_hashlist,imdb_title,meta
      # The shared torrent database torz relies on, spelled out so the
      # third-party dependency is visible. It carries no token.
      - STREMTHRU_PEER_URI=https://stremthru.13377001.xyz
    # The limits below are sized for the steady state; the first run on an empty
    # volume needs far more (docs/TROUBLESHOOTING.md#streaming). ~5 GB of
    # re-downloadable data, deliberately not backed up.
    volumes:
      - stremthru_data:/app/data
    labels:
      - "homepage.group=Video"
      - "pi-pcloud.companion-of=stremio"
      - "homepage.name=StremThru"
      - "homepage.href=https://stremthru.${HOST_NAME:-pi.lan}/stremio/sidekick/"
      - "homepage.description=Reorder and edit the Stremio addon collection"
      - "homepage.icon=stremio.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Inverted from aiostreams: here the catch-all carries forward-auth.
      # SideKick, the dashboard and every configure page are browser UIs.
      - "traefik.http.routers.stremthru.rule=Host(`stremthru.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.stremthru.entrypoints=websecure"
      - "traefik.http.routers.stremthru.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.stremthru.tls=true"
      - "traefik.http.routers.stremthru.priority=10"
      # AIOStreams fetches the torz manifest and streams server-side and cannot
      # pass a login (the failure is silent: a shorter stream list). Still
      # behind lan@docker, with configure pages carved out.
      - "traefik.http.routers.stremthru-addon.rule=Host(`stremthru.${HOST_NAME:-pi.lan}`) && PathPrefix(`/stremio/torz`) && !PathRegexp(`/configure(/|$$)`)"
      - "traefik.http.routers.stremthru-addon.entrypoints=websecure"
      - "traefik.http.routers.stremthru-addon.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.stremthru-addon.tls=true"
      - "traefik.http.routers.stremthru-addon.priority=20"
      - "traefik.http.routers.stremthru-addon.service=stremthru"
      - "traefik.http.services.stremthru.loadbalancer.server.port=8080"
    healthcheck:
      <<: *healthcheck-relaxed
      # /v0/health, not /, which answers before the migrations finish. No curl
      # in the image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v0/health"]
      start_period: 30s
    # A hard cap: cpu_shares only arbitrates under contention, and the first-run
    # drain took all four cores.
    cpus: 2
    cpu_shares: *cpu-prio-batch
    # A 53k-torrent mapping catch-up took two connections to 1.25 GiB of
    # anonymous memory, and each extra one adds ~135 MiB. The rest is page cache
    # for the multi-GB database, which the mapping worker rescans every batch.
    mem_limit: 2g
    oom_score_adj: *oom-score-deprioritize

  prowlarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: pi-prowlarr
    profiles: ["prowlarr", "all"]
    networks:
      - frontend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    expose:
      - 9696
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "homepage.group=Download"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr.png"
      - "homepage.href=https://prowlarr.${HOST_NAME:-pi.lan}"
      - "homepage.description=Torrent search aggregator"
      - "homepage.widget.type=prowlarr"
      - "homepage.widget.url=http://pi-prowlarr:9696"
      - "homepage.widget.key={{HOMEPAGE_FILE_PROWLARR_API_KEY}}"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/prowlarr:/config
    healthcheck:
      <<: *healthcheck-default
      # /ping needs no auth.
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      start_period: 45s
    cpu_shares: *cpu-prio-batch
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  flaresolverr:
    <<: *service-defaults
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: pi-flaresolverr
    profiles: ["flaresolverr", "prowlarr", "all"]
    labels:
      - "homepage.description=Cloudflare challenge solver for Prowlarr"
      - "pi-pcloud.companion-of=prowlarr"
    networks:
      - frontend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    expose:
      - 8191
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE:-Europe/Paris}
    # Chrome crashes with the default 64 MB /dev/shm.
    shm_size: "256m"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      start_period: 45s
    cpu_shares: *cpu-prio-batch
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  kapowarr:
    <<: *service-defaults
    image: mrcas/kapowarr:v1.3.2
    container_name: pi-kapowarr
    profiles: ["kapowarr", "all"]
    # In gluetun's namespace with qBittorrent (localhost:8080), so torrent paths
    # map one-to-one and Kapowarr's direct downloads use the VPN too.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.kapowarr.rule=Host(`kapowarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kapowarr.entrypoints=websecure"
      - "traefik.http.routers.kapowarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.kapowarr.tls=true"
      - "traefik.http.routers.kapowarr.service=kapowarr"
      - "traefik.http.services.kapowarr.loadbalancer.server.port=5656"
      - "homepage.group=Download"
      - "homepage.name=Kapowarr"
      - "homepage.icon=kapowarr.png"
      - "homepage.href=https://kapowarr.${HOST_NAME:-pi.lan}"
      - "homepage.description=Automated comic downloader"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/kapowarr/db:/app/db
      # Direct downloads; the entrypoint chowns it to PUID.
      - ${DATA_LOCATION:-./data}/kapowarr/downloads:/app/temp_downloads
      # The path qBittorrent uses, so grabbed torrents import with no path
      # mapping.
      - ${DATA_LOCATION:-./data}/download:/downloads
      - ${DATA_LOCATION:-./data}/comics:/comics
      # Manga volumes, for Kavita's Manga-type library rather than the comic
      # parser.
      - ${DATA_LOCATION:-./data}/manga:/manga
    healthcheck:
      <<: *healthcheck-default
      # No curl or wget in the image.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5656/').status==200 else 1)"]
      start_period: 45s
    cpu_shares: *cpu-prio-batch
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  kavita:
    <<: *service-defaults
    image: lscr.io/linuxserver/kavita:0.9.1
    container_name: pi-kavita
    profiles: ["kavita", "all"]
    networks:
      - frontend
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 5000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - kavita_config:/config
      # One read-only mount per library type (ComicVine, Manga, Book). Never the
      # download root: Kavita walks every subfolder, so an installer tree
      # becomes series.
      - ${DATA_LOCATION:-./data}/comics:/comics:ro
      - ${DATA_LOCATION:-./data}/manga:/manga:ro
      - ${DATA_LOCATION:-./data}/download/manga:/manga-downloads:ro
      # Hand-grabbed issues, kept out of comics/: Kapowarr moves files there
      # with copy-then-delete, which races a seeding torrent.
      - ${DATA_LOCATION:-./data}/download/comics:/comics-downloads:ro
      - ${DATA_LOCATION:-./data}/download/books:/books:ro
      # Read as a Comic library despite holding PDFs; see
      # kavita-library-bootstrap.sh for why, and for the naming an issue has to
      # follow to join its series.
      - ${DATA_LOCATION:-./data}/download/magazines:/magazines:ro
    labels:
      - "homepage.group=Books"
      - "homepage.name=Kavita"
      - "homepage.icon=kavita.png"
      - "homepage.href=https://kavita.${HOST_NAME:-pi.lan}"
      - "homepage.description=Comic, manga and ebook reader"
      - "homepage.widget.type=kavita"
      - "homepage.widget.url=http://pi-kavita:5000"
      # An API key: the OIDC config sets DisablePasswordAuthentication, which
      # only apiKey logins are exempt from.
      - "homepage.widget.key={{HOMEPAGE_FILE_KAVITA_API_KEY}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # No authelia@docker: own accounts, and OPDS clients cannot pass the
      # portal.
      - "traefik.http.routers.kavita.rule=Host(`kavita.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kavita.entrypoints=websecure"
      - "traefik.http.routers.kavita.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.kavita.tls=true"
      - "traefik.http.services.kavita.loadbalancer.server.port=5000"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      start_period: 45s
    cpu_shares: *cpu-prio-normal
    # Idle RSS is ~210 MB; the headroom is for cover generation, where libvips
    # decodes a whole page and 512m was OOM-killed on files over 100 MB.
    mem_limit: 1g
    oom_score_adj: *oom-score-deprioritize

  shelfmark:
    <<: *service-defaults
    # The full image, for its bundled bypasser: the -lite one's FlareSolverr
    # reports the direct-download mirror's DDoS-Guard as solved while returning the
    # interstitial. Hence a second Chromium, with its mem_limit and shm_size.
    image: ghcr.io/calibrain/shelfmark:v1.5.0@sha256:c598583bebc70d9ecab49e7e65ba627e08389352df35b647462e33894b3cfb14
    container_name: pi-shelfmark
    profiles: ["shelfmark", "all"]
    networks:
      - frontend
    # Pi-hole's lists block several of its sources. Container names still
    # resolve through 127.0.0.11.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 8084
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
      # Everything the wizard asks is set here or in the env file below.
      - ONBOARDING=false
      - SEARCH_MODE=universal
      # universal mode needs a metadata provider; Open Library is the one
      # needing no API key.
      - OPENLIBRARY_ENABLED=true
      - SESSION_COOKIE_SECURE=true
      # Read before the settings system, so not in security.json. Drops the
      # local admin Shelfmark demands before enabling OIDC, which no unattended
      # install can create.
      - DISABLE_LOCAL_AUTH=true
      # The default, set to override a true persisted by the former lite
      # deployment.
      - USING_EXTERNAL_BYPASSER=false
      - DIRECT_DOWNLOAD_ENABLED=true
      # Most direct-download results carry no language: without this
      # BOOK_LANGUAGE drops them before the path's language tag is read.
      - DIRECT_DOWNLOAD_LANGUAGE_FROM_PATH=true
      # Reruns an empty query variant without its category filter: the only way
      # to reach indexers that never declare 3030 for audiobooks. It cannot
      # rescue a release filed under 7000. docs/TROUBLESHOOTING.md.
      - PROWLARR_AUTO_EXPAND=true
      # Kavita's Book library: cbz/cbr are Kapowarr's, and pdf is added.
      - SUPPORTED_FORMATS=epub,pdf,mobi,azw3,fb2,djvu
      - INGEST_DIR=/downloads/books
      - DESTINATION_AUDIOBOOK=/downloads/audiobooks
      # Audiobookshelf never groups files at its library root; `organize` writes
      # {Author}/{Title}/, where the default leaves multi-file grabs flat.
      - FILE_ORGANIZATION_AUDIOBOOK=organize
      # Grabs are staged outside books/ and audiobooks/, which Kavita and
      # Audiobookshelf read: only the processed file lands there.
      - QBITTORRENT_DOWNLOAD_DIR=/downloads/shelfmark
      - QBITTORRENT_CATEGORY=shelfmark
      # Same staging folder; a separate category only to tell grabs apart in
      # qBittorrent.
      - QBITTORRENT_CATEGORY_AUDIOBOOK=shelfmark-audiobooks
      - CALIBRE_WEB_URL=https://kavita.${HOST_NAME:-pi.lan}
    env_file:
      - path: ./config/shelfmark/shelfmark.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/shelfmark:/config
      # The path qBittorrent uses, so completed torrents need no path mapping.
      # books/ is Kavita's Book library, audiobooks/ Audiobookshelf's.
      - ${DATA_LOCATION:-./data}/download:/downloads
    labels:
      - "homepage.group=Download"
      - "homepage.name=Shelfmark"
      - "homepage.icon=shelfmark.png"
      - "homepage.href=https://shelfmark.${HOST_NAME:-pi.lan}"
      - "homepage.description=Book and audiobook search"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # No authelia@docker: own accounts, fed by OIDC.
      - "traefik.http.routers.shelfmark.rule=Host(`shelfmark.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.shelfmark.entrypoints=websecure"
      - "traefik.http.routers.shelfmark.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.shelfmark.tls=true"
      - "traefik.http.services.shelfmark.loadbalancer.server.port=8084"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/api/health"]
      start_period: 90s
    cpu_shares: *cpu-prio-normal
    # Chromium needs more than the default 64 MB /dev/shm, as in flaresolverr.
    shm_size: "256m"
    mem_limit: 2g
    memswap_limit: 2560m
    oom_score_adj: *oom-score-deprioritize

  audiobookshelf:
    <<: *service-defaults
    image: ghcr.io/advplyr/audiobookshelf:2.37.1@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
    container_name: pi-audiobookshelf
    profiles: ["audiobookshelf", "all"]
    networks:
      - frontend
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 80
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # ROUTER_BASE_PATH must stay unset: the published client has
      # /audiobookshelf baked into its asset URLs, and an empty value makes
      # every asset 404. docs/TROUBLESHOOTING.md.
    volumes:
      # Root-owned, as the image has no PUID/PGID. Harmless: the library below
      # is read-only.
      - ${DATA_LOCATION:-./data}/audiobookshelf/config:/config
      # Split from /config: covers and caches are regenerable, while /config
      # holds the database Backrest takes.
      - ${DATA_LOCATION:-./data}/audiobookshelf/metadata:/metadata
      # Shelfmark's DESTINATION_AUDIOBOOK. Scan artefacts go under /metadata, so
      # the library is never written to.
      - ${DATA_LOCATION:-./data}/download/audiobooks:/audiobooks:ro
    labels:
      - "homepage.group=Books"
      - "homepage.name=Audiobookshelf"
      - "homepage.icon=audiobookshelf.png"
      - "homepage.href=https://audiobooks.${HOST_NAME:-pi.lan}"
      # No podcasts: episodes download into the library folder, which is :ro.
      - "homepage.description=Audiobook library and player"
      - "homepage.widget.type=audiobookshelf"
      - "homepage.widget.url=http://pi-audiobookshelf"
      # Minted by scripts/homepage-widgets-bootstrap.sh. Audiobookshelf shows a
      # key once, so the secret file is the only copy.
      - "homepage.widget.key={{HOMEPAGE_FILE_AUDIOBOOKSHELF_API_KEY}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # No authelia@docker: own accounts fed by OIDC, and the mobile apps cannot
      # pass the portal.
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.routers.audiobookshelf.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.audiobookshelf.tls=true"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthcheck"]
      start_period: 45s
    cpu_shares: *cpu-prio-normal
    # Idle RSS is ~150 MB; the headroom is for the scanner, which probes every
    # file with ffprobe, and for the ffmpeg transcode a non-m4b stream triggers.
    mem_limit: 1g
    oom_score_adj: *oom-score-deprioritize
