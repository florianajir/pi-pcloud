# Feeds, search, notes and page-change alerts, grouped by what they are for
# rather than by what they talk to.
#
# Included by compose.yaml, which declares the networks and volumes and holds
# the canonical x- anchors these are copies of (tests/compose-invariants.py
# fails if one drifts: change compose.yaml first).

x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s
x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  freshrss:
    <<: *service-defaults
    # The Debian image: mod_auth_openidc is only built into this variant, and
    # OIDC_ENABLED makes Apache refuse to start without it.
    image: freshrss/freshrss:1.30.2@sha256:a4a4a2233c082940b3ed5a32e2bf12d6c5271062be7e34c188dec99816540fc4
    container_name: pi-freshrss
    profiles: ["freshrss", "all"]
    networks:
      # Traefik, and the feed fetches: outbound HTTP to arbitrary hosts is its
      # job.
      - frontend
      - rss
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 80
    # Neither OIDC secret has a *_FILE variant: Apache expands both from its own
    # environment while parsing its config. `$$@` is compose's escape for `$@`,
    # passing `command:` through to the image's entrypoint.
    entrypoint:
      - sh
      - -c
      - 'export OIDC_CLIENT_SECRET="$(cat /run/secrets/oidc_freshrss_secret)" OIDC_CLIENT_CRYPTO_KEY="$(cat /run/secrets/freshrss_oidc_crypto_key)" && exec ./Docker/entrypoint.sh "$$@"'
      - sh
    # An `entrypoint:` clears the image's CMD, and the image entrypoint ends in
    # `exec "$@"`: without this the container exits 0 silently. This is the
    # image's CMD with its conditionals resolved (CRON_MIN set, OIDC on);
    # re-check it on an image bump.
    command:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - 'cron && . /etc/apache2/envvars && exec apache2 -D FOREGROUND -D OIDC_ENABLED'
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Feed refresh, off the hour: no crontab is installed without it. It also
      # makes the entrypoint dump the environment to a 0644 env.txt in the
      # writable layer: docs/SECURITY.md#accepted-risks.
      - CRON_MIN=13,43
      # Traefik alone, so no frontend neighbour can choose the address FreshRSS
      # logs and rate-limits on.
      - TRUSTED_PROXY=172.30.11.250/32
      # Traefik already logs this route.
      - ENABLE_ACCESS_LOG=0
      - OIDC_ENABLED=1
      - OIDC_PROVIDER_METADATA_URL=https://auth.${HOST_NAME:-pi.lan}/.well-known/openid-configuration
      - OIDC_CLIENT_ID=freshrss
      # No `groups`: FreshRSS takes no roles. Every sign-in is auto-registered
      # as a user, so Authelia's policy is the real gate.
      - OIDC_SCOPES=openid profile email
      # The LLDAP uid, so each account gets its own subscriptions and read
      # state.
      - OIDC_REMOTE_USER_CLAIM=preferred_username
      # TLS ends at Traefik: without these the redirect_uri is http:// and
      # Authelia rejects it.
      - OIDC_X_FORWARDED_HEADERS=X-Forwarded-Proto X-Forwarded-Host
      - DB_PASSWORD=${PASSWORD}
      # First run only. `http_auth` makes FreshRSS trust mod_auth_openidc's
      # REMOTE_USER. `$$` leaves the reference to the container's shell, which
      # evals and word-splits this string.
      - FRESHRSS_INSTALL=--api-enabled --auth-type http_auth --base-url https://rss.${HOST_NAME:-pi.lan} --db-type pgsql --db-host postgres --db-base freshrss --db-user freshrss --db-password $${DB_PASSWORD} --default-user ${ADMIN_USER:-admin} --language ${DEFAULT_LANGUAGE:-en} --title pi-pcloud
      # The password only serves the Google Reader API (/api/greader.php),
      # outside the OIDC-protected path.
      - FRESHRSS_USER=--user ${ADMIN_USER:-admin} --password $${DB_PASSWORD} --api-password $${DB_PASSWORD} --email ${EMAIL} --language ${DEFAULT_LANGUAGE:-en}
    volumes:
      - ${DATA_LOCATION:-./data}/freshrss:/var/www/FreshRSS/data
      - ./config/freshrss/healthcheck.sh:/healthcheck.sh:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_freshrss_secret.txt:/run/secrets/oidc_freshrss_secret:ro
      # From scripts/freshrss-pre-start.sh. mod_auth_openidc encrypts its
      # session cookie and cache with it.
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/freshrss_oidc_crypto_key:/run/secrets/freshrss_oidc_crypto_key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-default
      # The image's cli/health.php issues no query, so it passes on a dead
      # Postgres; the mounted script adds a SELECT 1.
      test: ["CMD", "/healthcheck.sh"]
      start_period: 60s
    labels:
      - "homepage.group=News"
      - "homepage.name=FreshRSS"
      - "homepage.icon=freshrss.png"
      - "homepage.href=https://rss.${HOST_NAME:-pi.lan}"
      - "homepage.description=RSS and Atom feed reader"
      # No homepage.widget: it would show one account's unread count on a shared
      # dashboard.
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # No authelia@docker: FreshRSS runs OIDC itself, and forward-auth would
      # also cover /api/greader.php, which mobile readers call.
      - "traefik.http.routers.freshrss.rule=Host(`rss.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.routers.freshrss.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.freshrss.tls=true"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
    cpu_shares: *cpu-prio-batch
    # The refresh cron adds a PHP process that parses whatever a feed returns.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # A metasearch engine, with no index and no accounts: Open WebUI's and
  # OpenClaw's web search and Homepage's search box use it rather than hand the
  # household's queries to a hosted engine.
  searxng:
    <<: *service-defaults
    # Upstream tags one build a day as <date>-<sha>; there is no semver release.
    image: searxng/searxng:2026.10.19-d47cb96bf
    container_name: pi-searxng
    # Started with open-webui and openclaw, whose web search calls it.
    profiles: ["searxng", "open-webui", "openclaw", "all"]
    networks:
      # Traefik, and the searches themselves: outbound HTTP to arbitrary
      # engines.
      - frontend
      # How open-webui and openclaw reach it.
      - ai
    expose:
      - 8080
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - SEARXNG_BASE_URL=https://search.${HOST_NAME:-pi.lan}/
    env_file:
      # SEARXNG_SECRET, from scripts/searxng-pre-start.sh. Frozen at creation:
      # `up -d` after a regeneration.
      - path: ./config/searxng/searxng.env
        required: false
    volumes:
      # The image declares VOLUME /etc/searxng: naming it stops each recreate
      # from leaving an anonymous volume behind.
      - searxng_config:/etc/searxng
      # Bound as a file: bound as a directory, the entrypoint chowns it to uid
      # 977 and a non-root `make update` can no longer write it.
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    healthcheck:
      <<: *healthcheck-default
      # The header only quietens botdetection's missing-X-Forwarded-For error,
      # which is logged once per start anyway.
      test: ["CMD", "wget", "--header=X-Forwarded-For: 127.0.0.1", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
    labels:
      - "homepage.group=News"
      - "homepage.name=SearXNG"
      - "homepage.icon=searxng.png"
      - "homepage.href=https://search.${HOST_NAME:-pi.lan}"
      - "homepage.description=Private metasearch engine"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.searxng.rule=Host(`search.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      # No authelia@docker: there are no accounts and nothing stored per user,
      # and forward-auth would also cover /search, which Open WebUI calls with
      # no session.
      - "traefik.http.routers.searxng.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    cpu_shares: *cpu-prio-batch
    # The headroom is for granian's four blocking threads, each holding an
    # engine's response.
    mem_limit: 384m
    oom_score_adj: *oom-score-deprioritize

  trilium:
    <<: *service-defaults
    # ghcr: the docker.io repository stopped at v0.95.0 when the project
    # renamed.
    image: ghcr.io/triliumnext/trilium:v0.106.0@sha256:be93e82699b12950ac4e2e7b565ce092fe215b8dd6ddfc47921e37b49e6a0e8b
    container_name: pi-trilium
    profiles: ["trilium", "all"]
    networks:
      # SQLite, so no database segment. OIDC discovery and the token exchange go
      # out here.
      - frontend
    extra_hosts:
      # Probed lazily at the first sign-in: a missing entry is a failed login,
      # not a failed start.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 8080
    # oauthClientSecret has no *_FILE variant, and rendering it into config.ini
    # would leave it at rest outside the secrets directory. `$$@` is compose's
    # escape for `$@`.
    entrypoint:
      - sh
      - -c
      - 'export TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTSECRET="$(cat /run/secrets/oidc_trilium_secret)" && exec docker-entrypoint.sh "$$@"'
      - sh
    # An `entrypoint:` clears the image's CMD, as for freshrss. Re-check it on
    # an image bump.
    command:
      - sh
      - ./start-docker.sh
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Explicit: unset, the data directory follows the *runtime user's* home,
      # so a future USER_UID would move the database out from under the mount.
      - TRILIUM_DATA_DIR=/home/node/trilium-data
      # Traefik alone. At the `false` default the session cookie loses its
      # Secure flag; a bare `true` trusts the left-most X-Forwarded-For, letting
      # a neighbour forge 127.0.0.1 into /mcp.
      - TRILIUM_NETWORK_TRUSTEDREVERSEPROXY=172.30.11.250/32
      # The modern names: TRILIUM_OAUTH_* are legacy aliases that only some
      # settings have.
      - TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHBASEURL=https://notes.${HOST_NAME:-pi.lan}
      - TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTID=trilium
      - TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERBASEURL=https://auth.${HOST_NAME:-pi.lan}
      - TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERNAME=Authelia
      # Scope, client auth method and signing algorithm default sensibly. No
      # `groups`: Trilium has no roles and enrols a single identity.
      # docs/SECURITY.md.
    volumes:
      - ${DATA_LOCATION:-./data}/trilium:/home/node/trilium-data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_trilium_secret.txt:/run/secrets/oidc_trilium_secret:ro
    healthcheck:
      <<: *healthcheck-default
      # The image's probe without its privilege drop, which differs per
      # architecture (gosu on arm64, su-exec on amd64). Its path moves between
      # releases; tests/trilium-api-contract.sh catches that on a bump.
      test: ["CMD", "sh", "/usr/src/app/docker_healthcheck.sh"]
      start_period: 40s
    labels:
      - "homepage.group=Notes"
      - "homepage.name=Trilium"
      - "homepage.icon=trilium.png"
      - "homepage.href=https://notes.${HOST_NAME:-pi.lan}"
      - "homepage.description=Personal knowledge base and notes"
      # No homepage.widget: none exists for Trilium.
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.trilium.rule=Host(`notes.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.trilium.entrypoints=websecure"
      # SAMEORIGIN, not frame-deny: Trilium frames itself for print/PDF and its
      # pdf.js viewer. This keeps Traefik from overwriting Trilium's own
      # SAMEORIGIN.
      - "traefik.http.middlewares.trilium-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      # No authelia@docker: Trilium runs OIDC itself, and /etapi, /api/clipper
      # and /mcp cannot pass a portal.
      - "traefik.http.routers.trilium.middlewares=trilium-frame@docker,lan@docker"
      - "traefik.http.routers.trilium.tls=true"
      - "traefik.http.services.trilium.loadbalancer.server.port=8080"
    cpu_shares: *cpu-prio-batch
    # ~200 MB idle; it peaks on an import or a full-text reindex.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # Beside FreshRSS because it is the same job for the sites that publish no
  # feed: a price, a stock status, a school menu.
  changedetection:
    <<: *service-defaults
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.9@sha256:04eaae7915bad711160cb15abe160f6d3fabe98bbbd658509d4b7a654000fb2d
    container_name: pi-changedetection
    profiles: ["changedetection", "all"]
    networks:
      # Outbound HTTP to arbitrary hosts is the job. Only frontend: on `ntfy`
      # this fetcher would reach backrest's :9898 and dockhand's :3000.
      - frontend
    expose:
      - 5000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Only used for the link a notification carries back to the diff.
      - BASE_URL=https://changes.${HOST_NAME:-pi.lan}
      # The image defaults to DEBUG: ~15 journald lines per page fetched.
      - LOGGER_LEVEL=INFO
      # Down from upstream's 5: each worker holds a page and its lxml tree.
      - FETCH_WORKERS=3
      # Monitored sites would otherwise see this stack's hostname in the
      # Referer.
      - HIDE_REFERER=true
      - DISABLE_VERSION_CHECK=true
      # The SSRF gate: a watch resolving to a private address is refused at
      # fetch time. The default, pinned because flipping it opens the LAN.
      # docs/SECURITY.md.
      - ALLOW_IANA_RESTRICTED_ADDRESSES=false
      # Pointing it at agentgateway would mean opening the gate above.
      - LLM_FEATURES_DISABLED=true
    volumes:
      # Settings, watches and history snapshots. No PUID: the container runs as
      # root.
      - ${DATA_LOCATION:-./data}/changedetection:/datastore
      - ./config/changedetection/healthcheck.py:/healthcheck.py:ro
    healthcheck:
      <<: *healthcheck-relaxed
      # python3 is the only HTTP client in the image, and the probe asserts the
      # fetch workers are alive: the watch list answers 200 with the pool dead.
      test: ["CMD", "python3", "/healthcheck.py"]
      start_period: 40s
    labels:
      - "homepage.group=News"
      - "homepage.name=changedetection.io"
      - "homepage.icon=changedetection.png"
      - "homepage.href=https://changes.${HOST_NAME:-pi.lan}"
      - "homepage.description=Web page change monitoring and alerts"
      - "homepage.widget.type=changedetectionio"
      - "homepage.widget.url=http://pi-changedetection:5000"
      # The datastore's own token, copied out by homepage-widgets-bootstrap.sh.
      - "homepage.widget.key={{HOMEPAGE_FILE_CHANGEDETECTION_API_KEY}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.changedetection.rule=Host(`changes.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.changedetection.entrypoints=websecure"
      # Forward-auth is the gate (no OIDC, one shared password), which needs
      # changes.__HOST_NAME__ in the Authelia template or every request 403s.
      - "traefik.http.routers.changedetection.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.changedetection.tls=true"
      - "traefik.http.services.changedetection.loadbalancer.server.port=5000"
    cpu_shares: *cpu-prio-batch
    # The headroom is for one page's lxml tree.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize
