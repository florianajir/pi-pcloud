# Feeds, search and notes. They share no dependency; the grouping is by
# what they are for, not by what they talk to.
#
# Included by compose.yaml, which declares the networks and volumes named
# below and supplies the .env this file interpolates. Not startable on its
# own: `docker compose -f compose/compose-knowledge.yaml` resolves every relative
# path against compose/ instead of the project root.

# --- shared preamble: identical in every compose/*.yaml ---
#
# YAML anchors are file-scoped and `include:` parses each file on its own, so
# this block cannot be shared - it is copied. compose.yaml holds the canonical
# copy, with the reasoning behind every tier; tests/compose-invariants.py fails
# the build when a copy drifts from it. Change compose.yaml first, then here.

x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

x-cpu-prio-critical: &cpu-prio-critical 4096
x-cpu-prio-normal: &cpu-prio-normal 1024
x-cpu-prio-batch: &cpu-prio-batch 256
x-cpu-prio-idle: &cpu-prio-idle 128

x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s
x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s
x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

# --- end shared preamble ---

services:
  freshrss:
    <<: *service-defaults
    # The Debian image, deliberately not -alpine: mod_auth_openidc is only built
    # into this variant, and OIDC_ENABLED below makes Apache refuse to start
    # without it ("The auth_openidc_module is not available").
    image: freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
    container_name: pi-freshrss
    profiles: ["freshrss", "all"]
    networks:
      # frontend for Traefik, and for the feed fetches themselves: unlike the
      # other library services this one's whole job is outbound HTTP to
      # arbitrary hosts, so an internal-only segment would break it.
      - frontend
      # postgres is on internal segments only; this is FreshRSS's own.
      - rss
    extra_hosts:
      # Authelia's discovery document, fetched by mod_auth_openidc through
      # Traefik on the first authorization request.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 80
    # Neither OIDC_CLIENT_SECRET nor OIDC_CLIENT_CRYPTO_KEY has a *_FILE variant:
    # Apache expands both out of its own environment while parsing
    # FreshRSS.Apache.conf, so they have to be real env vars. Same trick as
    # vaultwarden and open-webui. `$$@` is compose's escape for `$@`, which
    # passes `command:` below through to the image's entrypoint unchanged.
    entrypoint:
      - sh
      - -c
      - 'export OIDC_CLIENT_SECRET="$(cat /run/secrets/oidc_freshrss_secret)" OIDC_CLIENT_CRYPTO_KEY="$(cat /run/secrets/freshrss_oidc_crypto_key)" && exec ./Docker/entrypoint.sh "$$@"'
      - sh
    # An `entrypoint:` in compose also **clears the image's CMD**, and the image
    # entrypoint ends in `exec "$$@"` - so without this the container ran the
    # setup, execed nothing and exited 0, with the logs stopping after "Enabling
    # module auth_openidc." rather than saying anything was wrong.
    #
    # It is the image's own CMD with its two conditionals collapsed, because
    # both are constants here: CRON_MIN is always set, and OIDC_ENABLED is
    # always 1. Re-check it against `docker inspect` on an image bump.
    command:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - 'cron && . /etc/apache2/envvars && exec apache2 -D FOREGROUND -D OIDC_ENABLED'
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Feed refresh. The image only installs its crontab when CRON_MIN is set,
      # so without this nothing ever updates except the browser's own on-demand
      # refresh. Off the hour, away from the 0-minute jobs elsewhere.
      #
      # It is also what makes the entrypoint dump the whole environment - this
      # service's OIDC client secret and Postgres password included - to a 0644
      # /var/www/FreshRSS/Docker/env.txt, so the cron job can source it. That
      # path is in the container's writable layer, not under the data mount
      # below, so it reaches neither the host disk nor a backup; see
      # docs/SECURITY.md#accepted-risks.
      - CRON_MIN=13,43
      # Traefik's address alone, matching IMMICH_TRUSTED_PROXIES and Nextcloud's
      # TRUSTED_PROXIES. The /24 this replaces trusted every container on
      # frontend, so any of them could set X-Forwarded-For and choose the
      # address FreshRSS logs and rate-limits on. RemoteIP only rewrites for a
      # peer in this list; Traefik is the only peer that ever reaches :80.
      - TRUSTED_PROXY=172.30.11.250/32
      # journald already has Traefik's access log for this route; a second copy
      # of every feed poll is noise.
      - ENABLE_ACCESS_LOG=0
      - OIDC_ENABLED=1
      - OIDC_PROVIDER_METADATA_URL=https://auth.${HOST_NAME:-pi.lan}/.well-known/openid-configuration
      - OIDC_CLIENT_ID=freshrss
      # No `groups`: FreshRSS takes no roles from the token. The admin is the
      # account FRESHRSS_USER creates below; everyone else is auto-registered as
      # a plain user on first sign-in (http_auth_auto_register, on by default),
      # which is why Authelia's one_factor policy is the real gate on who gets in.
      - OIDC_SCOPES=openid profile email
      # The claim that becomes the FreshRSS username. Authelia sends the LLDAP
      # uid, so each account gets its own subscriptions and read state rather
      # than everyone landing on the admin's.
      - OIDC_REMOTE_USER_CLAIM=preferred_username
      # TLS terminates at Traefik. Without these mod_auth_openidc builds its
      # redirect_uri from the internal http:// request and Authelia rejects it
      # as unregistered.
      - OIDC_X_FORWARDED_HEADERS=X-Forwarded-Proto X-Forwarded-Host
      - DB_PASSWORD=${PASSWORD}
      # Read on the first run only: the entrypoint exits 3 ("already installed")
      # on every later start. `--auth-type http_auth` is what makes FreshRSS
      # trust the REMOTE_USER that mod_auth_openidc sets.
      #
      # `$$` so compose leaves the reference alone and the container's own shell
      # expands it - the entrypoint runs this string through `eval` and then
      # word-splits the result, so a PASSWORD containing whitespace would not
      # survive. The generated one is `openssl rand -hex 32`.
      - FRESHRSS_INSTALL=--api-enabled --auth-type http_auth --base-url https://rss.${HOST_NAME:-pi.lan} --db-type pgsql --db-host postgres --db-base freshrss --db-user freshrss --db-password $${DB_PASSWORD} --default-user ${ADMIN_USER:-admin} --language ${DEFAULT_LANGUAGE:-en} --title pi-pcloud
      # Same, for the admin account. The password is only ever used by the
      # Google Reader API (`/api/greader.php`), which mobile readers speak and
      # which is outside the OIDC-protected path - the web UI has no password
      # field at all under http_auth.
      - FRESHRSS_USER=--user ${ADMIN_USER:-admin} --password $${DB_PASSWORD} --api-password $${DB_PASSWORD} --email ${EMAIL} --language ${DEFAULT_LANGUAGE:-en}
    volumes:
      - ${DATA_LOCATION:-./data}/freshrss:/var/www/FreshRSS/data
      - ./config/freshrss/healthcheck.sh:/healthcheck.sh:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_freshrss_secret.txt:/run/secrets/oidc_freshrss_secret:ro
      # Generated by scripts/freshrss-pre-start.sh. mod_auth_openidc encrypts its
      # session cookie and its cache with this; regenerating it only logs
      # everyone out, so it is not derived from PASSWORD either.
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/freshrss_oidc_crypto_key:/run/secrets/freshrss_oidc_crypto_key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-default
      # The image ships no HEALTHCHECK, and its own cli/health.php is only half
      # of one: it proves Apache is serving but issues no query, so it reports
      # healthy against a dead Postgres - which is also what the Uptime Kuma
      # monitor watches. The mounted script runs that probe *and* a SELECT 1.
      test: ["CMD", "/healthcheck.sh"]
      start_period: 60s
    labels:
      - "homepage.group=News"
      - "homepage.name=FreshRSS"
      - "homepage.icon=freshrss.png"
      - "homepage.href=https://rss.${HOST_NAME:-pi.lan}"
      - "homepage.description=RSS and Atom feed reader"
      # No homepage.widget: the freshrss widget authenticates with the account's
      # API password, and publishing one account's unread count on a shared
      # dashboard would be the admin's reading list, not the viewer's.
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # lan@docker alone, no authelia@docker: FreshRSS runs the OIDC flow itself
      # over mod_auth_openidc, and forward-auth on top would also cover
      # /api/greader.php - the endpoint mobile readers use, which cannot pass an
      # interactive portal. Same rationale as Kavita's OPDS clients.
      - "traefik.http.routers.freshrss.rule=Host(`rss.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.routers.freshrss.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.freshrss.tls=true"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
    cpu_shares: *cpu-prio-batch
    # Apache prefork plus PHP: idle is ~60 MB, and the refresh cron adds one
    # more PHP process that parses whatever a feed returns.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # A metasearch engine: it keeps no index and has no accounts, it forwards a
  # query to ~270 upstream engines and merges what comes back. Three consumers
  # here - Open WebUI's web search, and Homepage's search box and quick-launch -
  # and every one of them would otherwise hand the household's queries to a
  # hosted engine.
  searxng:
    <<: *service-defaults
    # Upstream tags a build per day as <date>-<sha>; there is no semver release
    # and no floating tag worth pinning to. Newest at the time of writing.
    image: searxng/searxng:2026.9.20-e75fd22d0
    container_name: pi-searxng
    # open-webui, because that chat's web search has nothing to call without
    # this. Same shape as agentgateway under open-webui, or flaresolverr under
    # prowlarr.
    profiles: ["searxng", "open-webui", "all"]
    networks:
      # frontend for Traefik, and for the searches themselves: this container's
      # whole job is outbound HTTP to arbitrary engines, so an internal-only
      # segment would break it. Same reasoning as freshrss.
      - frontend
      # `ai` is internal and is how open-webui reaches everything that is not
      # the gateway.
      - ai
    expose:
      - 8080
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - SEARXNG_BASE_URL=https://search.${HOST_NAME:-pi.lan}/
    env_file:
      # SEARXNG_SECRET, written by scripts/searxng-pre-start.sh. Frozen at
      # container creation, so a regenerated secret needs `up -d`, not
      # `restart`.
      - path: ./config/searxng/searxng.env
        required: false
    volumes:
      # The image declares `VOLUME /etc/searxng`, so something is mounted there
      # whatever this file says - leave it out and Docker creates a fresh
      # *anonymous* volume on every recreate, measured, and this host already
      # carries 26 dangling ones. Naming it is what keeps it off that pile and
      # visible in `volumes:` below; nothing in the repo ever reads it.
      - searxng_config:/etc/searxng
      # The config is bound as a *file* inside it, never as the directory. The
      # image ships /etc/searxng owned by searxng:searxng (uid 977) and the
      # named volume is seeded from it, so the entrypoint's ownership check
      # passes untouched. Binding the host directory there instead would have it
      # chowned to 977 - a directory the next non-root `make update` cannot
      # write. FORCE_OWNERSHIP=false avoids that chown but prints an eight-line
      # "not owned by searxng:searxng" block at every start. All three measured.
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      # Favicon and engine-description caches. Created from the image directory,
      # so it arrives owned by 977 as well.
      - searxng_cache:/var/cache/searxng
    healthcheck:
      <<: *healthcheck-default
      # The image ships no HEALTHCHECK and carries no curl; wget and python3 are
      # what it does have. /healthz is SearXNG's own liveness route.
      #
      # The header keeps the probe out of searx.botdetection's complaint about a
      # request carrying neither X-Forwarded-For nor X-Real-IP. It is not worth
      # more than that: the complaint goes through log_error_only_once(), so it
      # is one ERROR line per container start rather than one per probe, and
      # Open WebUI's internal /search calls carry no header either - so the line
      # still appears the first time the chat searches. Browser traffic arrives
      # through Traefik and always has it.
      test: ["CMD", "wget", "--header=X-Forwarded-For: 127.0.0.1", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
    labels:
      # Beside FreshRSS: both are ways into the open web rather than into
      # something this stack stores.
      - "homepage.group=News"
      - "homepage.name=SearXNG"
      - "homepage.icon=searxng.png"
      - "homepage.href=https://search.${HOST_NAME:-pi.lan}"
      - "homepage.description=Private metasearch engine"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.searxng.rule=Host(`search.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      # No authelia@docker, and this is the one place in the stack where that is
      # not because the service has its own accounts - it has none. A forward-
      # auth here would also cover /search, and Open WebUI calls that endpoint
      # from inside the stack with no session to present. lan@docker is the gate;
      # SearXNG stores nothing per user, so there is nothing behind it to take.
      - "traefik.http.routers.searxng.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    cpu_shares: *cpu-prio-batch
    # 92 MiB idle, 135 MiB after a query on this host. The headroom is for
    # granian's four blocking threads each holding an engine's response.
    mem_limit: 384m
    oom_score_adj: *oom-score-deprioritize

  trilium:
    <<: *service-defaults
    # ghcr, not docker.io/triliumnext/notes: that repository stopped at v0.95.0
    # when the project renamed. Multi-arch index, arm64 included.
    image: ghcr.io/triliumnext/trilium:v0.105.0@sha256:cc6a15edd7ac3df9bb98ad39dd40af8ffda6c1c0bfafe37c26137ddcbecdb7e5
    container_name: pi-trilium
    profiles: ["trilium", "all"]
    networks:
      # frontend only: SQLite, so no database segment. Egress still matters -
      # the OIDC discovery probe and token exchange leave the container.
      - frontend
    extra_hosts:
      # Authelia's discovery document, probed lazily at the first sign-in - so
      # a missing entry is a failed login, not a container that will not start.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 8080
    # oauthClientSecret has no *_FILE variant: config.ts reads it from the
    # environment or from config.ini, and rendering it into an ini file would
    # leave the secret at rest outside the secrets directory. Same trick as
    # freshrss, vaultwarden and open-webui. `$$@` is compose's escape for `$@`.
    entrypoint:
      - sh
      - -c
      - 'export TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTSECRET="$(cat /run/secrets/oidc_trilium_secret)" && exec docker-entrypoint.sh "$$@"'
      - sh
    # An `entrypoint:` in compose clears the image's CMD, and this image's
    # entrypoint ends in `exec "$$@"` - without this the container execs nothing
    # and exits 0 silently, as freshrss did. Re-check against `docker inspect`
    # on an image bump.
    command:
      - sh
      - ./start-docker.sh
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Explicit: unset, the data directory follows the *runtime user's* home,
      # so a future USER_UID would move the database out from under the mount.
      - TRILIUM_DATA_DIR=/home/node/trilium-data
      # Traefik's address alone, as with FreshRSS's TRUSTED_PROXY. At the
      # `false` default Express sees plain HTTP, so the session cookie loses its
      # Secure flag and every client logs as the proxy. A bare `true` is the
      # wrong fix - upstream's routes/mcp.ts notes it trusts the left-most
      # X-Forwarded-For, so a neighbour could forge 127.0.0.1 into /mcp.
      - TRILIUM_NETWORK_TRUSTEDREVERSEPROXY=172.30.11.250/32
      # The modern spellings; TRILIUM_OAUTH_* are aliases config.ts calls legacy
      # and only some settings have one.
      - TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHBASEURL=https://notes.${HOST_NAME:-pi.lan}
      - TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTID=trilium
      - TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERBASEURL=https://auth.${HOST_NAME:-pi.lan}
      - TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERNAME=Authelia
      # oauthScope, oauthClientAuthMethod and oauthIdTokenSigningAlg are left
      # unset: they default to `openid profile email` and auto-detect from the
      # discovery document. No `groups` - Trilium has no roles, and only one
      # identity can be enrolled. See docs/SECURITY.md.
    volumes:
      - ${DATA_LOCATION:-./data}/trilium:/home/node/trilium-data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_trilium_secret.txt:/run/secrets/oidc_trilium_secret:ro
    healthcheck:
      <<: *healthcheck-default
      # The image's bundled probe - the only one available, since this ships
      # node and bash but no curl, wget or nc. Re-declared to put it on the
      # stack's interval anchor.
      #
      # Without the image's own privilege drop, which is NOT portable: the
      # arm64 variant wraps it in `gosu` and the amd64 one in `su-exec`, so the
      # upstream command copied verbatim fails on the other architecture before
      # it ever reaches the server - CI went unhealthy for exactly that. The
      # container is already root here and the probe is a plain HTTP GET.
      test: ["CMD", "node", "/usr/src/app/docker_healthcheck.cjs"]
      start_period: 40s
    labels:
      - "homepage.group=Notes"
      - "homepage.name=Trilium"
      - "homepage.icon=trilium.png"
      - "homepage.href=https://notes.${HOST_NAME:-pi.lan}"
      - "homepage.description=Personal knowledge base and notes"
      # No homepage.widget: none exists for Trilium, and a note count would be
      # a single account's private data on a shared dashboard anyway.
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.trilium.rule=Host(`notes.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.trilium.entrypoints=websecure"
      # frame-deny would send DENY, which blocks *same-origin* framing too, and
      # Trilium frames itself twice: the print/PDF view (`?print#`) and the
      # bundled pdf.js viewer. Both break silently. It already sends SAMEORIGIN
      # via helmet; this only stops Traefik overwriting it, as nextcloud-frame
      # and vaultwarden-frame do.
      - "traefik.http.middlewares.trilium-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      # lan@docker alone: Trilium runs the OIDC flow itself. Forward-auth would
      # also cover /etapi, /api/clipper and /mcp, none of which can complete an
      # interactive portal. Same rationale as Kavita's OPDS clients.
      - "traefik.http.routers.trilium.middlewares=trilium-frame@docker,lan@docker"
      - "traefik.http.routers.trilium.tls=true"
      - "traefik.http.services.trilium.loadbalancer.server.port=8080"
    cpu_shares: *cpu-prio-batch
    # Node with the note tree and search index in memory: ~200 MB idle, peaking
    # on an import or a full-text reindex.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # Beside FreshRSS because it is the same job for the sites that publish no
  # feed: a price, a stock status, a school menu.
  changedetection:
    <<: *service-defaults
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.7@sha256:096dae27b5d677b89f0e810fff95a70403271aa3ff3b6437952d2db9be7e74c5
    container_name: pi-changedetection
    profiles: ["changedetection", "all"]
    networks:
      # Not just for Traefik: outbound HTTP to arbitrary hosts *is* the job, so
      # an internal-only segment would break it. Same as freshrss and searxng.
      #
      # It is also the only one. ntfy is on frontend too, so the Apprise URL the
      # bootstrap seeds resolves here as shelfmark's does; the `ntfy` segment is how
      # backrest and dockhand reach ntfy *without* frontend, and this is the
      # last container that should be given their :9898 and :3000.
      - frontend
    expose:
      - 5000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Only used for the link a notification carries back to the diff.
      - BASE_URL=https://changes.${HOST_NAME:-pi.lan}
      # The image defaults to DEBUG: ~15 journald lines per page fetched.
      - LOGGER_LEVEL=INFO
      # Upstream's default is 5. Each worker holds a page plus the lxml tree it
      # parses, on four cores shared with Postgres and a model server.
      - FETCH_WORKERS=3
      # Monitored sites would otherwise see this stack's hostname in the Referer.
      - HIDE_REFERER=true
      - DISABLE_VERSION_CHECK=true
      # The SSRF gate, and what makes a fetcher of arbitrary URLs safe on
      # `frontend`: a watch resolving to a private address is refused, on the
      # fetch and not only when saved. Upstream's default, pinned because
      # flipping it is what would open the LAN. See docs/SECURITY.md.
      - ALLOW_IANA_RESTRICTED_ADDRESSES=false
      # No provider configured, and pointing one at agentgateway would mean
      # opening the gate above - llm.api_base goes through it too. Off rather
      # than a button that always errors.
      - LLM_FEATURES_DISABLED=true
    volumes:
      # No database: settings, the watch list and the brotli history snapshots.
      # No PUID either - the container runs as root and owns this tree.
      - ${DATA_LOCATION:-./data}/changedetection:/datastore
      - ./config/changedetection/healthcheck.py:/healthcheck.py:ro
    healthcheck:
      <<: *healthcheck-relaxed
      # python3 is the only HTTP client in the image, and the probe asserts the
      # fetch workers are alive: the watch list answers 200 with the pool dead.
      test: ["CMD", "python3", "/healthcheck.py"]
      start_period: 40s
    labels:
      - "homepage.group=News"
      - "homepage.name=changedetection.io"
      - "homepage.icon=changedetection.png"
      - "homepage.href=https://changes.${HOST_NAME:-pi.lan}"
      - "homepage.description=Web page change monitoring and alerts"
      - "homepage.widget.type=changedetectionio"
      - "homepage.widget.url=http://pi-changedetection:5000"
      # The datastore's own token, copied out by homepage-widgets-bootstrap.sh.
      - "homepage.widget.key={{HOMEPAGE_FILE_CHANGEDETECTION_API_KEY}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.changedetection.rule=Host(`changes.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.changedetection.entrypoints=websecure"
      # No OIDC upstream and its own password is a single shared one, so
      # forward-auth is the gate - which needs changes.__HOST_NAME__ in
      # config/authelia/configuration.yml.template, or every request 403s.
      - "traefik.http.routers.changedetection.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.changedetection.tls=true"
      - "traefik.http.services.changedetection.loadbalancer.server.port=5000"
    cpu_shares: *cpu-prio-batch
    # 110 MiB idle with three workers here, 141 MiB peak while fetching and
    # compressing two pages. The headroom is for one page's lxml tree.
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize
