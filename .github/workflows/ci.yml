name: CI

on:
  push:
    branches: [main, develop]
  # No base-branch filter: stacked PRs (a feature branch targeting another
  # feature branch) must run CI too.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  # Every static check lives in scripts/lint.sh, which `make lint` also runs:
  # a contributor's green run and a green CI run mean the same thing, and a
  # tightened rule cannot land in one without the other.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        # fetch-depth 0: the gitleaks gate scans history, and the default
        # shallow clone would hand it a single commit and report "no leaks".
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # hadolint, actionlint and gitleaks are not installed: scripts/lint.sh
      # runs those from pinned images, so their versions are declared once and
      # apply to a local run too.
      #
      # ruff and yamllint come from requirements-lint.txt for the same reason:
      # unpinned, a linter release would redden pull requests that changed
      # nothing, and CI would stop agreeing with a contributor's `make lint`.
      # shellcheck is the runner image's apt version, which moves only when
      # GitHub bumps ubuntu-latest.
      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-lint.txt

      - name: Run every static check
        env:
          # A gate whose tool is missing is a silent hole in CI, so make it a
          # failure here even though a local run only reports it.
          LINT_STRICT: "1"
        run: make lint

  validate:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Validate Docker Compose config
        env:
          DATA_LOCATION: /tmp/pi-pcloud-ci-data
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config >/dev/null
          # Validate with every per-service profile enabled too, so optional
          # services' definitions are checked even though they carry profiles.
          COMPOSE_PROFILES=all docker compose -f compose.yaml config >/dev/null
          # stremio-lan is deliberately outside "all" (it is the alternative to
          # stremio, never both), so the run above never renders it: without
          # this second one, a typo in its block would only fail for the user
          # who enables the profile.
          COMPOSE_PROFILES=stremio-lan docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.test.yaml config >/dev/null

  tests:
    name: Test Installer and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Runs install.sh's own functions against stubbed network detection and
      # a temporary .env, so the paths that decide what lands in .env are
      # covered without a LAN or any change to the host.
      - name: Run installer test suites
        run: make test

  smoke-test:
    name: Smoke Test Stack Startup
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    env:
      HOST_NAME: test.local
      ADMIN_USER: testuser
      EMAIL: test@example.com
      PASSWORD: testpassword123
      HOST_LAN_IP: 192.168.1.100
      TIMEZONE: UTC
      CLOUDFLARE_ZONE_ID: ci-zone-placeholder
      CLOUDFLARE_DNS_API_TOKEN: ci-token-placeholder
      COMPOSE_FILE: compose.yaml:compose.test.yaml
      COMPOSE_ANSI: never
      COMPOSE_REMOVE_ORPHANS: "1"
      COMPOSE_PROGRESS: quiet
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Computed, never listed here: a hand-written list is how a newly added
      # optional service ends up never started in CI with nothing to report it.
      # tests/ci-profiles.py reads the merged render and picks one profile per
      # service compose.test.yaml has not marked ci-excluded — and refuses when
      # that selection would drag an excluded service in with it, which is how
      # gluetun once joined the run through shelfmark's profile.
      - name: Select the services CI can start
        run: |
          set -euo pipefail
          profiles="$(DATA_LOCATION=/tmp/pi-pcloud-ci-data COMPOSE_PROFILES=all,stremio-lan,ci-excluded \
            docker compose --env-file /dev/null config --format json \
            | python3 tests/ci-profiles.py)"
          echo "COMPOSE_PROFILES=${profiles}" >> "$GITHUB_ENV"
          echo "CI will start these profiles: ${profiles}"

      - name: Create CI .env
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          HOST_NAME=test.local
          ADMIN_USER=admin
          EMAIL=test@example.com
          PASSWORD=testpassword123
          HOST_LAN_IP=192.168.1.100
          TIMEZONE=UTC
          CLOUDFLARE_ZONE_ID=ci-zone-placeholder
          CLOUDFLARE_DNS_API_TOKEN=ci-token-placeholder
          DATA_LOCATION=/tmp/pi-pcloud-ci-data
          # Defined but empty, which is what an install without native IPv6 or
          # hairpin NAT has. Left out entirely, compose warns about both on
          # every single call and buries the log it is meant to help read.
          HOST_LAN_SUBNET6=
          WAN_HAIRPIN_IP=
          EOF
          # The same line a real install carries, so run-if-enabled.sh gates the
          # hooks below on the selection rather than on its legacy fallback.
          echo "COMPOSE_PROFILES=${COMPOSE_PROFILES}" >> .env
          rm -rf /tmp/pi-pcloud-ci-data

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # scripts/run-hooks.sh, not a list of its own: CI kept one for a year and
      # it drifted, so Prowlarr started here with no config.xml (the first-run
      # wizard, not the External auth a real install gets) and ntfy and Uptime
      # Kuma with no ntfy.env at all.
      - name: Render generated configs, the way the boot sequence does
        run: |
          set -euo pipefail
          sh ./scripts/run-hooks.sh pre-start

          # Make all generated files world-readable so docker compose (and the Docker
          # daemon) can open env_files regardless of the runner's umask or ownership.
          chmod -R a+rX /tmp/pi-pcloud-ci-data

          # Guard against bind-mount path type mismatches in CI
          test -f ./config/headplane/config.yaml
          test ! -d ./config/headplane/config.yaml
          test -f /tmp/pi-pcloud-ci-data/authelia-config/secrets/vaultwarden_admin_token_hash
          test ! -d /tmp/pi-pcloud-ci-data/authelia-config/secrets/vaultwarden_admin_token_hash
          test -f ./config/headscale/config.yaml
          test -f ./config/headscale/policy.hujson

      - name: Pull images
        run: |
          set -euo pipefail
          # Deliberately no COMPOSE_PROGRESS override: plain progress prints one
          # line per refresh per layer, which buries the log, and the job-wide
          # quiet still lets the daemon's error name the image that failed.
          #
          # The runner's free space is printed because it has run out here
          # before, on immich-machine-learning's torch layers, and "failed to
          # register layer" reads like a registry fault until you see the disk.
          df -h /
          for attempt in 1 2 3; do
            if docker compose pull --ignore-buildable --policy missing; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "::warning::Pull attempt ${attempt}/3 failed; retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "::error::Image pull failed after 3 attempts"
          exit 1

      - name: Start the stack
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 360 --pull missing --yes
          docker compose ps

          # A floor, not a count: a profile selection that half-breaks still
          # starts *something*, and every check below would pass having looked
          # at four containers.
          started="$(docker compose ps --services | wc -l)"
          echo "started ${started} services"
          if [ "${started}" -lt 24 ]; then
            echo "::error::only ${started} services started, expected at least 24"
            exit 1
          fi

      # Nextcloud's CI healthcheck accepts 503 because the first database
      # install takes longer than the start period, so `--wait` passing says
      # nothing about whether it finished. This does: installed:true is the only
      # answer that means the schema is in place.
      - name: Check Nextcloud finished installing
        run: |
          set -euo pipefail
          for _ in $(seq 1 24); do
            body="$(docker compose exec -T nextcloud \
              curl -fsS http://localhost/status.php 2>/dev/null || true)"
            case "${body}" in
              *'"installed":true'*)
                echo "${body}"
                exit 0
                ;;
            esac
            sleep 5
          done
          echo "::error::Nextcloud never reported installed:true"
          docker compose exec -T nextcloud curl -sS -i http://localhost/status.php || true
          exit 1

      # The one thing `up --wait` cannot see: every healthcheck it ran talked to
      # a container on its own port, and none of them went through Traefik.
      - name: Probe the reverse proxy
        run: sh ./tests/routing-smoke.sh

      # The other half of the boot sequence. Blocking, unlike on a real boot: a
      # bootstrap that cannot finish is what this is here to catch, where on the
      # Pi it is a slow service that the next start picks up.
      - name: Run the bootstraps the boot sequence runs
        env:
          # headscale is ci-excluded, so there is no container for its init to
          # talk to; pihole-bootstrap downloads twenty blocklists and updates
          # gravity, which is a network flake looking for somewhere to happen.
          HOOKS_SKIP: headscale-init.sh pihole-bootstrap.sh
        run: sh ./scripts/run-hooks.sh post-start blocking

      # Every one of them claims to be idempotent — they run on every single
      # boot — and nothing has ever checked it. A second pass that changes
      # something, or fails on what the first pass wrote, fails here.
      - name: Run them again, to prove they are idempotent
        env:
          HOOKS_SKIP: headscale-init.sh pihole-bootstrap.sh
        run: sh ./scripts/run-hooks.sh post-start blocking

      - name: Collect logs on failure
        if: failure()
        run: |
          df -h /
          docker compose ps --all
          docker compose logs --timestamps

      - name: Tear down stack
        if: always()
        run: |
          docker compose down -v
          sudo rm -rf /tmp/pi-pcloud-ci-data
