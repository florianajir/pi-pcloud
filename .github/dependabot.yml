version: 2
updates:
  # Docker images in root Compose files
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Base images in custom Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/config/backrest"
      - "/config/beszel-agent"
      - "/config/parakeet"
      - "/config/piper"
      - "/config/system-tools"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Pinned linters (ruff, yamllint) shared by `make lint` and the CI lint job
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    # codeql-action's sub-actions refuse to run against each other across
    # versions, so a PR bumping one of them alone fails CI. Keep them together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
