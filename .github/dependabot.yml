version: 2
updates:
  # Docker images in the Compose files. Both directories are listed because the
  # fetcher does not recurse and does not follow compose `include:`: compose.yaml
  # itself pins nothing (every service image lives in compose/), while the root
  # still holds compose.test.yaml's unbound pin.
  # That directory's files are named compose-<domain>.yaml, not <domain>.yaml,
  # for the same fetcher: it matches basenames against
  # /(docker-)?compose(-[\w]+)?(?>\.[\w-]+)?\.ya?ml/i, which "core.yaml" can
  # never satisfy. Renaming them back would end every image-bump PR silently,
  # with no error anywhere; tests/compose-invariants.py fails the build instead.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/compose"
    # Images that must carry their sibling's tag. Ungrouped they arrive as two
    # pull requests and auto-merge lands them minutes apart; the skew is a
    # runtime API mismatch, not a startup failure, so the smoke test starts both
    # halves and says nothing. Patterns match dependency names, which carry no
    # registry prefix: "ghcr.io/immich-app/..." would match nothing, silently.
    # immich-app/postgres is left out on purpose - it versions independently.
    groups:
      immich:
        patterns:
          - "immich-app/immich-server"
          - "immich-app/immich-machine-learning"
      n8n:
        patterns:
          - "n8nio/n8n"
          - "n8nio/runners"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Base images in custom Dockerfiles. Same fetcher shape as above - one
  # directory listing, no descent - so every config/<svc>/Dockerfile needs its
  # own entry here or its base image is never bumped, silently.
  # tests/compose-invariants.py compares this list against the Dockerfiles on
  # disk in both directions, a stale entry included: Dependabot errors on a
  # directory holding no Dockerfile rather than skipping it.
  - package-ecosystem: "docker"
    directories:
      - "/config/backrest"
      - "/config/beszel-agent"
      - "/config/parakeet"
      - "/config/piper"
      - "/config/system-tools"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Pinned linters (ruff, yamllint) shared by `make lint` and the CI lint job
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    # codeql-action's sub-actions refuse to run against each other across
    # versions, so a PR bumping one of them alone fails CI. Keep them together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
